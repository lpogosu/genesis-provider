# RuboCop для сгенерированного кода в output/. Основной .rubocop.yml
# исключает output/, потому что сгенерированный класс проверяется отдельно —
# этой конфигурацией. Команда (её же берёт стадия Validators):
#
#   bundle exec rubocop --config config/rubocop_generated.yml output/<provider>_service.rb
#
# Наследует всё от основного конфига и ослабляет только то, что для
# сгенерированного класса оправдано. Style/Documentation, Layout/EndOfLine,
# Lint/* и Security/* остаются в силе.
inherit_from: ../.rubocop.yml

AllCops:
  Exclude:
    - 'vendor/**/*'

# Сервис провайдера — один класс с четырьмя методами контракта, операциями
# вне контракта и таблицами; 150 строк он превышает по построению.
Metrics/ClassLength:
  Enabled: false

# check_conditions — последовательность guard-строк по условиям спецификации,
# build_payload — таблица «поле → выражение», process_callback и
# verify_signature! — линейные протоколы. Разбивать их на хелперы значило бы
# спрятать таблицу, которую сверяют со спецификацией.
# Длина build_<операция>_payload — это размер тела запроса у провайдера, а
# не наше решение: у Airwallex одна операция создания карты несёт семьдесят
# полей. Разбивать такую таблицу на хелперы значило бы спрятать её от того,
# кто сверяет её со спецификацией.
Metrics/MethodLength:
  Max: 30
  AllowedMethods:
    - check_conditions
  AllowedPatterns:
    - '\Abuild_\w*payload\z'
Metrics/AbcSize:
  Max: 40
Metrics/CyclomaticComplexity:
  Max: 12
Metrics/PerceivedComplexity:
  Max: 12

# Ключи payload — дословные имена полей из спецификации провайдера
# (`address_line_1`, `xref_tag_9`). Переименовать их нельзя: запрос уйдёт с
# неправильным именем поля. Стиль имён здесь задаёт спецификация, а не мы,
# поэтому правило к сгенерированному коду неприменимо по построению.
Naming/VariableNumber:
  Enabled: false
