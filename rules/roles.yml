# rules/roles.yml — словарь «имя поля в спецификации → роль в IR».
#
# Зачем. Имён полей у провайдеров бесконечно много, ролей в платёжной области
# ровно шестнадцать (SpecGen::IR::Roles::FIELD). Ядро в lib/ работает только с
# ролями и не знает ни одного имени поля; всё знание об именах живёт здесь.
# Поддержка нового провайдера = новые строки в этом файле, а не ветка в коде.
#
# Источник. Академическая база — composite schema matching (COMA, Rahm &
# Bernstein 2001; Do & Rahm 2002): несколько независимых матчеров со своими
# весами. Словарь синонимов — обязательный отдельный матчер, потому что
# строковые метрики не связывают семантически разные имена (классический
# пример из литературы — Ship и Deliver). Никаких нейросетей и эмбеддингов:
# только точное сравнение, токены, регулярные выражения и структура схемы.
#
# Состав записи:
#   names    обязателен, непустой. Точное совпадение после нормализации,
#            наибольший вес.
#   tokens   необязателен. Частичное совпадение (фрагмент имени), вес ниже —
#            сюда кладём только то, что само по себе двусмысленно.
#   types    необязателен. Значения OpenAPI `type`.
#   formats  необязателен. Значения OpenAPI `format`.
#   patterns необязателен. Обязаны компилироваться как Regexp.
#   parents  необязателен. Подсказка StructureMatcher по имени родителя —
#            вложенного свойства или схемы. Сравнение идёт по ТОКЕНАМ имени
#            родителя, а не по строке целиком: подсказка `error` обязана
#            срабатывать и на свойстве `error`, и на схеме `PayoutError`,
#            и на `error_details`. Поэтому в parents пишутся односложные
#            смысловые слова, а не имена схем конкретных провайдеров.
#   avoid_parents необязателен. Обратная подсказка: родитель, при котором
#               синоним роли значит НЕ эту роль. `state` под `address` — штат,
#               а не статус; `type` под `error` — вид ошибки, а не способ
#               зачисления. Запрет снимает только словарный голос, слабые
#               сигналы считаются как обычно: если роль всё-таки выведется,
#               она выведется эвристикой и попадёт в отчёт. Слово, стоящее
#               одновременно в `parents` и в `avoid_parents`, — ошибка
#               загрузки.
#   locations   необязателен. Где роль ожидается параметром операции:
#               header | path | query | cookie. Подсказка StructureMatcher:
#               ключ идемпотентности и подпись живут в заголовках,
#               идентификатор операции — в пути.
#   samples     необязателен. Образцы значений роли. ConstraintMatcher
#               проверяет ими `pattern` из спецификации: шаблон, который
#               принимает образец телефона и не принимает образец карты, —
#               шаблон телефона, как бы поле ни называлось. Каждый образец
#               обязан подходить под один из `patterns` роли — загрузчик
#               это проверяет.
#   enum_values необязателен. Значения enum, по которым узнаётся роль
#               (например, способы зачисления у recipient_type). Статусы и
#               коды валют здесь не перечисляются: их дают rules/statuses.yml
#               и rules/currencies.yml.
#   lengths     необязателен. Значения `maxLength`, характерные для роли
#               (3 у кода валюты). Слабый сигнал.
#   bounds      необязателен, true. Числовые границы `minimum` / `maximum`
#               характерны для роли (сумма). Слабый сигнал.
#
# Нормализация имени: нижний регистр, любые разделители → `_`, схлопывание.
# Поэтому `bankCode`, `bank-code`, `BANK_CODE` — одно и то же имя.
#
# ЧЕГО ЗДЕСЬ ДЕЛАТЬ НЕЛЬЗЯ:
#   1. Одно имя в двух ролях. Загрузчик падает и называет обе роли.
#      Особо внимательно: bank_code/bank_name, created_at/completed_at,
#      error_code/status, external_id/provider_operation_id.
#   2. Добавлять роли. Ключи ролей закрыты в IR::Roles::FIELD; незнакомый
#      ключ — ошибка загрузки. Новая роль — это изменение модели, оно
#      делается вместе с docs/PRINCIPLES.md и docs/IR.md.
#   3. Класть сюда `request_id` / `x_request_id` в роль external_id. Это
#      заголовки идемпотентности, они описаны в rules/idempotency.yml; имена
#      идемпотентности разрешено пересекать только с ролью idempotency_key.
#   4. Класть в `names` имя, у которого в платёжных API нет одного
#      устойчивого смысла. Такое имя должно остаться неопознанным: по
#      доктрине трёх уровней доверия молчаливая ошибка хуже warning.
#
# Осознанно НЕ включённые имена (оставлены неопознанными намеренно):
#   reference      — у одних провайдеров это наш идентификатор, у других их
#                    (ср. Adyen: merchantReference против pspReference)
#   reason         — у части провайдеров это код, у части текст; выбор между
#                    error_code и error_message сделать нечем
#   description    — встречается у любого поля, не признак error_message
#   token          — у одних это токен авторизации, у других подпись запроса
#   account/schet  — счёт получателя; в IR::Roles::FIELD нет роли «счёт», а
#                    подменять ею card_number нельзя. Обязательное поле с
#                    таким именем попадёт в payload как nil + TODO
#   number         — «номер» чего угодно: карты, телефона, заказа
#   merchant_id    — идентификатор магазина, а не операции
#   updated_at     — время последнего изменения, не время завершения
#   timestamp      — в вебхуках это метка подписи, а не время создания
#   result_code    — у Adyen resultCode это исход авторизации (Authorised,
#                    Refused, Received), то есть статус; у части других
#                    провайдеров — код ошибки. Выбор между status и
#                    error_code сделать нечем; поле остаётся неопознанным с
#                    предупреждением и слотом x-specgen-role
#   iban, account_number — реквизит счёта. Роли «счёт» в IR::Roles::FIELD
#                    нет, а подменять ею card_number нельзя: IBAN уехал бы
#                    провайдеру в поле номера карты. Прямо этот случай
#                    называет docs/PRINCIPLES.md («реквизит, которого нет в таблице
#                    requisites, вслепую не генерируется») и ответ экспертов
#                    25. Поле остаётся с TODO и строкой в INTEGRATION.md
#   correlation_id — у Velo и Open Banking это идентификатор трассировки
#                    запроса, уникальный на каждый повтор; принять его за наш
#                    идентификатор операции значит потерять дедупликацию
#   reference_id   — «ссылка» без указания, чья: у Square наша, у части
#                    провайдеров их (та же причина, что у голого reference)
#   channel, scheme — у одних это способ зачисления, у других канал
#                    уведомления и платёжная система карты
#   nonce          — и ключ идемпотентности, и одноразовое значение подписи
#   value_date, booking_date — банковская дата валютирования и дата проводки:
#                    это не время создания заявки и не время её завершения, а
#                    третья величина, которой в IR роли нет. Замер показал их
#                    у двух провайдеров каждую, но добавление `value_date` в
#                    created_at сразу дало неверную роль полю запроса
#                    depositbank.yaml — ровно тот случай, ради которого
#                    написано правило 4 выше
#   title          — короткий заголовок ошибки RFC 7807; лежит в одной схеме
#                    с `detail`, поэтому вторым синонимом создавал бы конфликт
#                    ролей на каждом теле problem+json
#   errorType      — вид ошибки, а не её код; у Adyen лежит рядом с errorCode
#                    в одной схеме и отобрал бы у него роль
#   method         — слово из generic_tokens: `payment_method` синоним, а
#                    голое `method` роль получает только по значениям enum
#                    вместе с родителем (так это работает на cardpay.yaml)
#
# Замер по корпусу (6 сентября 2026, 33 публичные спецификации, 3177
# операций, 6832 схемы, ~57 000 свойств): 88 имён этого файла добавлены по
# результатам замера, каждое встречено минимум у одного провайдера. Полный
# разбор — в отчёте исследования; здесь остались только те имена, у которых
# в платёжной области один устойчивый смысл.
#
# Различие external_id и provider_operation_id (критично, путать нельзя):
#   external_id            — НАШ идентификатор операции, который мы передаём
#                            провайдеру в запросе (он же operation.id на
#                            стороне платформы). Мы его порождаем.
#   provider_operation_id  — идентификатор, который ПРОВАЙДЕР присвоил
#                            операции и вернул в ответе; им мы потом
#                            опрашиваем статус и сопоставляем вебхуки.
#   Проверка при добавлении синонима: кто порождает значение? Мы —
#   external_id, провайдер — provider_operation_id.
#
# Записи внутри каждого списка отсортированы по алфавиту, ключи ролей — тоже:
# порядок обхода влияет на порядок предупреждений в report.md, а вывод обязан
# быть байт-в-байт детерминированным.

version: 1

# Композитный матчер полей (COMA): четыре независимых матчера голосуют за
# роли, балл роли — сумма «вес матчера × балл его сигнала», уверенность —
# доля набранного от суммы всех весов. Точный синоним из `names` — уровень
# справочника: роль получает источник registry с уверенностью справочника, а
# остальные голоса лишь подтверждают. Всё остальное — эвристика с той
# уверенностью, которую насчитали.
#
# Матчеры двух видов. name и constraint ОПОЗНАЮТ роль: без их голоса
# кандидата нет вообще. structure и type только ПОДТВЕРЖДАЮТ: где поле
# лежит и какого оно типа, само по себе роли не называет — под родителем
# `recipient` лежат пять ролей, а строкой объявлена почти каждая.
#
# ЧЕГО ЗДЕСЬ ДЕЛАТЬ НЕЛЬЗЯ: поднимать вес одного матчера до порога. Ни один
# матчер в одиночку не должен достигать threshold — загрузчик это проверяет.
# Роль по единственному сигналу — догадка, а догадка обязана попасть в отчёт.
matchers:
  # Порядок величин: имя сильнее ограничений, ограничения и расположение
  # равны (pattern телефона и родитель `error` одинаково красноречивы), тип
  # слабее всех — он почти всегда string.
  weights:
    name: 5
    constraint: 4
    structure: 4
    type: 1

  scoring:
    # Ниже — роль всё равно присваивается лучшему кандидату, но решение
    # попадает в отчёт и в TODO сгенерированного кода.
    threshold: 0.6
    # Отрыв от второго кандидата по уверенности. Меньше — неоднозначно: роль
    # присваивается лучшему (при равенстве — первому по порядку
    # IR::Roles::FIELD), но с отчётом.
    margin: 0.1
    # Эвристика никогда не заявляет 1.0.
    ceiling: 0.95

  # NameMatcher: словарь → токены → расстояние Левенштейна. Баллы сигналов
  # в долях от веса матчера.
  name:
    # Токен из `tokens` роли встретился среди токенов имени.
    token: 1.0
    # Доля общих токенов с лучшим синонимом (Жаккар), умноженная на overlap;
    # ниже min_overlap общих токенов слишком мало, чтобы голосовать.
    overlap: 0.8
    min_overlap: 0.5
    # Токены, которые встречаются в имени чего угодно. Общий токен из этого
    # списка сам по себе голоса не даёт (`debug_id` ~ `id`, `full_name` ~
    # `bank_name`, `method` ~ `payment_method`), а токен из `tokens` роли,
    # попавший сюда (`code`), опознаёт роль только вместе с родителем:
    # `error.code` — кандидат, `countryCode` — нет. Как точные синонимы
    # (`id`, `type`) они по-прежнему работают — здесь речь только о
    # частичном совпадении.
    generic_tokens: [account, caption, code, data, date, description, detail, details, full,
                     id, identifier, info, key, merchant, message, method, name, number, reason,
                     response, result, short, text, time, title, type, value, x]
    # Сходство по Левенштейну с лучшим синонимом, умноженное на levenshtein;
    # только при сходстве не ниже min_similarity и имени не короче
    # min_length символов — короткие имена похожи на всё.
    levenshtein: 0.5
    min_similarity: 0.8
    min_length: 4

  # ConstraintMatcher: pattern, example, enum, maxLength, minimum/maximum.
  # Первые три опознают роль, length и bounds только подтверждают: иначе
  # `page` с `minimum: 1` стал бы кандидатом в сумму.
  constraint:
    # `pattern` совпал с шаблоном роли дословно или принимает её образцы
    # (`samples`) и не принимает образцы других ролей.
    pattern: 1.0
    # `example` из спецификации подходит под шаблон роли.
    example: 0.6
    # Доля значений enum, прочитанных как статусы, коды ISO 4217 или
    # `enum_values` роли; ниже min_enum_share голоса нет.
    enum: 1.0
    min_enum_share: 0.5
    # `maxLength` из `lengths` роли; числовые границы у роли с `bounds`.
    length: 0.3
    bounds: 0.3

  # StructureMatcher: родитель и расположение.
  structure:
    parent: 1.0
    location: 1.0

  # TypeMatcher: `format` из `formats` роли; `type` из `types` роли.
  type:
    format: 1.0
    compatible: 1.0

  # Роли, которые в одной схеме законно носят два поля. Пока таких нет: две
  # суммы или два статуса в одном объекте — конфликт, о котором надо
  # сообщить, а не тихо оставить обоим.
  repeatable: []

roles:
  amount:
    names:
      - amount
      - amount_due
      - amount_minor
      - amount_money
      - amount_paid
      - amount_total
      - amount_value
      - charge_amount
      - deposit_amount
      - gross_amount
      - invoice_amount
      - order_amount
      - paid_amount
      - payment_amount
      - payout_amount
      - price
      - settlement_amount
      - source_amount
      - sum
      - summa
      - target_amount
      - total
      - total_amount
      - transaction_amount
      - transfer_amount
      - value
    tokens: [amt]
    # string — PayPal и другие передают сумму строкой вида "9.87".
    types: [integer, number, string]
    parents: [amount, deposit, money, payment, payout, transaction, transfer]
    bounds: true

  bank_code:
    # bic/bik — латиница и транслит одного и того же: российские провайдеры
    # пишут и так и так. member_id — идентификатор участника в СБП.
    names:
      - aba
      - aba_routing_number
      - bank_bic
      - bank_bik
      - bank_code
      - bank_id
      - bank_identifier
      - bic
      - bik
      - bsb
      - bsb_code
      - bsb_number
      - clearing_code
      - clearing_number
      - ifsc
      - institution_id
      - institution_number
      - member_id
      - routing_number
      - sort_code
      - swift
      - swift_bic
      - swift_code
    tokens: [routing]
    types: [string]
    # Первый шаблон — БИК РФ (9 цифр), второй — SWIFT/BIC по ISO 9362.
    patterns:
      - '^\d{9}$'
      - '^[A-Z]{6}[A-Z0-9]{2}([A-Z0-9]{3})?$'
    # БИК Сбербанка (публичный) и SWIFT Deutsche Bank.
    samples: ['044525225', 'DEUTDEFF']
    parents: [bank, beneficiary, destination, payee, recipient]

  bank_name:
    names:
      - bank
      - bank_caption
      - bank_full_name
      - bank_name
      - bank_short_name
      - bank_title
      - financial_institution_name
      - institution_name
      - naimenovanie_banka
      - recipient_bank
    types: [string]
    parents: [bank, beneficiary, destination, payee, recipient]

  card_number:
    # pan вынесен в tokens: как отдельное имя встречается редко, зато как
    # фрагмент — часто (masked_pan, pan_masked, card_pan).
    names:
      - card
      - card_no
      - card_num
      - card_number
      - encrypted_card_number
      - encrypted_number
      - masked_card
      - masked_card_number
      - masked_number
      - masked_pan
      - nomer_karty
      - primary_account_number
    tokens: [pan]
    types: [string]
    patterns:
      - '^\d{13,19}$'
      - '^\d{6}\*{6}\d{4}$'
    # Тестовый номер карты, маскированный номер.
    samples: ['4111111111111111', '411111******1111']
    parents: [card, destination, payee, recipient]

  completed_at:
    # Время перехода в терминальный статус. `updated_at` сюда НЕ входит.
    names:
      - approved_at
      - captured_at
      - closed_at
      - completed
      - completed_at
      - completed_date
      - completed_time
      - completion_date
      - completion_time
      - confirmed_at
      - executed_at
      - execution_date
      - finalized_at
      - finished_at
      - paid_at
      - paid_date
      - paid_time
      - posted_at
      - processed_at
      - processed_on
      - processed_time
      - settled_at
      - settled_date
      - settlement_date
      - succeeded_at
      - time_completed
      - time_processed
    types: [integer, string]
    formats: [date-time]

  created_at:
    names:
      - create_time
      - created
      - created_at
      - created_date
      - created_on
      - created_time
      - creation_date
      - creation_time
      - date_created
      - initiated_at
      - registered_at
      - requested_at
      - submitted_at
      - time_created
    types: [integer, string]
    formats: [date-time]

  currency:
    # ccy в tokens: сам по себе фрагмент, встречается как ccy, ccy_code,
    # src_ccy. Шаблон — буквенный код ISO 4217.
    names:
      - currency
      - currency_code
      - currency_iso
      - iso_currency
      - payment_currency
      - payout_currency
      - settlement_currency
      - source_currency
      - target_currency
      - transaction_currency
      - valuta
      - valyuta
    tokens: [ccy]
    types: [string]
    patterns:
      - '^[A-Z]{3}$'
    samples: ['RUB', 'USD']
    lengths: [3]
    parents: [amount, deposit, money, payment, payout, transaction, transfer]

  error_code:
    # Голое `code` намеренно НЕ в names, а в tokens: в спеках так называют и
    # код ошибки, и код валюты, и код банка. Токен `code` есть и в
    # generic_tokens, поэтому он опознаёт роль только вместе с родителем
    # error/failure: `error.code` — уверенный вывод, `currency.code` и
    # `countryCode` остаются без роли и попадают в report.md, а не в
    # молчаливую ошибку.
    names:
      - decline_code
      - err_code
      - error_code
      - failure_code
      - reason_code
      - refusal_reason_code
      - rejection_code
      - response_code
      - status_reason_code
    tokens: [code]
    types: [integer, string]
    # bad, duplicate, invalid — схема, названная самой ошибкой, а не словом
    # «ошибка»: BadRequestSchema, DuplicateResourceSchema,
    # InvalidResourceStateSchema у Dwolla. Слова выбраны такие, каких не
    # бывает в имени схемы успеха; подсказка родителя всё равно только
    # подтверждает кандидата, которого открыл слабый токен `code`, поэтому
    # шире поля с именем «код» она ничего не задевает.
    parents: [bad, decline, duplicate, error, errors, failure, fault, invalid, problem,
              refusal, rejection]

  error_message:
    names:
      - decline_reason
      - error_description
      - error_detail
      - error_message
      - error_text
      - failure_message
      - failure_reason
      - message
      - reason_text
      - rejection_reason
      - status_detail
      - status_message
    # `detail` — поле RFC 7807 (application/problem+json), «подробное
    # объяснение именно этого случая». Слово добавлено и в generic_tokens,
    # поэтому роль оно опознаёт только вместе с родителем-ошибкой:
    # `problem.detail` — кандидат, `card.detail` — нет. Соседнее `title` того
    # же RFC намеренно НЕ добавлено: у 7807 оба поля лежат в одной схеме, и
    # второй токен превратил бы каждое такое тело в конфликт ролей вместо
    # вывода.
    tokens: [detail, msg]
    types: [string]
    parents: [decline, error, errors, failure, fault, problem, rejection]

  external_id:
    # НАШ идентификатор операции у провайдера (см. шапку файла).
    names:
      - client_order_id
      - client_reference
      - client_reference_id
      - client_transaction_id
      - customer_reference
      - external_id
      - external_identifier
      - external_operation_id
      - external_reference
      - invoice_number
      - merchant_order_id
      - merchant_reference
      - merchant_transaction_id
      - order_id
      - order_number
      - order_reference
      - partner_order_id
      - partner_transaction_id
      - reference_number
      - sender_batch_id
      - sender_item_id
      - sender_reference
      - shop_order_id
    types: [integer, string]
    formats: [uuid]
    # UUID носят и наш идентификатор, и идентификатор провайдера, и ключ
    # идемпотентности: шаблон у всех трёх, поэтому UUID в спецификации сам
    # по себе роли не выбирает — выбирает имя или расположение.
    patterns:
      - '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
    samples: ['123e4567-e89b-12d3-a456-426614174000']

  idempotency_key:
    # Роль относится и к полю тела, и к заголовку (IR::Parameter тоже несёт
    # роль). Имена пересекаются с rules/idempotency.yml — это единственное
    # разрешённое пересечение, оно осознанное.
    names:
      - idempotence_key
      - idempotency_key
      - idempotency_token
      - paypal_request_id
      - request_id
      - x_idempotence_key
      - x_idempotency_key
      - x_request_id
      - x_unique_transaction_id
    types: [string]
    formats: [uuid]
    patterns:
      - '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
    samples: ['123e4567-e89b-12d3-a456-426614174000']
    locations: [header]

  provider_operation_id:
    # Идентификатор, присвоенный ПРОВАЙДЕРОМ (см. шапку файла). Голое `id`
    # оставлено в names: в ответе провайдера это почти всегда его собственный
    # идентификатор, а вложенные `id` разводит подсказка по родителю.
    # `provider_id` исключён намеренно: это идентификатор самого провайдера,
    # а не операции.
    names:
      - acquirer_id
      - acquirer_reference
      - batch_id
      - capture_id
      - charge_id
      - deposit_id
      - gateway_transaction_id
      - id
      - invoice_id
      - operation_id
      - payment_id
      - payout_batch_id
      - payout_id
      - payout_item_id
      - provider_operation_id
      - provider_payment_id
      - provider_transaction_id
      - psp_id
      - psp_reference
      - refund_id
      - remote_id
      - session_id
      - transaction_id
      - transaction_key
      - transfer_code
      - transfer_id
    tokens: [trx, txn]
    types: [integer, string]
    formats: [uuid]
    # Тот же шаблон UUID, что у external_id и idempotency_key: см. external_id.
    patterns:
      - '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
    samples: ['123e4567-e89b-12d3-a456-426614174000']
    parents: [deposit, operation, payment, payout, transaction, transfer]
    # /payouts/{payout_id}: идентификатор ресурса стоит в пути.
    locations: [path]

  recipient_phone:
    names:
      - beneficiary_phone
      - cell
      - cell_phone
      - contact_phone
      - customer_mobile
      - customer_phone
      - mobile
      - mobile_number
      - mobile_phone
      - msisdn
      - payee_phone
      - phone
      - phone_number
      - recipient_phone
      - recipient_phone_number
      - telefon
      - telephone
      - telephone_number
    types: [string]
    # Первый шаблон — E.164, второй — российский номер как в спеке NovaPay.
    patterns:
      - '^\+?\d{10,15}$'
      - '^7\d{10}$'
    samples: ['79001234567', '+79001234567']
    parents: [beneficiary, contact, destination, payee, recipient]

  recipient_type:
    # Голое `type` оставлено намеренно: в платёжных схемах у получателя это
    # почти всегда способ зачисления (sbp/card/account). Вне родителя-
    # получателя вес совпадения гасится подсказкой parents.
    #
    # Замер 6 сентября 2026: `type` встречается в 24 спецификациях из 33 и
    # значит там три разные вещи — способ зачисления, вид транзакции (Lithic:
    # AUTHORIZATION, BALANCE_INQUIRY) и вид ошибки (Adyen: errorType). Без
    # структурного контекста словарь дал бы третьему и второму случаю
    # молчаливую ложную роль. Отсюда avoid_parents.
    names:
      - account_type
      - beneficiary_type
      - destination_type
      - payee_type
      - payment_method
      - payment_method_type
      - payout_method
      - recipient_type
      - settlement_type
      - transfer_method
      - transfer_type
      - type
    types: [string]
    # Способы зачисления, которыми провайдеры перечисляют тип получателя.
    enum_values: [account, bank_account, card, iban, phone, sbp, wallet]
    parents: [beneficiary, destination, payee, recipient]
    # Родители, при которых синоним этой роли значит НЕ эту роль. Запрет
    # снимает только словарный голос: слабые сигналы (enum способов
    # зачисления, токен) считаются как обычно, и если роль всё-таки
    # выведется, она выведется эвристикой и попадёт в отчёт.
    avoid_parents: [address, billing, card, error, errors, event, failure, fault, notification,
                    problem, rejection, shipping, webhook]

  signature:
    # Имена заголовков подписи перечислены в rules/signatures.yml; пересечение
    # с этой ролью разрешено, с любой другой — ошибка загрузки.
    names:
      - checksum
      - digest
      - hmac
      - hmac_signature
      - podpis
      - sign
      - signature
    # signature и в tokens: заголовок X-Anything-Signature — заголовок
    # подписи, как бы ни назывался провайдер.
    tokens: [sig, signature]
    types: [string]
    locations: [header]

  status:
    names:
      - current_status
      - deposit_status
      - operation_status
      - order_status
      - outcome
      - payment_state
      - payment_status
      - payout_state
      - payout_status
      - refund_status
      - settlement_status
      - state
      - status
      - transaction_state
      - transaction_status
      - transfer_state
      - transfer_status
    types: [string]
    # `state` значит статус в 13 спецификациях из 33, но в Checkout.com и
    # Stripe это ещё и штат в адресе: в enum лезут AK, AL, AZ. Роль по имени
    # без структурного контекста дала бы адресу карту статусов из названий
    # штатов — молча. Отсюда avoid_parents; список намеренно короткий и
    # состоит из слов, которых не бывает в имени схемы платёжной операции.
    avoid_parents: [address, billing, delivery, location, shipping]
