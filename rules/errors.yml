# rules/errors.yml — что сгенерированный сервис делает, получив ошибку.
#
# Зачем. Ответ провайдера с кодом ошибки надо не только распознать, но и
# обработать: повторить, повторить с паузой, отклонить операцию, поднять
# тревогу или передать человеку. Это политика, а не разбор, и она одинакова
# для всех провайдеров с точностью до имён кодов — поэтому она данные здесь,
# а не ветки в ErrorAnalyzer. Новый провайдер с непривычным кодом ошибки =
# новая строка шаблона, а не новый if.
#
# Источники. Классы и точные HTTP-коды — RFC 9110 (семантика HTTP): 4xx —
# ошибка клиента, повтор без изменений бессмыслен; 5xx — ошибка сервера,
# повтор уместен; 429 и 503 могут нести Retry-After (RFC 9110, §10.2.3).
# Шаблоны имён кодов — общая практика платёжных API (Stripe, Adyen,
# ЮKassa, СБП): rate_limit / throttled, unavailable / timeout / internal,
# insufficient_funds / balance, not_found / invalid / validation.
#
# Значения действий закрыты константой SpecGen::IR::Roles::ERROR_ACTION:
#   reject         операция отклоняется, повтор не поможет
#   retry          повторить сразу (редко: 408, 425)
#   retry_backoff  повторить с нарастающей паузой; Retry-After, если объявлен
#   alert          тревога дежурному: сломаны учётные данные или права,
#                  повтор будет падать так же
#   escalate       решение человека: денег на балансе провайдера нет, лимит
#                  исчерпан — платформа сама этого не починит
#   dedup          НЕ назначается здесь (см. ниже)
#
# Спорные решения, принятые осознанно:
#   401/403 → alert, не reject. Сама выплата, может быть, и корректна, но
#     пока ключ невалиден, упадёт каждая следующая — это инцидент, а не
#     отказ одной операции.
#   402 Payment Required → retry_backoff. У платёжного провайдера это «на
#     вашем балансе недостаточно средств». Мы сначала поставили escalate
#     (повтор не поможет, баланс пополняет человек), но таблица «Обработка
#     ошибок» в описании кейса говорит «retry later», а эксперты 5 сентября
#     2026 велели ориентироваться на неё: баланс пополняют между попытками,
#     поэтому повтор с паузой корректнее эскалации. Отклонять операцию
#     клиента из-за нашего баланса по-прежнему нельзя.
#   409 → reject по умолчанию. Конфликт при повторе с тем же ключом
#     идемпотентности — это дедупликация, но узнать её можно только по
#     схеме ответа (409 возвращает ту же схему, что 201), а не по коду:
#     у NovaPay 409 на отмене — обычный отказ. Поэтому dedup выводит
#     анализатор структурно и никогда не читает отсюда.
#   amount_limit_exceeded → escalate, хотя лимит на одну операцию —
#     скорее reject. Различить лимит операции и суточный лимит по имени
#     нельзя, а ошибочный reject потеряет операцию, тогда как escalate
#     отдаст её человеку. Отказоустойчивое направление.
#
# Порядок шаблонов — приоритет: побеждает первый совпавший. rate_limit
# стоит раньше limit_exceeded именно поэтому: rate_limit_exceeded — это
# пауза, а не эскалация. Шаблоны сравниваются с нормализованным кодом
# (нижний регистр, разделители → `_`).
#
# ЧЕГО ЗДЕСЬ ДЕЛАТЬ НЕЛЬЗЯ:
#   1. Писать dedup. Загрузчик его не примет: дедупликация — структурный
#      факт спецификации (совпадение схем), а не политика.
#   2. Писать шаблон под конкретного провайдера («np_err_17»). Шаблон
#      обязан описывать смысл слова, а не строку одного API; провайдерские
#      коды без смысла в имени закрываются overlay (x-specgen-error-actions).
#   3. Делать retry без backoff действием по классу 5xx. Сервер, который
#      уже упал, от плотного повтора не встанет.
#   4. Поднимать default_confidence. Действие по умолчанию всегда идёт с
#      предупреждением error_action_unknown; высокая уверенность спрятала
#      бы его от человека.

version: 1

# Когда не совпал ни HTTP-код, ни класс, ни шаблон имени. Применяется только
# вместе с предупреждением error_action_unknown.
default_action: reject
default_confidence: 0.3

# Правило по шаблону имени кода: имя — соглашение провайдера, а не стандарт,
# поэтому уверенность ниже, чем у правила по HTTP-коду (0.9).
pattern_confidence: 0.8

# Заголовок ответа с паузой до повтора (RFC 9110, §10.2.3). Ответ, который
# его объявляет, получает retry_after: true.
retry_after_header: Retry-After

http:
  # По классу — когда точного кода ниже нет.
  classes:
    4xx: reject
    5xx: retry_backoff
  # Точные коды побеждают класс.
  codes:
    401: alert          # Unauthorized: ключ невалиден
    402: retry_backoff  # Payment Required: баланс провайдера, описание кейса
    403: alert          # Forbidden: нет прав у ключа
    408: retry          # Request Timeout: соединение, а не запрос
    409: reject         # Conflict: дедупликацию выводит анализатор по схеме
    423: retry_backoff  # Locked: ресурс временно заблокирован
    425: retry          # Too Early
    429: retry_backoff  # Too Many Requests
    501: reject         # Not Implemented: повтор не поможет
    505: reject         # HTTP Version Not Supported

# Шаблоны имени кода ошибки провайдера, в порядке приоритета.
codes:
  - name: rate_limit
    pattern: 'rate_limit|throttl|too_many'
    action: retry_backoff
  - name: transient
    pattern: 'unavailable|timeout|timed_out|internal|temporar|try_again|busy|maintenance'
    action: retry_backoff
  - name: credentials
    pattern: 'unauthori|forbidden|invalid_(?:api_)?key|invalid_token|access_denied|permission'
    action: alert
  # Нехватка средств на балансе провайдера: описание кейса даёт «retry
  # later» для insufficient_balance, эксперты 5 сентября 2026 подтвердили
  # эту таблицу как канон. Баланс пополняется между попытками.
  - name: funds
    pattern: 'insufficient|balance|funds'
    action: retry_backoff
  # Лимит на ОДНУ операцию: сумма вне допустимого диапазона провайдера.
  # Эксперты 5 сентября 2026 дали канон прямо (вопрос 22 в
  # docs/QUESTIONS.md): «считать лимитом на эту выплату… отклонять операцию,
  # не отдавать человеку». Повтор с той же суммой даст тот же ответ, а
  # человеку тут нечего решать — сумму задал клиент.
  - name: operation_limit
    pattern: 'amount_limit|limit_exceeded|exceeds_limit|above_limit|below_limit|out_of_range'
    action: reject
  # Исчерпанная квота — другое: суточный или месячный лимит провайдера сам
  # собой восстановится, но не в окне ретраев. Эксперты там же: суточный
  # лимит «ближе к другим сценариям… своих daily-лимитов на стороне
  # оркестратора». Решает человек.
  - name: quota
    pattern: 'quota|daily_limit|monthly_limit|velocity'
    action: escalate
  # Ручная проверка: комплаенс, санкционные списки, KYC. Повтор не поможет и
  # отказом это ещё не является — решение принимает человек, как и с лимитами.
  - name: review
    pattern: 'compliance|kyc|aml|sanction|manual_review|under_review|verification_required'
    action: escalate
  - name: rejected
    pattern: 'not_found|invalid|validation|malformed|duplicate|unsupported|not_allowed|expired|declined|blocked|cancel|closed|mismatch'
    action: reject
