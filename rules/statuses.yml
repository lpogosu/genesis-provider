# rules/statuses.yml — статус провайдера → внутренний статус платформы.
#
# Зачем. Внутренних статусов ровно три (SpecGen::IR::Roles::INTERNAL_STATUS):
# in_progress, approved, rejected. Статусов у провайдеров — десятки названий
# для тех же трёх состояний. Ядро сравнивает только с внутренними статусами,
# все названия провайдеров живут здесь.
#
# Источники:
#   canonical — канон кейса, подтверждён экспертами: pending и processing →
#               in_progress, completed → approved, failed и cancelled →
#               rejected. Продублирован в CLAUDE.md.
#   synonyms  — словарь синонимов из CLAUDE.md плюс расширение по практике
#               платёжных API. Это уровень 2 доверия: применяем, но помечаем
#               в IR как derived: :registry.
#   ambiguous — статусы, у которых в индустрии нет одного смысла. Никогда не
#               маппим молча: warning в report.md и слот в overlay.
#
# Сравнение идёт после нормализации: нижний регистр, разделители → `_`
# (`IN_PROGRESS`, `In Progress`, `in-progress` — одно и то же). Адрес события
# вебхука (`payout.completed`) снимает анализатор до сравнения: адресом
# считается то, что отделено `.`, `:` или `/`, и таких префиксов здесь не
# перечисляем. А вот ведущие слова внутри самого имени (`authAdjustment` в
# `authAdjustmentRefused`) — не адрес, и снимать их молча нельзя: об этом
# ниже, секции modifiers и tail_confidence.
#
# ЧЕГО ЗДЕСЬ ДЕЛАТЬ НЕЛЬЗЯ:
#   1. «Улучшать» канон. cancelled по канону кейса идёт в rejected, хотя
#      логически отмена — отдельное состояние, а не отказ. Платформа знает
#      только три статуса, и эксперты подтвердили именно такое отображение.
#      Менять эту строку можно только новым ответом экспертов.
#   2. Повторять один и тот же статус провайдера в двух местах. Загрузчик
#      падает, если статус встречается под двумя внутренними статусами или
#      одновременно в synonyms и в ambiguous.
#   3. Добавлять внутренние статусы. Значения canonical и ключи synonyms
#      берутся только из IR::Roles::INTERNAL_STATUS.
#   4. Разрешать спорный статус «на глазок». Если у слова есть два прочтения
#      в индустрии — оно идёт в ambiguous. Молчаливая ошибка в платёжной
#      интеграции дороже одного ручного шага.
#   5. Класть в modifiers слово, которое само по себе статус. Список нужен
#      для ведущих слов, меняющих смысл соседнего статуса, а не для имён
#      состояний: `partial` там уместен, `pending` — нет.
#
# Спорные решения, принятые осознанно:
#   accepted → in_progress. Слово двусмысленное: у части провайдеров это
#     «запрос принят к обработке», у части — «средства зачислены». Взяли
#     in_progress по двум причинам: так записано в каноне синонимов CLAUDE.md,
#     и это отказоустойчивое направление — при ошибке операция останется в
#     опросе статуса и дождётся терминального события, тогда как ошибочный
#     approved пометит невыплаченные деньги как выплаченные. Вопрос вынесен
#     экспертам (docs/QUESTIONS.md); если ответ будет иным — строка
#     переезжает в ambiguous.
#   sending → in_progress. Промежуточное состояние отправки в платёжную
#     сеть: терминальным не бывает ни у одного провайдера. Рядом с sent,
#     который уже был в словаре.
#   under_review → in_progress. Ручная проверка комплаенса. Спорно рядом с
#     blocked, который лежит в ambiguous, и различие такое: blocked — это
#     результат проверки, который бывает и окончательным, а under_review —
#     сама проверка, то есть состояние по определению непройденное. Выбрано
#     отказоустойчивое направление, как у accepted: операция останется в
#     опросе и дождётся терминального события.
#   on_hold, hold → ambiguous. Заморозка средств и ручная проверка требуют
#     разных действий платформы, а по названию их не различить.
#   reversed, refunded → ambiguous. Операция сначала была успешной, потом
#     развёрнута; это не «отказ в проведении» и не «в процессе».
#   authorized → ambiguous. В карточной схеме средства только захолдированы.
#     Британское authorised — отдельной строкой: сравнение точное, а не по
#     основе слова.
#   booked, posted, cleared → approved. Банковская лексика проводки: деньги
#     списаны со счёта и отражены в выписке. У Adyen booked описан прямо:
#     «the funds are deducted from your user's balance account».
#   received, approval_pending → in_progress. Запрос принят и ждёт своей
#     очереди; терминальным это состояние не бывает.
#   revoked → rejected. Отзыв уже выданного разрешения: для платформы это
#     то же, что отмена.
#   chargeback → ambiguous, по той же причине, что refunded и reversed:
#     операция была успешной, деньги вернулись позже.
#   confirmed → ambiguous. Подтверждение приёма запроса или подтверждение
#     зачисления — зависит от провайдера.
#   open, opened → in_progress. «Открыт» значит «ещё не закрыт»: у Mollie
#     это расчёт, который ещё не сформирован («The settlement has not been
#     closed yet»), у ЮKassa — сделка в работе. Терминальным это состояние
#     не бывает ни у одного из них.
#   requested → in_progress. Запрос подан и ждёт исполнения; у Mollie
#     перевод в статусе requested ждёт подтверждения SCA. Обратное слово
#     unrequested статусом операции не является и в словарь не входит.
#   processed, paidout, paid_out → approved. Причастие прошедшего времени:
#     «обработан», «выплачен» (Mollie: «The transfer has been successfully
#     processed and the funds have been sent», «The settlement has been paid
#     out»). Соседний processing отличается одной буквой и значит обратное,
#     поэтому пара выписана явно: processing — канон in_progress, processed
#     — завершение. Имена полей мы уже читаем так же: processed_at и
#     time_processed лежат в completed_at (rules/roles.yml).
#   awaiting, awaiting_review → in_progress. «Ожидает» — то же, что waiting,
#     который в словаре уже был; у Revolut awaiting стоит в одном enum с
#     created, failed, expired и cancelled, то есть терминальным не бывает.
#   reverted → ambiguous. У одних провайдеров это reversed (операция была
#     успешной и развёрнута), у других — «возвращено на доработку», то есть
#     ещё в работе. Различить по имени нечем.
#   incomplete → ambiguous. «Незавершённое» читается и как «ещё идёт», и как
#     «брошено клиентом»; у Klarna это состояние сессии, которая может и
#     завершиться, и не завершиться никогда.
#   pending_execution, pending_reimbursement, pending_review,
#     processing_at_bank, waiting_for_capture → in_progress. Составные
#     имена, у которых смысл задаёт ГОЛОВА, а не хвост: «ждёт исполнения»,
#     «ждёт проверки», «ждёт списания». Анализатор читает составное имя с
#     хвоста (см. tail_confidence) и на таком имени сказал бы либо ничего,
#     либо не то, поэтому они перечислены целиком. Сюда не попали имена, у
#     которых ожидание относится не к операции, а к другой сущности
#     (pending_boarding и pending_external у Mollie — это подключение
#     способа оплаты, а не движение денег).
#   reviewable → in_progress, рядом с under_review. У Moov это значение
#     стоит в одном enum с pending, canceled, failed и processed: «перевод
#     требует проверки», то есть проверка ещё не пройдена. То же
#     отказоустойчивое направление, что у under_review.
#   unclaimed → in_progress. Выплата ждёт, пока получатель её заберёт: у
#     PayPal невостребованная выплата возвращается отправителю только через
#     30 дней, до этого операция не терминальна.
#   onhold → ambiguous, ровно как on_hold: то же слово без разделителя,
#     PayPal пишет его слитно (ONHOLD).
#   undefined → ambiguous, ровно как unknown: провайдер не называет
#     состояние (Adyen Transfers объявляет такое значение в enum статуса).
#
# Порядок: canonical идёт в порядке жизненного цикла операции, как в описании
# кейса, — так его проще сверять с первоисточником. Остальные списки
# отсортированы по алфавиту ради детерминированного вывода.

version: 1

# Ведущие слова, которые меняют смысл статуса, стоящего за ними. Имя вида
# `PART_DONE` читается как `DONE`, только если забыть про `PART`, — а
# частично проведённый платёж не выплачен. Такое имя анализатор оставляет
# невыведенным с предупреждением, вместо того чтобы пометить невыплаченные
# деньги как выплаченные; ровно за этим `partially_completed` лежит в
# `ambiguous` ниже, и список продолжает ту же мысль на составные имена.
#
# Здесь только сами модификаторы: слово `part` и его формы, отрицания и
# приставки неполноты. Слова, называющие тип операции (`auth`, `capture`,
# `chargeback`, `atm_withdrawal`), сюда не входят — они не меняют исход,
# и `authAdjustmentRefused` читается как `refused` (см. tail_confidence).
modifiers:
  - almost
  - non
  - not
  - part
  - partial
  - partially
  - pre
  - quasi
  - semi
  - sub
  - un

# Уверенность статуса, прочитанного по хвосту составного имени:
# `capturedExternally` -> `captured`, `authAdjustmentRefused` -> `refused`.
# Ведущие слова отброшены, а они могли значить что-то важное, поэтому
# значение ниже порога матчеров 0.6 намеренно: такое чтение обязано попасть
# в отчёт как допущение прогона, а не пройти молча. Хвост после разделителя
# сегмента (`payout.completed`) уверенность не понижает: там префикс — адрес
# события, а не часть имени статуса.
tail_confidence: 0.5

# Канон кейса. Не расширять: сюда попадает только то, что подтверждено
# экспертами дословно.
canonical:
  pending: in_progress
  processing: in_progress
  completed: approved
  failed: rejected
  cancelled: rejected

synonyms:
  approved:
    - approved
    - booked
    - captured
    - cleared
    - complete
    - credited
    - disbursed
    - done
    - executed
    - finished
    - fulfilled
    - ok
    - paid
    - paid_out
    - paidout
    - posted
    - processed
    - settled
    - succeeded
    - success
    - successful
  in_progress:
    - accepted
    - approval_pending
    - awaiting
    - awaiting_review
    - created
    - in_flight
    - in_progress
    - initiated
    - new
    - open
    - opened
    - pending_approval
    - pending_execution
    - pending_reimbursement
    - pending_review
    - processing_at_bank
    - queued
    - received
    - requested
    - reviewable
    - scheduled
    - sending
    - sent
    - started
    - submitted
    - unclaimed
    - under_review
    - waiting
    - waiting_for_capture
  rejected:
    - canceled
    - declined
    - denied
    - error
    - expired
    - failure
    - refused
    - rejected
    - returned
    - revoked
    - timed_out
    - timeout
    - void
    - voided

# Для каждого статуса — почему он неоднозначен. Текст попадает в report.md
# как объяснение предупреждения, поэтому пишется для человека, который будет
# принимать решение руками.
ambiguous:
  authorised: "британское написание authorized; у Adyen это «средства зарезервированы», у других — «списаны»"
  authorized: "средства захолдированы, но не переведены: между in_progress и approved"
  chargeback: "успешная операция, деньги отозваны держателем карты"
  blocked: "блокировка комплаенсом бывает и временной, и окончательной"
  confirmed: "подтверждение приёма запроса или подтверждение зачисления — зависит от провайдера"
  hold: "то же, что on_hold, короткая форма"
  incomplete: "незавершённое: и «ещё идёт», и «брошено клиентом»"
  on_hold: "может значить и заморозку средств, и ручную проверку"
  onhold: "то же, что on_hold, слитное написание"
  partially_completed: "часть суммы проведена: платформа не умеет выражать частичный результат"
  refunded: "успешная операция, деньги затем возвращены"
  reversed: "успешная операция, затем развёрнута провайдером"
  reverted: "и «развёрнута», как reversed, и «возвращена на доработку»"
  suspended: "приостановлено: может возобновиться, а может завершиться отказом"
  undefined: "то же, что unknown: состояние не названо"
  unknown: "провайдер сам не знает состояние операции"
