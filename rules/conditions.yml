# rules/conditions.yml — условная обязательность, вычитанная из прозы.
#
# Зачем. «bank_code обязателен при type=sbp» выражается в JSON Schema
# формально: dependentRequired, if/then/else, а для OpenAPI 3.0 —
# зарегистрированными расширениями x-jsonschema-if / x-jsonschema-else.
# Если провайдер описал условие только словами в description, мы обязаны это
# заметить, но не имеем права выдать догадку за факт: получается условие с
# origin :description_hint, честно низкой уверенностью и предупреждением
# conditional_required_hint, к которому приложен готовый фрагмент Overlay.
#
# Почему шаблоны здесь, а не в коде. Это лексика, а не логика: список слов
# растёт от провайдера к провайдеру и от языка к языку, а уверенность —
# число, которое настраивают по результатам прогона, а не константа в
# исходнике. Никакой семантики: регулярные выражения и именованные группы.
#
# Состав шаблона:
#   name     как шаблон называется в отчёте;
#   pattern  регулярное выражение с именованной группой field (имя соседнего
#            поля, от которого зависит обязательность) и, если условие
#            про равенство, группой value (ожидаемое значение);
#   kind     equals — условие на значение, presence — на наличие.
#
# Шаблон без группы value даёт условие «обязателен, когда соседнее поле
# задано» — это ровно семантика dependentRequired.
#
# ЧЕГО ЗДЕСЬ ДЕЛАТЬ НЕЛЬЗЯ:
#   1. Писать шаблон под конкретную спецификацию: имена полей и значений
#      («sbp», «bank_code») в выражении недопустимы, их даёт группа.
#   2. Поднимать confidence. Намёк из прозы остаётся намёком: анализатор
#      обязан выдать предупреждение и слот в overlay, а не тихое правило.
#   3. Забывать про кириллицу: \w в Ruby по умолчанию только ASCII, поэтому
#      хвосты русских слов пишутся через [[:alpha:]].
#
# Проверка захвата — за анализатором: имя из группы field обязано быть
# соседним свойством той же схемы, иначе совпадение отбрасывается. Это
# отсекает ложные срабатывания вроде «minimum is 100».

version: 1

required_when:
  # Уверенность условия, выведенного из описания. Ниже 0.6 — порога, с
  # которого начинают матчеры, — намеренно: это сигнал «посмотри глазами»,
  # а не готовое правило.
  confidence: 0.5

  patterns:
    - name: equals
      kind: equals
      # «обязателен для type=sbp», «required when type is card»,
      # «only for recipient_type = card». Отрицательный просмотр вперёд
      # отсекает «is present» — это не значение, это следующий шаблон.
      pattern: '(?i)(?:required|mandatory|only for|обязател[[:alpha:]]*|необходим[[:alpha:]]*|нужен|только для)[^.;]{0,40}?(?<field>[a-z_][a-z0-9_]*)\s*(?:==|=|:|\bis\b|\bequals\b|равен|равно)\s*["''«]?(?!(?:present|set|provided|missing|null|empty)\b)(?<value>[a-z0-9_.\-]+)'

    - name: presence_after
      kind: presence
      # «required when account_id is present», «if bic is set».
      pattern: '(?i)(?:required|mandatory|обязател[[:alpha:]]*|необходим[[:alpha:]]*)[^.;]{0,40}?(?:when|if|если|при наличии)\s+["'']?(?<field>[a-z_][a-z0-9_]*)["'']?\s*(?:is\s+(?:present|set|provided)|указан[[:alpha:]]*|присутствует|задан[[:alpha:]]*)'

    - name: presence_before
      kind: presence
      # «обязателен, если указан bic» — в русском глагол стоит перед
      # именем поля, поэтому это отдельный шаблон, а не ветка первого.
      pattern: '(?i)(?:обязател[[:alpha:]]*|необходим[[:alpha:]]*|required)[^.;]{0,40}?(?:если|при наличии|when|if)\s+(?:указан[[:alpha:]]*|задан[[:alpha:]]*|передан[[:alpha:]]*|присутствует)\s+["'']?(?<field>[a-z_][a-z0-9_]*)'

# Ограничение операции по статусу, высказанное прозой: «Отмена возможна
# только в статусах pending и processing», «can be cancelled only while
# pending». Это другое условие взаимодействия (IR::Condition, вид
# cancel_status_restriction), не условная обязательность поля, — но той же
# природы: лексика, а не логика, поэтому живёт здесь же, отдельной секцией.
#
# Шаблон обязан захватывать группу `statuses` — хвост фразы, в котором
# анализатор ищет слова, совпадающие со значениями enum поля статуса. Слово,
# которого нет ни в одном enum, условием не становится: совпадение без
# известного статуса — предупреждение condition_unclear, не догадка.
status_restriction:
  # Выше, чем у условной обязательности: здесь совпадают не произвольные
  # слова, а значения enum, объявленные самой спецификацией. Ровно порог
  # матчеров, не больше: фраза всё равно прочитана регулярным выражением.
  confidence: 0.6

  patterns:
    - name: only_in_statuses_ru
      pattern: '(?i)(?:только|лишь)\s+(?:в|для|из)\s+(?:статус[[:alpha:]]*|состояни[[:alpha:]]*)\s+(?<statuses>[^.;]+)'

    - name: only_in_status_en
      pattern: '(?i)\bonly\s+(?:in|for|when|while)\s+(?:the\s+)?(?:status(?:es)?|state)\s+(?:is\s+|are\s+|in\s+)?(?<statuses>[^.;]+)'

    - name: can_be_cancelled_when
      pattern: '(?i)\b(?:can|may)\s+(?:only\s+)?be\s+cancell?ed\s+(?:only\s+)?(?:when|while|if|in)\s+(?:the\s+)?(?:status\s+(?:is\s+)?)?(?<statuses>[^.;]+)'
