# rules/currencies.yml — экспонента минорной единицы по коду валюты.
#
# Зачем. Множитель между суммой платформы (major units, рубли) и суммой
# провайдера (обычно minor units, копейки) определяется НЕ словом «копейках»
# в description, а кодом валюты и стандартом. 10^exponent — весь множитель.
#
# Источник. ISO 4217 «Codes for the representation of currencies», таблица
# A.1 (действующие коды) и таблица A.3 (фонды и служебные коды). Список
# поддерживается ISO 4217 Maintenance Agency; снимок таблицы сделан
# 2026-09-04 и включает изменения последних лет: SLE вместо SLL, ZWG вместо
# ZWL, XCG вместо ANG, добавленные VED и UYW.
#
# Как пользуется ядро (порядок вывода единиц из docs/PRINCIPLES.md):
#   1. amount_unit из overlay — высший приоритет;
#   2. type: integer + известный код валюты → minor units, множитель
#      10^exponent;
#   3. type: number с дробным example → major units, множитель 1;
#   4. сверка с minimum/description: расхождение → warning, не молчание;
#   5. код валюты не найден в таблице → default_exponent ПЛЮС обязательный
#      warning и слот в overlay. Тихо подставлять двойку нельзя.
#
# ЧЕГО ЗДЕСЬ ДЕЛАТЬ НЕЛЬЗЯ:
#   1. Править таблицу под конкретного провайдера. Отклонения от стандарта
#      встречаются: классический пример — Adyen считает ISK с двумя знаками,
#      хотя по ISO 4217 у ISK экспонента 0. Такое лечится overlay-файлом
#      провайдера (действие update над amount_unit/exponent), а не правкой
#      этой таблицы. Иначе один провайдер сломает всех остальных.
#   2. Добавлять неофициальные коды (криптовалюты, внутренние «баллы»,
#      исторические XBT). Их в ISO 4217 нет; для них — overlay.
#   3. Дублировать ключ. YAML молча оставит последнее значение, поэтому
#      загрузчик ловит дубликаты сам и падает с указанием кода.
#
# Экспоненты, отличные от 2 (всё, чего нет в этих списках, имеет 2):
#   0 — BIF, CLP, DJF, GNF, ISK, JPY, KMF, KRW, PYG, RWF, UGX, UYI, VND,
#       VUV, XAF, XOF, XPF
#   3 — BHD, IQD, JOD, KWD, LYD, OMR, TND
#   4 — CLF, UYW
#
# Отдельные случаи, зафиксированные осознанно:
#   MGA (ариари) и MRU (угия) — у них фактическая минорная единица 1/5, а не
#     1/100, но ISO 4217 присваивает им экспоненту 2. Ставим 2, как в
#     стандарте: расчёт обязан совпадать с тем, что делает провайдер.
#   XAU, XAG, XPT, XPD (металлы), XBA, XBB, XBC, XBD (расчётные единицы
#     облигационных рынков), XDR, XSU, XUA (наднациональные единицы), XTS
#     (код для тестов), XXX (операция без валюты) — минорной единицы у них
#     НЕТ ВООБЩЕ. В стандарте в графе стоит прочерк; мы записываем 0, чтобы
#     арифметика оставалась определённой, но встреча такого кода в спеке
#     платёжного провайдера сама по себе повод для предупреждения.
#   ANG (антильский гульден) выведен из обращения 2025-03-31 и заменён на
#     XCG. Оставлен в таблице: спецификации живут дольше валют, и старый код
#     ещё встречается в примерах.
#
# Коды отсортированы по алфавиту: порядок обхода влияет на порядок строк в
# отчётах, а вывод обязан быть байт-в-байт детерминированным.

version: 1

# Применяется ТОЛЬКО вместе с warning, когда код валюты не найден в таблице.
default_exponent: 2

# Слова описания поля суммы, по которым анализатор ПОДТВЕРЖДАЕТ уже
# выведенную единицу или замечает противоречие. Это уровень 3 доверия:
# слово «копейках» никогда не становится источником множителя — им остаются
# type поля и экспонента ISO 4217; но если тип говорит «минорные», а
# описание — «в рублях», это warning units_inconsistent, не молчание.
#
# Регулярные выражения, регистр не важен. Для русских слов граница слова
# пишется через (?<![[:alpha:]]): \b в Ruby различает только ASCII-буквы.
# Слово, встречающееся в обоих списках, гасит подсказку целиком.
unit_words:
  minor:
    - '(?i)(?<![[:alpha:]])копе[йе]к[[:alpha:]]*'
    - '(?i)(?<![[:alpha:]])коп\.'
    - '(?i)(?<![[:alpha:]])в центах'
    - '(?i)\bkopecks?\b'
    - '(?i)\bcents?\b'
    - '(?i)\bpence\b'
    - '(?i)\bminor units?\b'
  major:
    - '(?i)(?<![[:alpha:]])в рублях'
    - '(?i)(?<![[:alpha:]])в целых'
    - '(?i)\br(?:o)?ubles?\b'
    - '(?i)\bin (?:dollars|euros)\b'
    - '(?i)\bmajor units?\b'
    - '(?i)\bwhole units?\b'

