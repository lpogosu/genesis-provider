# rules/operations.yml — распознавание роли эндпоинта по признакам спецификации.
#
# Зачем. Роль операции (создание выплаты, опрос статуса, отмена, баланс,
# входящий вебхук) нигде в OpenAPI не объявлена. Её приходится выводить из
# нескольких независимых признаков: имени operationId, HTTP-метода, пути,
# тега, наличия тела запроса и наличия авторизации. Ни один признак сам по
# себе не решает — решает сумма взвешенных голосов.
#
# Источник подхода. Composite matcher из COMA (Rahm & Bernstein 2001,
# Do & Rahm 2002): несколько независимых матчеров, веса, агрегация, порог.
# Подход старше нейросетей на два десятилетия и полностью детерминирован:
# один и тот же вход даёт один и тот же балл, и балл можно распечатать в
# report.md как арифметику.
#
# Как читается запись роли:
#   verbs           глаголы действия в operationId (create, cancel, fetch)
#   nouns           существительные, называющие саму роль (payout, status)
#   resources       существительные ресурса, встречающиеся в пути и в
#                   operationId (payouts, payment, transaction)
#   tail            последний литеральный сегмент пути (payouts, cancel)
#   tail_parameter  true, если признаком роли является путь, который
#                   заканчивается параметром: /payouts/{id} — это чтение
#                   конкретного ресурса, а не создание нового
#   http_methods    методы, которыми роль вообще может выражаться
#   tags            теги операции (сравниваются без учёта регистра и
#                   разделителей)
#   request_body    true — у роли обязано быть тело запроса, false — тела
#                   быть не должно; ключ опущен, если признак не значим
#   unsecured       true, если `security: []` (операция без авторизации)
#     — признак роли. Так объявляют входящий вебхук: его вызывает
#     провайдер, а не мы.
#
# Как считается балл. Каждый признак голосует своим весом за все роли,
# которым он подходит. operationId голосует полным весом, если совпали и
# глагол, и существительное, и долей `partial`, если совпало только одно.
# Побеждает роль с наибольшей суммой; при равенстве — порядок ролей в этом
# файле.
#
# Уверенность = балл победителя / сумма весов признаков, которые вообще
# проголосовали хоть за кого-то. Признак, который не сработал ни для одной
# роли (например, operationId, которого в спеке нет), в знаменатель не
# входит: нельзя штрафовать вывод за отсутствие данных, о котором мы и так
# сообщаем отдельным предупреждением.
#
# ЧЕГО ЗДЕСЬ ДЕЛАТЬ НЕЛЬЗЯ:
#   1. Писать слова конкретного провайдера. payout, deposit, balance,
#      webhook — общеотраслевая лексика; название компании, её эндпоинт или
#      её способ оплаты — нет. Такое место — overlay, а не справочник.
#   2. Добавлять роль вне IR::Roles::OPERATION. Роль :unmapped описывать не
#      нужно: это результат «ни одна роль не набрала порога», а не запись.
#   3. Подгонять веса под одну спецификацию. Вес меняется только вместе с
#      прогоном по всем спекам из spec/fixtures/specs.
#
# Роли идут в порядке жизненного цикла операции, слова внутри списков — по
# алфавиту.
#
# Кроме голосования здесь описаны ещё две вещи, которые голосованием не
# выражаются:
#
#   vetoes   отсечки формы: может ли эта операция вообще играть такую роль
#   pairing  связывание операций между собой: какая операция статуса
#            опрашивает тот ресурс, который создаёт операция создания

version: 1

# Вес каждого признака. Порядок величин: имя операции сильнее пути, путь
# сильнее метода, тег слабее всех — он часто общий у половины спеки.
# unsecured весит много, потому что `security: []` в платёжном API — это
# почти всегда вебхук, и другого структурного признака вебхука в OpenAPI 3.0
# просто нет (секция `webhooks` появилась только в 3.1).
weights:
  operation_id: 5
  path_tail: 3
  unsecured: 4
  path_resource: 2
  http_method: 2
  tag: 1
  request_body: 1

scoring:
  # Доля веса, которую даёт operationId, когда совпало только одно из двух:
  # глагол без существительного (createSomething) или существительное без
  # глагола (payoutWebhook).
  partial: 0.5
  # Минимальная доля голосов у победителя. Ниже — роль не присваивается:
  # лучше строка в отчёте, чем молчаливая догадка в платёжной интеграции.
  minimum: 0.4
  # Минимальный абсолютный балл, в весах. Доли недостаточно: если из всех
  # признаков сработали только метод и наличие тела, победитель наберёт
  # 100% крошечного знаменателя, ничего при этом не зная о роли. Порог
  # равен весу operation_id: роль обязана опираться либо на имя операции,
  # либо на хвост пути вместе с ресурсом (3 + 2), а не на POST с телом.
  floor: 5
  # Минимальный отрыв от второго места, в тех же долях. Две роли с почти
  # равными баллами — это неоднозначность, а не победа одной из них.
  margin: 0.1
  # Потолок уверенности. Эвристика никогда не заявляет 1.0: даже полное
  # совпадение признаков остаётся выводом, который человек вправе
  # переопределить через overlay.
  ceiling: 0.95

# Отсечки. Голосование отвечает на вопрос «на что это похоже», отсечка — на
# вопрос «может ли эта операция вообще играть такую роль». Поэтому она
# применяется после подсчёта, к ролям по очереди сверху вниз: отвергнутая
# роль уступает следующей по баллу, а если не осталось ни одной, операция
# получает :unmapped и отдельный публичный метод.
#
# Ложная роль хуже отсутствия роли. Она затаскивает посторонний ресурс
# спецификации в контракт (`customer_create` как создание выплаты) и в
# знаменатель покрытия, и делает это молча — а :unmapped виден в отчёте.
vetoes:
  # Платёжная роль требует, чтобы в пути, в operationId или в теге операции
  # встретилось хотя бы одно существительное этой же роли — из её `nouns`,
  # `resources` или `tail` ниже. Отдельного списка слов здесь нет намеренно:
  # словарь роли и есть её словарь, а второй список рядом разошёлся бы с ним
  # на первой же правке. Голоса при этом остаются композитными: глагол,
  # метод и тело по-прежнему голосуют, отсечка лишь запрещает роль имени,
  # которое к ней не относится (`customer_create` — не создание выплаты,
  # `product_delete` — не отмена, `GET /transfers` — не баланс).
  #
  # Ролей `webhook` в списке нет: входящее уведомление называется своим
  # словом, а его главный признак — `security: []`, а не имя ресурса.
  domain_nouns:
    roles: [create_payout, create_deposit, fetch_status, cancel, confirm, refund, balance]
  # HTTP-метод, которым роль не выражается. Голосом он уже был; отсечкой
  # становится потому, что листинг, отклонённый как опрос статуса, иначе
  # уезжает в создание выплаты по одному имени ресурса в пути:
  # `GET /transfers` набирал хвост и ресурс create_payout ровно на порог, не
  # будучи ни созданием, ни выплатой.
  http_method:
    roles: [create_payout, create_deposit, fetch_status, cancel, confirm, refund, balance,
            webhook]
  # Форма успешного ответа отличает чтение одного ресурса от листинга
  # (READ_MULTI из RestTestGen, ICSE 2023): `GET /payouts` и
  # `GET /payouts/{id}` различаются не только параметром в пути, и опрашивать
  # статус конкретной выплаты у листинга нельзя. Ответ считается списком,
  # если он массив или объект, у которого после отбрасывания служебных
  # свойств осталось ровно одно — массив.
  # Служебные свойства обёртки: разметка страницы и конверт ответа, которые
  # не делают объект ресурсом. Сравниваются нормализованными, поэтому
  # `nextCursor` и `next_cursor` — одно слово.
  list_response:
    roles: [fetch_status]
    ignore: [count, cursor, first, has_more, has_next, last, limit, links, message, meta,
             metadata, next, next_cursor, next_page, offset, page, page_size, pagination,
             per_page, prev_cursor, previous, previous_cursor, previous_page, self, size,
             status, total, total_count, total_pages]

# Связывание операций друг с другом. Роли создания и опроса статуса
# выбираются не поодиночке, а парой: сервис, который создаёт один ресурс, а
# статус опрашивает у другого, выглядит рабочим и молча неверен.
#
# Источник правил — RESTler (Atlidakis, Godefroid, Polishchuk, ICSE 2019):
# producer -> consumer выводится из общего контейнера в пути, префикса пути и
# общей схемы ответа, а при равенстве предпочитается короткий access path.
# Формальная связь (Link Object, OpenAPI 3.x) весит больше всех правил
# вместе: это не вывод, а прочитанное.
pairing:
  weights:
    link: 10
    container: 4
    path_prefix: 3
    schema: 2
    resource: 2
  # Штраф за каждый сегмент пути обеих операций пары. Меньше любого веса:
  # он решает только ничьи, отдавая победу короткому пути.
  depth_penalty: 0.05
  # Насколько имя ресурса похоже на главный денежный документ провайдера.
  # Вес `resource` умножается на место в этом списке: `transfer` — почти
  # наверняка выплата, `payment` и `transaction` — что угодно, включая счёт
  # на оплату. Именно этим Paystack отличает `/transfer` от
  # `/paymentrequest`, когда голоса равны.
  resource_priority: [payout, payouts, transfer, transfers, disbursement,
                      disbursements, withdrawal, withdrawals, cashout, cashouts,
                      payin, payins, deposit, deposits, topup, topups, refill,
                      refills, charge, charges, invoice, invoices, payment,
                      payments, transaction, transactions]

roles:
  create_payout:
    # withdraw / disburse / pay — глаголы из чужих спецификаций: эксперты на
    # чекпоинте 1 привели url-withdraw как пример имени той же операции.
    verbs: [create, disburse, execute, initiate, make, new, open, pay, register, send, start,
            submit, withdraw]
    nouns: [cashout, cashouts, disbursement, disbursements, payment, payments, payout,
            payouts, transaction, transactions, transfer, transfers, withdrawal, withdrawals]
    resources: [cashout, cashouts, disbursement, disbursements, payment, payments, payout,
                payouts, transaction, transactions, transfer, transfers, withdrawal,
                withdrawals]
    tail: [cashouts, disbursements, payments, payouts, transactions, transfers, withdrawals]
    http_methods: [post]
    tags: [cashouts, disbursements, payment, payments, payout, payouts, transaction,
           transactions, transfer, transfers]
    request_body: true

  create_deposit:
    verbs: [accept, create, execute, initiate, make, new, open, register, start, submit]
    nouns: [charge, charges, deposit, deposits, invoice, invoices, payin, payins, refill,
            refills, topup, topups]
    resources: [charge, charges, deposit, deposits, invoice, invoices, payin, payins, refill,
                refills, topup, topups]
    tail: [charges, deposits, invoices, payins, refills, topups]
    http_methods: [post]
    tags: [charges, deposit, deposits, invoice, invoices, payin, payins, topup, topups]
    request_body: true

  fetch_status:
    verbs: [check, fetch, find, get, lookup, poll, query, read, retrieve, show]
    nouns: [details, info, state, status]
    resources: [charge, charges, deposit, deposits, invoice, invoices, operation, operations,
                payment, payments, payout, payouts, transaction, transactions, transfer,
                transfers]
    tail: [details, state, status]
    # /payouts/{payout_id} — чтение конкретного ресурса.
    tail_parameter: true
    http_methods: [get]
    tags: [deposit, deposits, operation, operations, payment, payments, payout, payouts,
           status, transaction, transactions, transfer, transfers]
    request_body: false

  cancel:
    verbs: [abort, cancel, decline, delete, reject, revoke, stop, void]
    nouns: [cancel, cancellation, reversal, void]
    resources: [charge, charges, deposit, deposits, operation, operations, payment, payments,
                payout, payouts, transaction, transactions, transfer, transfers]
    tail: [cancel, cancellation, cancellations, reversal, reversals, void]
    http_methods: [delete, post]
    tags: [cancellation, cancellations, deposit, deposits, operation, operations, payment,
           payments, payout, payouts, transfer, transfers]
    request_body: false

  # Подтверждение ранее созданной операции: двухфазный перевод, где создание
  # только резервирует средства, а отправляет их отдельный вызов (Adyen
  # /transfers/approve, карточный capture). На контракт не отображается:
  # BaseService не знает второй фазы, поэтому это отдельный публичный метод.
  confirm:
    verbs: [accept, approve, capture, commit, confirm, settle]
    nouns: [approval, approvals, capture, captures, confirmation, confirmations]
    resources: [charge, charges, deposit, deposits, operation, operations, payment, payments,
                payout, payouts, transfer, transfers]
    tail: [approvals, approve, capture, captures, confirm, confirmations, settle]
    http_methods: [post]
    tags: [approvals, captures, confirmations]

  # Возврат уже проведённой операции. От отмены отличается тем, что операция
  # успела завершиться: отмена останавливает незавершённое, возврат заводит
  # обратное движение денег. Поэтому reversal остался у cancel (разворот до
  # расчёта), а returns и refunds — здесь.
  refund:
    verbs: [refund, repay, return]
    nouns: [chargeback, chargebacks, refund, refunds, return, returns]
    resources: [charge, charges, payment, payments, payout, payouts, transfer, transfers]
    tail: [chargebacks, refund, refunds, return, returns]
    http_methods: [post]
    tags: [chargebacks, refund, refunds, returns]

  balance:
    verbs: [check, fetch, get, query, read, retrieve, show]
    nouns: [account, accounts, balance, balances, funds, limit, limits]
    resources: [account, accounts, balance, balances, funds]
    tail: [account, accounts, balance, balances, funds, limits]
    http_methods: [get]
    tags: [account, accounts, balance, balances, funds]
    request_body: false

  webhook:
    verbs: [accept, deliver, handle, notify, process, receive]
    nouns: [callback, callbacks, event, events, hook, hooks, notification, notifications,
            webhook, webhooks]
    resources: [callback, callbacks, event, events, hook, hooks, notification, notifications,
                webhook, webhooks]
    tail: [callback, callbacks, event, events, hook, hooks, notification, notifications,
           webhook, webhooks]
    http_methods: [post]
    tags: [callback, callbacks, event, events, notification, notifications, webhook, webhooks]
    request_body: true
    unsecured: true
