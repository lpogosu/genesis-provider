# rules/contract.yml — контракт Provider::BaseService, выраженный данными.
#
# Зачем. Это самый важный файл справочников. Если эксперты уточнят контракт —
# переименуют метод, добавят аргумент, поменяют хелпер — мы правим этот YAML,
# и всё. В ERB-шаблонах не должно остаться ни одного литерала с именем метода,
# хелпера или внутреннего статуса: шаблон спрашивает их здесь.
#
# Источник и его границы. Реального класса Provider::BaseService нам не
# выдали (подтверждено экспертами кейса). Контракт восстановлен по примеру из
# описания кейса и по ответам экспертов. У каждой записи есть поле `source`:
#   "описание кейса"  — видно в выданном примере дословно;
#   "эксперты кейса"  — подтверждено ответом эксперта;
#   "допущение"       — наш вывод, дословного подтверждения нет.
# Всё, помеченное «допущение», продублировано в docs/ASSUMPTIONS.md и попадает
# в раздел «Принятые допущения» сгенерированного INTEGRATION.md. Выдавать
# догадку за подтверждённое здесь нельзя: на защите этот файл читают как
# декларацию того, что мы знаем и чего не знаем.
#
# Связь с IR:
#   methods[*].roles — роли эндпоинтов из IR::Roles::CONTRACT
#     (create_payout, create_deposit, fetch_status, webhook). Загрузчик
#     сверяет покрытие: каждая роль контракта обязана быть реализована ровно
#     одним методом. Роли cancel и balance в контракт НЕ входят намеренно —
#     для них генерируются отдельные публичные методы, а в report.md
#     появляется строка «не отображено на контракт».
#   internal_statuses — обязан совпадать по составу с
#     IR::Roles::INTERNAL_STATUS.
#
# ЧЕГО ЗДЕСЬ ДЕЛАТЬ НЕЛЬЗЯ:
#   1. Упоминать конкретного провайдера, его поля, статусы и эндпоинты.
#      Контракт один на всех; всё провайдер-специфичное живёт в других
#      справочниках и в overlay.
#   2. Помечать источником «эксперты кейса» то, что мы вывели сами.
#   3. Добавлять метод, не сверив с описанием кейса: лишний публичный метод в
#      базовом классе — это ошибка интеграции у принимающей стороны.
#   4. Дублировать имена статусов строками в шаблонах. Шаблон обязан брать
#      их из internal_statuses.
#
# Порядок методов — как в описании кейса (жизненный цикл операции:
# предпроверка → запрос → колбэк → опрос), так их проще сверять с
# первоисточником. Хелперы отсортированы по алфавиту. internal_statuses идёт
# в порядке IR::Roles::INTERNAL_STATUS.

version: 1

base_class: "Provider::BaseService"

assumption: |
  Реального класса Provider::BaseService нам не выдали. Контракт восстановлен
  по примеру из описания кейса и подтверждениям экспертов. Это допущение,
  оно продублировано в docs/ASSUMPTIONS.md и в INTEGRATION.md. Сигнатуры
  четырёх методов и имена хелперов видны в примере; типы возвращаемых
  значений и арность части хелперов выведены нами.

methods:
  check_conditions:
    params:
      - { name: operation }
      - { name: request_method }
    returns: "success | failure"
    calls_super: true
    roles: []
    purpose: >-
      Предпроверки до обращения к провайдеру: валюта, границы суммы,
      обязательные реквизиты получателя, условная обязательность полей.
      Вызывает super, чтобы не потерять проверки базового класса.
    source: "описание кейса"

  create_request:
    params:
      - { name: operation }
      - { name: request_method, default: "'create'" }
    returns: "success | failure"
    calls_super: false
    roles: [create_payout, create_deposit]
    purpose: >-
      Создание операции у провайдера: сборка тела запроса из ролей, перевод
      суммы в единицы провайдера, заголовки авторизации и идемпотентности,
      разбор ответа и кодов ошибок.
    source: "описание кейса"

  process_callback:
    params:
      - { name: payload }
    returns: "success | failure"
    calls_super: false
    roles: [webhook]
    purpose: >-
      Обработка входящего уведомления: проверка подписи, сопоставление
      операции по идентификаторам, перевод статуса провайдера во внутренний и
      вызов approve_operation или reject_operation.
    source: "описание кейса"

  fetch_status:
    params:
      - { name: operation }
    returns: "success | failure"
    calls_super: false
    roles: [fetch_status]
    purpose: >-
      Опрос статуса операции у провайдера. Единственный путь получить статус,
      если провайдер не отправляет вебхуки.
    source: "описание кейса"

helpers:
  approve_operation:
    params:
      - { name: operation }
    purpose: "перевести операцию во внутренний статус approved"
    # Внутренний статус, в который хелпер переводит операцию: по нему шаблон
    # выбирает хелпер для статуса из STATUS_MAP, не зная имён.
    status: approved
    example: "approve_operation(operation)"
    source: "имя — описание кейса; арность — допущение"

  auth_headers:
    params: []
    purpose: >-
      Заголовки авторизации исходящего запроса. Состав собирается по
      rules/auth.yml из securitySchemes спецификации.
    example: "client.post(path, body, headers: auth_headers)"
    source: "имя — описание кейса; состав — выводится из спеки"

  client:
    params: []
    purpose: "HTTP-клиент платформы с базовым URL провайдера"
    example: "client.get(path)"
    source: "имя — описание кейса; интерфейс клиента — допущение"

  failure:
    params:
      - { name: code }
      - { name: i18n_key }
    purpose: >-
      Неуспешный результат метода: символьный код для ветвления и ключ
      локализации для сообщения пользователю.
    example: "failure(:invalid_amount, 'errors.invalid_amount')"
    source: "описание кейса"

  reject_operation:
    params:
      - { name: operation }
    purpose: "перевести операцию во внутренний статус rejected"
    status: rejected
    example: "reject_operation(operation)"
    source: "имя — описание кейса; арность — допущение"

  success:
    params: []
    purpose: "успешный результат метода"
    example: "success"
    source: "описание кейса"

# Состав обязан совпадать с IR::Roles::INTERNAL_STATUS. Порядок — как в IR:
# от незавершённого к терминальным.
internal_statuses: [in_progress, approved, rejected]

request_method:
  semantics: >-
    Логический тип действия, а не HTTP-метод. Это payment_method шлюза
    (способ проведения операции, объявленный провайдером) либо служебное
    значение вроде status или check.
  known_values: [create, status, check]
  source: "эксперты кейса"

operation:
  # operation.amount платформа хранит в major units. Провайдер почти всегда
  # ждёт minor units; множитель считается по коду валюты из
  # rules/currencies.yml (10^exponent), а не по слову «копейках» в описании.
  amount_unit: major
  amount_note: >-
    operation.amount задан в рублях (major units); множитель до единиц
    провайдера определяется экспонентой ISO 4217 для кода валюты операции.
  source: "описание кейса"

# Как сгенерированный сервис разговаривает с остальной платформой: читает
# данные операции, берёт реквизиты получателя, разбирает аргумент колбэка,
# при необходимости находит операцию и переводит отказ в код платформы.
# Реального класса Operation нам не выдали, поэтому каждое выражение здесь —
# допущение, ограниченное ответами экспертов от 5 сентября 2026 (вопросы
# 18–25 в docs/QUESTIONS.md); шаблон подставляет их как есть и не пишет ни
# одного своего. Поменялась платформа — правится этот раздел, не шаблон.
#
#   accessors      роль поля (IR::Roles::FIELD) → выражение Ruby со значением
#                  платформы. Здесь только то, что платформа гарантирует у
#                  операции: сумма, идентификаторы, статус. Сумма — в
#                  мажорных единицах, как её хранит платформа: пересчёт в
#                  единицы провайдера делает шаблон по роли amount
#                  (to_provider_units), а предпроверки сравнивают сырое
#                  значение с границей, пересчитанной в мажорные единицы.
#                  idempotency_key_for — приватный метод, который шаблон
#                  генерирует всегда.
#   requisites     реквизиты получателя. Они лежат не плоскими полями
#                  операции, а в JSONB-хеше payout_requisite; ключ верхнего
#                  уровня — payment_method шлюза, он же request_method.
#                  Отсюда methods: способ выплаты → роль → выражение.
#                  Значение enum роли recipient_type из спецификации
#                  сопоставляется с ключом по нормализованному имени, и из
#                  условной обязательности спецификации получается настоящая
#                  ветка по request_method, а не комментарий.
#                  Роли, которой здесь нет, выражения не существует:
#                  генерируется TODO и строка «куда мапить» в INTEGRATION.md
#                  (эксперты: «не генерировать вслепую»).
#   failure_codes  первый аргумент failure — код платформы в духе HTTP, а не
#                  наше действие из ERROR_MAP и не выдуманный символ.
#                  by_http — по HTTP-коду ответа провайдера; by_action — по
#                  действию ERROR_MAP, когда HTTP-кода в таблице нет;
#                  validation — любой отказ предпроверки; internal — отказы
#                  самого сервиса. Смысл отказа во всех случаях остаётся
#                  вторым аргументом, в ключе локализации.
#   lookup         роль идентификатора → выражение, находящее операцию
#                  платформы; %{value} — выражение со значением из
#                  уведомления. Пусто — сервис не ищет операцию сам.
#   writers        роль → выражение, сохраняющее значение из ответа
#                  провайдера. Пусто — сохраняет платформа вне сервиса.
#   callback       что несёт аргумент process_callback: разобранное тело
#                  уведомления и, если маршрут вебхука их передал, сырые
#                  байты и заголовки для проверки подписи.
#   result         как узнать, что результат базового класса успешный, и как
#                  вернуть платформе идентификатор созданной операции.
#
# Ответы экспертов кейса от 5 сентября 2026 сузили этот раздел трижды:
#   «сохранение будет происходить вне сервиса провайдера, сервис провайдера
#   должен сделать запрос к самому провайдеру, через абстрактный client и
#   отдать ответ» — поэтому writers пуст, а lookup вслед за ним;
#   process_callback «получает уже разобранный JSON внутри payload» —
#   поэтому callback.body это сам payload, а не payload[:body];
#   «operation.id, operation.amount, operation.payout_requisite — JSONB-хеш,
#   не плоские recipient_phone / bank_code» — поэтому плоских реквизитов в
#   accessors нет вовсе, а валюты нет и подавно: её сервис берёт из
#   спецификации.
# Механизмы остались: заполненная таблица снова включает и поиск, и запись,
# без единой правки шаблона. Это и есть проверка на универсальность.
platform:
  source: "эксперты кейса 5 сентября 2026 (вопросы 18–25 в docs/QUESTIONS.md) и допущение"
  # Поля, которые платформа гарантирует у операции. Плоских реквизитов
  # (recipient_phone, bank_code, card_number) и валюты у операции НЕТ.
  accessors:
    amount: "operation.amount"
    external_id: "operation.id"
    provider_operation_id: "operation.provider_operation_key"
    status: "operation.status"
    idempotency_key: "idempotency_key_for(operation)"
  # Реквизиты получателя из JSONB-хеша. hash — сам хеш, для документации и
  # для TODO там, где выражения нет; methods — способ выплаты платформы
  # (payment_method шлюза, он же request_method) → роль → выражение.
  requisites:
    hash: "operation.payout_requisite"
    methods:
      sbp:
        recipient_phone: "operation.payout_requisite.dig('sbp', 'phone')"
        bank_code: "operation.payout_requisite.dig('sbp', 'bank_code')"
        bank_name: "operation.payout_requisite.dig('sbp', 'bank_name')"
      card:
        card_number: "operation.payout_requisite['card_number']"
  # Коды платформы. Набор — из ответа экспертов: «символ в духе
  # HTTP/доменного кода платформы… часто :bad_request, :unauthorized,
  # :unprocessable_entity, :too_many_requests, :internal_server_error,
  # :forbidden». Выдумывать :novapay_whatever не нужно.
  failure_codes:
    # По HTTP-коду ответа провайдера. Таблица печатается в сервисе целиком:
    # провайдер вправе вернуть код, которого спецификация не объявляла.
    by_http:
      400: bad_request
      401: unauthorized
      403: forbidden
      404: not_found
      409: conflict
      422: unprocessable_entity
      429: too_many_requests
      500: internal_server_error
      502: bad_gateway
      503: service_unavailable
      504: gateway_timeout
    # Запасной путь для HTTP-кода вне таблицы: код платформы по нашему
    # действию из ERROR_MAP. Ключи — IR::Roles::ERROR_ACTION (кроме dedup:
    # дедупликация идёт успешным путём и до отказа не доходит).
    by_action:
      reject: unprocessable_entity
      retry: service_unavailable
      retry_backoff: service_unavailable
      alert: internal_server_error
      escalate: unprocessable_entity
    # Любой отказ предпроверки: набор проверок открыт (он растёт с каждым
    # ограничением спецификации), а код платформы у них один. Что именно не
    # сошлось, говорит ключ локализации вторым аргументом.
    validation: unprocessable_entity
    # Отказы самого сервиса, а не провайдера.
    internal:
      signature_missing: unauthorized
      signature_invalid: unauthorized
      signature_expired: unauthorized
      operation_not_found: not_found
      unknown_event: unprocessable_entity
      status_unknown: unprocessable_entity
      cancel_not_allowed: unprocessable_entity
      webhooks_not_supported: not_implemented
      create_not_supported: not_implemented
      status_not_supported: not_implemented
  # Пусто: см. комментарий выше. Пример заполнения для платформы, которая
  # отдаёт сервису поиск операции:
  #   provider_operation_id: "Operation.find_by(provider_operation_key: %{value})"
  #   external_id: "Operation.find_by(id: %{value})"
  lookup: {}
  # Пусто: идентификатор операции у провайдера сохраняет платформа —
  # provider_operation_key = payload.dig(:result, :id). Пример заполнения для
  # платформы, которая отдаёт запись сервису:
  #   provider_operation_id: "operation.update(provider_operation_key: %{value})"
  writers: {}
  callback:
    # Аргумент process_callback — уже разобранный JSON уведомления.
    body: "payload"
    # Сырые байты тела и заголовки: подпись считается по байтам, а разобранный
    # JSON их не сохраняет. Если маршрут вебхука кладёт их в payload под этими
    # выражениями, сервис проверит подпись сам; если нет — маршрут обязан
    # вызвать публичный verify_webhook_signature до разбора JSON. Убрать эти
    # две строки — значит выключить проверку внутри process_callback.
    raw_body: "payload['raw_body']"
    headers: "payload['headers']"
  result:
    success_predicate: "success?"
    # create_request обязан вернуть идентификатор операции у провайдера:
    # платформа делает provider_operation_key = payload.dig(:result, :id).
    # У fetch_status и process_callback результата нет: статус меняют
    # хелперы апрува и реджекта (эксперты, 5 сентября 2026).
    create_success: "success(result: { id: %{value} })"
