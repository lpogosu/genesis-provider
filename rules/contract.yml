# rules/contract.yml — контракт Provider::BaseService, выраженный данными.
#
# Зачем. Это самый важный файл справочников. Если эксперты уточнят контракт —
# переименуют метод, добавят аргумент, поменяют хелпер — мы правим этот YAML,
# и всё. В ERB-шаблонах не должно остаться ни одного литерала с именем метода,
# хелпера или внутреннего статуса: шаблон спрашивает их здесь.
#
# Источник и его границы. Реального класса Provider::BaseService нам не
# выдали (подтверждено экспертами кейса). Контракт восстановлен по примеру из
# описания кейса и по ответам экспертов. У каждой записи есть поле `source`:
#   "описание кейса"  — видно в выданном примере дословно;
#   "эксперты кейса"  — подтверждено ответом эксперта;
#   "допущение"       — наш вывод, дословного подтверждения нет.
# Всё, помеченное «допущение», продублировано в docs/ASSUMPTIONS.md и попадает
# в раздел «Принятые допущения» сгенерированного INTEGRATION.md. Выдавать
# догадку за подтверждённое здесь нельзя: на защите этот файл читают как
# декларацию того, что мы знаем и чего не знаем.
#
# Связь с IR:
#   methods[*].roles — роли эндпоинтов из IR::Roles::CONTRACT
#     (create_payout, create_deposit, fetch_status, webhook). Загрузчик
#     сверяет покрытие: каждая роль контракта обязана быть реализована ровно
#     одним методом. Роли cancel и balance в контракт НЕ входят намеренно —
#     для них генерируются отдельные публичные методы, а в report.md
#     появляется строка «не отображено на контракт».
#   internal_statuses — обязан совпадать по составу с
#     IR::Roles::INTERNAL_STATUS.
#
# ЧЕГО ЗДЕСЬ ДЕЛАТЬ НЕЛЬЗЯ:
#   1. Упоминать конкретного провайдера, его поля, статусы и эндпоинты.
#      Контракт один на всех; всё провайдер-специфичное живёт в других
#      справочниках и в overlay.
#   2. Помечать источником «эксперты кейса» то, что мы вывели сами.
#   3. Добавлять метод, не сверив с описанием кейса: лишний публичный метод в
#      базовом классе — это ошибка интеграции у принимающей стороны.
#   4. Дублировать имена статусов строками в шаблонах. Шаблон обязан брать
#      их из internal_statuses.
#
# Порядок методов — как в описании кейса (жизненный цикл операции:
# предпроверка → запрос → колбэк → опрос), так их проще сверять с
# первоисточником. Хелперы отсортированы по алфавиту. internal_statuses идёт
# в порядке IR::Roles::INTERNAL_STATUS.

version: 1

base_class: "Provider::BaseService"

assumption: |
  Реального класса Provider::BaseService нам не выдали. Контракт восстановлен
  по примеру из описания кейса и подтверждениям экспертов. Это допущение,
  оно продублировано в docs/ASSUMPTIONS.md и в INTEGRATION.md. Сигнатуры
  четырёх методов и имена хелперов видны в примере; типы возвращаемых
  значений и арность части хелперов выведены нами.

methods:
  check_conditions:
    params:
      - { name: operation }
      - { name: request_method }
    returns: "success | failure"
    calls_super: true
    roles: []
    purpose: >-
      Предпроверки до обращения к провайдеру: валюта, границы суммы,
      обязательные реквизиты получателя, условная обязательность полей.
      Вызывает super, чтобы не потерять проверки базового класса.
    source: "описание кейса"

  create_request:
    params:
      - { name: operation }
      - { name: request_method, default: "'create'" }
    returns: "success | failure"
    calls_super: false
    roles: [create_payout, create_deposit]
    purpose: >-
      Создание операции у провайдера: сборка тела запроса из ролей, перевод
      суммы в единицы провайдера, заголовки авторизации и идемпотентности,
      разбор ответа и кодов ошибок.
    source: "описание кейса"

  process_callback:
    params:
      - { name: payload }
    returns: "success | failure"
    calls_super: false
    roles: [webhook]
    purpose: >-
      Обработка входящего уведомления: проверка подписи, сопоставление
      операции по идентификаторам, перевод статуса провайдера во внутренний и
      вызов approve_operation или reject_operation.
    source: "описание кейса"

  fetch_status:
    params:
      - { name: operation }
    returns: "success | failure"
    calls_super: false
    roles: [fetch_status]
    purpose: >-
      Опрос статуса операции у провайдера. Единственный путь получить статус,
      если провайдер не отправляет вебхуки.
    source: "описание кейса"

helpers:
  approve_operation:
    params:
      - { name: operation }
    purpose: "перевести операцию во внутренний статус approved"
    example: "approve_operation(operation)"
    source: "имя — описание кейса; арность — допущение"

  auth_headers:
    params: []
    purpose: >-
      Заголовки авторизации исходящего запроса. Состав собирается по
      rules/auth.yml из securitySchemes спецификации.
    example: "client.post(path, body, headers: auth_headers)"
    source: "имя — описание кейса; состав — выводится из спеки"

  client:
    params: []
    purpose: "HTTP-клиент платформы с базовым URL провайдера"
    example: "client.get(path)"
    source: "имя — описание кейса; интерфейс клиента — допущение"

  failure:
    params:
      - { name: code }
      - { name: i18n_key }
    purpose: >-
      Неуспешный результат метода: символьный код для ветвления и ключ
      локализации для сообщения пользователю.
    example: "failure(:invalid_amount, 'errors.invalid_amount')"
    source: "описание кейса"

  reject_operation:
    params:
      - { name: operation }
    purpose: "перевести операцию во внутренний статус rejected"
    example: "reject_operation(operation)"
    source: "имя — описание кейса; арность — допущение"

  success:
    params: []
    purpose: "успешный результат метода"
    example: "success"
    source: "описание кейса"

# Состав обязан совпадать с IR::Roles::INTERNAL_STATUS. Порядок — как в IR:
# от незавершённого к терминальным.
internal_statuses: [in_progress, approved, rejected]

request_method:
  semantics: >-
    Логический тип действия, а не HTTP-метод. Это payment_method шлюза
    (способ проведения операции, объявленный провайдером) либо служебное
    значение вроде status или check.
  known_values: [create, status, check]
  source: "эксперты кейса"

operation:
  # operation.amount платформа хранит в major units. Провайдер почти всегда
  # ждёт minor units; множитель считается по коду валюты из
  # rules/currencies.yml (10^exponent), а не по слову «копейках» в описании.
  amount_unit: major
  amount_note: >-
    operation.amount задан в рублях (major units); множитель до единиц
    провайдера определяется экспонентой ISO 4217 для кода валюты операции.
  source: "описание кейса"
