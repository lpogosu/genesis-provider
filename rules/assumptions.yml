# rules/assumptions.yml — допущения проекта как данные.
#
# Зачем. Раздел «Принятые допущения» сгенерированного INTEGRATION.md обязан
# перечислять всё, что мы приняли на веру там, где кейс или эксперты не дали
# формального ответа. Генератор не имеет права читать docs/ репозитория —
# документация может уехать, а инструмент должен работать из любого
# каталога, — поэтому допущения лежат здесь, а docs/ASSUMPTIONS.md остаётся
# журналом для людей с историей и статусами. Источник истины для генератора
# — этот файл; при расхождении правится он и журнал в одном коммите.
#
# Состав записи:
#   id          номер, как в docs/ASSUMPTIONS.md; уникален, не переиспользуется
#   text        само допущение, одна мысль
#   source      откуда: описание кейса, ответ экспертов (с датой) или наше
#               решение
#   affects     где влияет: файлы, стадии, артефакты
#   status      active | withdrawn — снятое допущение не удаляется, а
#               помечается и получает replaced_by
#   replaced_by чем заменено, только для withdrawn
#   documented  true, если запись попадает в INTEGRATION.md: допущение о
#               сгенерированном сервисе или о данных, которые он использует.
#               false — допущение о ходе проекта, читателю интеграции оно
#               не нужно
#
# ЧЕГО ЗДЕСЬ ДЕЛАТЬ НЕЛЬЗЯ:
#   1. Упоминать конкретного провайдера: допущения общие для всех
#      интеграций. Допущения одного прогона (роль поля ниже порога, единицы
#      по умолчанию) генератор берёт из IR и печатает рядом.
#   2. Выдавать догадку за подтверждённое: если эксперты не сказали дословно,
#      источник — «наше решение».
#   3. Удалять снятое допущение: history остаётся в withdrawn.
#
# Порядок — по id.

version: 1

assumptions:
  - id: 1
    text: >-
      Контракт Provider::BaseService восстановлен по примеру из описания
      кейса; реального класса нет и не будет. Имена и арность четырёх
      методов и хелперов — как в примере.
    source: "описание кейса; эксперты 4 сентября 2026: «неважно, как он устроен… базовый класс-фабрика»"
    affects: "rules/contract.yml, шаблон сервиса, INTEGRATION.md"
    status: active
    documented: true

  - id: 2
    text: >-
      HTTP-клиент платформы вызывается как client.post(url, payload, headers)
      и client.get(url, headers); ответ читается как response.status и
      response.body; базовый URL берётся из ENV.
    source: "эксперты 4 сентября 2026: «есть какой-то клиент, к которому обращаемся через POST, передавая URL, payload и header»"
    affects: "шаблон сервиса, rules/contract.yml"
    status: active
    documented: true

  - id: 3
    text: >-
      Генерация не блокируется никогда. Там, где спецификация не даёт ответа,
      сервис получает лучшего кандидата из справочников с пометкой TODO и
      строкой в report.md, а не пустое значение.
    source: "эксперты 4 сентября 2026: «инструмент должен больше решать сам… человек уже всё равно всё будет смотреть, но после того, как сгенерировано»"
    affects: "генераторы, report.md, третий уровень доверия в CLAUDE.md"
    status: active
    documented: true

  - id: 4
    text: >-
      Дубли операций отсекает платформа до вызова сервиса. Ветка кода
      конфликта со схемой успеха («взять существующую операцию»)
      генерируется, потому что так говорит спецификация, но не считается
      ключевой функцией.
    source: "эксперты 4 сентября 2026, вопрос 12 в docs/QUESTIONS.md"
    affects: "шаблон сервиса, INTEGRATION.md"
    status: active
    documented: true

  - id: 5
    text: >-
      Оценивается сгенерированный класс, а не живой обмен с провайдером:
      методы, поля и заголовки должны соответствовать спецификации.
      Мок-провайдер — демонстрационный бонус.
    source: "эксперты 4 сентября 2026, вопрос 10 в docs/QUESTIONS.md"
    affects: "приоритеты промптов 7–9"
    status: active
    documented: false

  - id: 6
    text: >-
      operation.amount приходит в мажорных единицах (рубли), провайдер ждёт
      минорные; множитель — 10 в степени экспоненты ISO 4217 для кода валюты,
      а не слово «копейках» в описании.
    source: "описание кейса; ISO 4217"
    affects: "UnitsAnalyzer, шаблон сервиса, check_conditions"
    status: active
    documented: true

  - id: 7
    text: >-
      Канонический маппинг статусов из описания кейса подтверждён экспертами;
      cancelled отображается в rejected, четвёртого внутреннего статуса нет.
    source: "описание кейса; вопрос 3 в docs/QUESTIONS.md открыт"
    affects: "rules/statuses.yml, STATUS_MAP, EVENT_MAP"
    status: active
    documented: true

  - id: 8
    text: >-
      Выражения платформы — чтение полей операции (operation.amount и
      прочие) и предикат успешного результата базового класса — наш вывод;
      реального класса Operation не выдали. Поиска операции в хранилище и
      сохранения идентификатора провайдера в сервисе нет: по ответу
      экспертов это делает платформа снаружи.
    source: "наше решение; эксперты 5 сентября 2026: «сохранение будет происходить вне сервиса провайдера, сервис провайдера должен сделать запрос к самому провайдеру, через абстрактный client и отдать ответ»"
    affects: "build_payload, callback_target, accept_response"
    status: active
    documented: true

  - id: 9
    text: >-
      Форма регистрации сервиса в ProviderGateway (YAML-фрагмент в
      INTEGRATION.md) — наш вывод из описания кейса; реального интерфейса
      шлюза не выдали, значения request_method — из ответов экспертов.
    source: "наше решение; эксперты 4 сентября 2026 о request_method"
    affects: "INTEGRATION.md, раздел «Конфигурация ProviderGateway»"
    status: withdrawn
    replaced_by: >-
      Раздел 6 INTEGRATION.md «Параметры подключения»: сводка адреса,
      учётных данных, валют, единиц и границ суммы, выведенных из самой
      спецификации. Эксперты 5 сентября 2026: отдельный конфиг платформе не
      нужен, «адрес, авторизация и т.д. должны браться из open api документа
      провайдера».
    documented: false

  - id: 10
    text: >-
      Аргумент process_callback — уже разобранный JSON уведомления. Подпись
      считается по сырым байтам тела, которых в разобранном JSON нет,
      поэтому проверку вызывает маршрут вебхука публичным методом
      verify_webhook_signature до разбора тела; внутри process_callback
      подпись проверяется, только если маршрут положил байты и заголовки в
      аргумент.
    source: "эксперты 5 сентября 2026: process_callback «получает уже разобранный JSON внутри payload»"
    affects: "шаблон сервиса, INTEGRATION.md раздел 8, report.md чек-лист"
    status: active
    documented: true
