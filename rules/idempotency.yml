# rules/idempotency.yml — заголовок идемпотентности и его известные имена.
#
# Зачем. Повтор запроса на создание выплаты не должен создавать вторую
# выплату. Заголовок называется у всех по-разному, поведение при повторе —
# одинаковое, поэтому имена лежат в данных, а логика в шаблоне.
#
# Источник. IETF draft-ietf-httpapi-idempotency-key-header, «The
# Idempotency-Key HTTP Header Field» (Standards Track, рабочая группа
# HTTPAPI). Черновик определяет семантику заголовка и перечисляет реальные
# реализации в индустрии — оттуда взят список алиасов. Дополнено именами,
# встречающимися у российских провайдеров (Idempotence-Key).
#
# Главное следствие из черновика, ради которого он нам нужен: при повторном
# запросе после завершения оригинального ресурс возвращает результат ранее
# завершённой операции. Значит, 409 на повторный POST — это НЕ ошибка, а
# «уже создано, вот результат». В IR такой ответ получает действие
# IR::Roles::ERROR_ACTION = :dedup, а сгенерированный сервис подхватывает
# существующую операцию, а не отклоняет её. Ровно этот случай есть в спеке
# NovaPay: 409 на POST /payouts возвращает PayoutResponse, а не ErrorResponse.
#
# Почему uuid_v5 и почему namespace прибит гвоздями. Ключ выводится
# детерминированно: UUID v5 от operation.id в фиксированном пространстве
# имён. Одна и та же операция всегда даёт один и тот же ключ, поэтому повтор
# после сетевого сбоя дедуплицируется провайдером. SecureRandom и любой
# другой источник случайности здесь ЗАПРЕЩЁН: случайный ключ превращает
# повтор в новую выплату, а заодно ломает golden-тесты, которые доказывают
# детерминированность генератора. Значение uuid_v5_namespace — стандартное
# пространство имён DNS из RFC 4122 (приложение C).
#
# ЧЕГО ЗДЕСЬ ДЕЛАТЬ НЕЛЬЗЯ:
#   1. Добавлять в aliases заголовки трассировки (X-Correlation-Id,
#      X-Trace-Id, Request-Id). Они уникальны на КАЖДЫЙ запрос, включая
#      повтор, — приняв их за ключ идемпотентности, мы получим дубли выплат.
#   2. Пересекать aliases с именами ролей из rules/roles.yml. Разрешено одно
#      пересечение — роль idempotency_key; любое другое совпадение после
#      нормализации (нижний регистр, разделители → `_`) роняет загрузчик.
#   3. Менять default_strategy на что-то случайное. Допустимые значения
#      закрыты в IR::Idempotency::STRATEGIES: uuid_v5 | external_id | none.
#   4. Класть сюда значения ключей. Здесь только имена заголовков.
#
# Заголовки записаны в индустриальном регистре, как они выглядят в
# документации провайдеров; HTTP-заголовки регистронезависимы, сравнение идёт
# после нормализации. Список отсортирован по алфавиту.

version: 1

# Имя, которое отправляет сгенерированный сервис, если спека не назвала своё.
canonical_header: Idempotency-Key

aliases:
  - Idempotence-Key         # ЮKassa и производные российские API
  - Idempotency-Key         # Stripe, Adyen, Dwolla; каноническое имя черновика
  - PayPal-Request-Id       # PayPal
  - X-Idempotency-Key       # распространённый вариант с префиксом
  - X-Request-Id            # встречается как ключ идемпотентности, не как трассировка
  - X-Unique-Transaction-Id # из описания кейса

# uuid_v5 — детерминированный ключ от operation.id (см. шапку файла).
default_strategy: uuid_v5

# Пространство имён DNS из RFC 4122, приложение C. Константа: менять её
# нельзя, иначе ключи всех ранее отправленных операций изменятся и повторы
# перестанут дедуплицироваться.
uuid_v5_namespace: "6ba7b810-9dad-11d1-80b4-00c04fd430c8"

# HTTP-статус, которым провайдер сообщает о повторе. Ответ с этим статусом
# трактуется как успех с действием :dedup, если тело совпадает со схемой
# успешного ответа.
conflict_status: 409

# Заголовок помечен в спеке required: false — отправляем всё равно. Отказ от
# ключа ради «необязательности» стоит дубля выплаты.
send_when_optional: true
