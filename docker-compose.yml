# Один сервис: HTTP-API генератора на 9292.
#
#   docker compose up --build          поднять API
#   docker compose run --rm api ./integrate --all   тот же образ, но CLI
#
# Три монтирования, у каждого своя причина:
#
#   spec/fixtures/specs  только чтение. Положить в каталог свой файл — значит
#                        увидеть его в /api/specs без пересборки образа, но
#                        записать в него из контейнера нельзя.
#   rules                только чтение. Справочники — данные, а не код:
#                        строка, дописанная в rules/statuses.yml снаружи,
#                        меняет распознавание в следующем же прогоне, и
#                        пересобирать образ для этого не нужно.
#   output               на запись. Иначе артефакты остаются внутри
#                        контейнера, и открыть сгенерированный сервис в
#                        редакторе нечем.
services:
  api:
    build: .
    image: specgen
    ports:
      - "9292:9292"
    volumes:
      - ./spec/fixtures/specs:/app/spec/fixtures/specs:ro
      - ./rules:/app/rules:ro
      - ./output:/app/output
    environment:
      # Язык сообщений API; en — второй поддерживаемый.
      SPECGEN_LOCALE: ru
