# locales/en/schemas.yml — texts of the schema analysis stage: warnings about
# schemas and fields, evidence of a conditional requirement, overlay drafts.
#
# One file per pipeline stage, so two stages never edit the same file.
# Placeholders are %{name}; the key set must match locales/ru/schemas.yml,
# which spec/unit/specgen/texts_spec.rb checks.
#
# The overlay_* values are the YAML fragment a human pastes into their own
# overlay file. That text is for a machine: it is the same in every locale
# and its indentation matters.

analyzers:
  schema:
    components_not_object: "`components.schemas` must be an object"
    body_schema_unreadable: "the body of %{operation} declares no readable schema, so nothing describes what it carries"
    response_body_undeclared: "response %{status} of %{operation} is declared by its description alone: there is no `content`, so nothing describes the body — either declare a schema or declare a bodiless response with 204"
    nesting_too_deep: "schemas nest deeper than %{limit} levels here, so %{name} was left undescribed; check the spec for a schema that contains itself"
    ref_cycle: "a schema refers to itself: %{chain}; the cycle is cut — the second occurrence keeps the reference without its fields, and those fields do not reach the code"
    field_schema_missing: "`%{field}` refers to schema %{schema}, which is not described anywhere"
    role_pending: "field roles are matched by the field matchers, a later stage"
    required_not_list: "`required` must be a list of property names"
    object_without_properties: "the schema is an object but declares no properties, so nothing can be built from it"
    property_without_type: "property `%{name}` declares no `type`, so the generated code cannot check or coerce its value"
    property_not_object: "property `%{name}` must be an object; it was skipped"
    array_without_items: "array `%{name}` declares no `items`, so its element type is unknown"
    allof_type_conflict: "allOf branches disagree on the type of `%{name}` (%{kept} and %{incoming}); the first was kept"
    allof_property_conflict: "property `%{name}` is described differently by two branches of the composition; the first description was kept, check the second one by eye"
    composition_too_deep: "compositions nest deeper than %{limit} levels; the schema was not unfolded any further, so its properties did not reach the IR"
    free_form_object: "`%{name}` is a free-form map (`additionalProperties` or an object without `properties`): the spec never lists its keys, so the value stays a hash to be filled in by hand"
    variants_decomposed: "`%{keyword}` with %{count} variants (%{names}) was decomposed: the properties of every variant are in the IR and tagged with their variant, but none became required — the spec does not say which variant to send"
    variants_discriminated: "`%{keyword}` with %{count} variants is selected by `%{property}` (values: %{values}): the `discriminator` named both the property and the fields required for each of its values"
    condition:
      presence: "`%{trigger}` present"
      equals: "`%{trigger}` = %{value}"
      dependent_required: "dependentRequired: `%{trigger}` present makes `%{field}` required"
      discriminator: "discriminator: `%{trigger}` = %{value} — the variant whose branch declares `%{field}` required"
      if_then: "%{keywords}: %{condition} makes `%{field}` required"
      negated_enum: "%{keywords}: `%{trigger}` declares an enum of exactly two values (%{enum}) and `if` takes %{tested}, so the `else` branch is the remaining %{condition}, which makes `%{field}` required"
      description_hint: "description hint (%{pattern}): %{sentence} reads as %{condition}"
      hint_warning: "`%{field}` looks conditionally required (%{condition}), but the schema states no condition; the fragment below states it formally"
      negative_branch: "`%{field}` is required by the `%{keyword}` branch, a negative condition the IR cannot express; state it as a positive condition in an overlay"
      negative_branch_off_enum: "`%{field}` is required by the `%{keyword}` branch, while `if` tests `%{trigger}` = %{tested}, a value the schema never declares for that field (%{enum}); the spec contradicts itself, so no negative condition was derived"
      overlay_equals: |
        - target: "%{schema_path}"
          update:
            %{if_key}:
              properties:
                %{trigger}:
                  const: %{value}
            %{then_key}:
              required: [%{field}]
      overlay_presence: |
        - target: "%{schema_path}"
          update:
            %{keyword}:
              %{trigger}: [%{field}]
