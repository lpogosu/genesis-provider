# locales/en/generators.yml — texts of the generators stage: CLI lines about
# written artifacts and the comments presenters put into generated code.
#
# One file per pipeline stage. Placeholders are %{name}; the key set must
# match locales/ru/generators.yml, which spec/unit/specgen/texts_spec.rb
# checks. Comments written directly in templates/*.erb are not here: the
# template itself is localised content.

generators:
  artifact: "Generating %{what}... ok (%{lines}) -> %{path}"
  what:
    service: "service"
    integration: "integration guide"
    fixtures: "fixtures"
    report: "report"
  warnings: "Warnings: %{total} (%{counts}); details: ./integrate analyze --spec %{spec}"
  strict_failed: "--strict: warnings present, exit code 1 (files were written)"
  overlay_ignored: "overlay %{file} is not applied yet: the OverlayApplier stage is not implemented"
  write_failed: "could not write the file: %{error}"
  template_failed: "the template did not render: %{error}"

  service:
    # Request body
    todo_role_unknown: "field role not determined. %{requirement} by the specification."
    todo_no_accessor: "role %{role} was derived, but the platform has no expression for it (rules/contract.yml, platform.accessors). %{requirement} by the specification."
    todo_shape: "type: %{shape}"
    todo_description: "description from the specification: \"%{text}\""
    todo_evidence: "evidence: %{evidence}"
    todo_fill: "fill in by hand or set x-specgen-role in the overlay / add a synonym to rules/roles.yml"
    todo_array: "array (items: %{item}) — not assembled by roles, fill in by hand"
    required: "Required"
    conditionally_required: "Conditionally required"
    role_doubt: "role %{role} derived with confidence below the threshold (%{confidence}): %{evidence} — check report.md"
    required_when_equals: "required when %{field} = %{value} (%{origin})"
    required_when_present: "required when %{field} is present (%{origin})"
    payload_schema_missing: "the create operation has no request body schema — assemble the payload by hand"
    # Tables
    error_map_codes: "By the provider error code from the response body."
    error_map_http: "By HTTP status when the body carries no error code."
    error_action_doubt: "default action (%{confidence}) — the code matched no rule of rules/errors.yml, check it"
    status_unmapped: "status not mapped: %{evidence}; set x-specgen-status-map in the overlay"
    event_unmapped: "event not mapped: %{evidence}; set x-specgen-status-map in the overlay"
    units_comment: "operation.amount is in major units; the provider expects %{unit} (%{evidence}, currency %{currency})."
    units_unknown: "amount units not derived (%{evidence}); multiplier 1 — set x-specgen-amount-unit and x-specgen-exponent in the overlay"
    units_none: "no amount field found in the specification"
    idempotency_comment: "The idempotency key is always sent, even where the specification marks the header optional (%{evidence})."
    namespace_comment: "UUID v5 namespace (RFC 4122) for the idempotency key: a constant from rules/idempotency.yml, never change it — retries would stop deduplicating."
    servers_none: "the specification declares no servers — set the sandbox base URL"
    sandbox_unknown: "server environment not derived, the first one is taken — check that it is the sandbox"
    # Preconditions
    condition:
      min_amount: "minimum: %{value} in provider units = %{major} in major units (%{source})"
      max_amount: "maximum: %{value} in provider units = %{major} in major units (%{source})"
      field_max_length: "%{field}: maxLength %{value} (%{source})"
      field_pattern: "%{field}: pattern %{value} (%{source})"
      field_enum: "%{field}: allowed values %{value} (%{source})"
    condition_doubt: "condition read from prose with confidence below the threshold — check report.md"
    condition_no_accessor: "condition on field %{field}: the platform has no expression for its role (rules/contract.yml, platform.accessors)"
    # Creation
    create_missing: "the specification describes no create operation (create_payout / create_deposit) — the method fails; check operation roles in report.md"
    create_other: "Second create operation in the specification: %{keys}; the contract has one method, it stays outside."
    dedup: "Retry with the same idempotency key: the conflict response carries the success schema, which draft-ietf-httpapi-idempotency-key-header defines as the earlier result, not an error — pick up the existing operation."
    path_param_unknown: "path parameter {%{name}} has no role — %{guess} substituted; set x-specgen-role in the overlay"
    # Status polling
    status_missing: "the specification describes no status polling operation (fetch_status) — the method fails"
    status_field_unknown: "status field not found in the response by roles — body['status'] substituted"
    # Callbacks
    webhook_missing: "the specification describes no webhooks: status by polling only (fetch_status); the method fails"
    callback_shape: "the contract does not describe the %{param} argument — assumed to be the parsed notification body itself"
    target_unknown: "the notification schema has no fields with roles provider_operation_id / external_id — nothing to tell which operation the notification is about"
    event_field_unknown: "the notification schema has neither an event field nor a status field — nothing to derive the internal status from"
    # Signature
    signature_doc: "Verifies the signature of an incoming notification before any other logic: constant-time comparison, a missing header is a failure."
    signature_returns: "failure result, or nil when the signature is valid"
    signature_unpack_doc: "Signature by the process_callback argument: the argument is already parsed JSON, the raw body bytes are taken from it by the expressions in rules/contract.yml. If the webhook route did not pass them, call %{method} before parsing the body."
    signature_outside_doc: "The signature is not verified here: process_callback receives already parsed JSON, while the HMAC is computed over the body bytes. Call %{method} on the webhook route before parsing the body — otherwise the notification is unverified."
    signature_absent: "the specification does not describe notification signatures — the header is unknown, the method always fails; set x-specgen-signature in the overlay"
    signature_header_unknown: "signature header not derived — the method always fails; set x-specgen-signature in the overlay"
    signature_member_unknown: "signature %{member} not derived (%{evidence}); default taken"
    signature_matches_doc: "The header value is a space-separated list of prefixed versions; any matching version is accepted."
    # Authorization
    auth_doc: "Authorization headers: scheme %{scheme} (%{type}) by the rules/auth.yml entry \"%{entry}\". The secret is read from provider.credentials."
    auth_none: "The specification declares no authorization: no headers."
    auth_unknown: "Authorization scheme %{scheme} not recognised — no headers assembled."
    auth_todo: "authorization scheme not recognised; describe it in rules/auth.yml or via the overlay"
    auth_query_note: "Credentials go into the query string (auth_query), not into headers."
    auth_query_doc: "Query string parameters with credentials; appended to the URL of every request."
    oauth2_stub: "obtain an access_token via the client_credentials flow (tokenUrl: %{token_url}) and cache it until expires_in — the specification only describes the scheme, implement it for the platform client"
    oauth2_stub_message: "access_token: client_credentials flow not implemented"
    hmac_stub: "signature of the request itself (HMAC) — take the parameters from the rules/signatures.yml profile, the specification does not describe them"
    hmac_stub_message: "request_signature: request signing not implemented"
    # Operations outside the contract
    extra_doc: "Operation %{key} (role %{role}, %{confidence}) is not mapped to the BaseService contract: a separate public method."
    unmapped_doc: "operation role not recognised (%{evidence}) — check whether the integration needs it"
    extra_payload_doc: "Request body of operation %{key} by the field roles of schema %{schema}; nil values are dropped."
    extra_payload: "request body by schema %{schema} (required fields: %{required}) is assembled by hand"
    cancel_restriction: "Cancellation is possible only in provider statuses %{statuses} (%{source}), in internal terms — CANCELLABLE_STATUSES."
    # Private methods
    build_payload_doc: "Request body by the field roles of schema %{schema}; nil values are dropped."
    request_headers_doc: "Headers of the create request: authorization, content type and the idempotency key."
    request_headers_plain_doc: "Headers of the create request: authorization and content type."
    accept_response_doc: "Successful provider response: apply the status if it came and is known; an unknown status leaves the operation in_progress."
    accept_response_save_doc: "Successful provider response: remember its identifier and apply the status if it came and is known; an unknown status leaves the operation in_progress."
    apply_internal_status_doc: "Moves the notification target or the operation to the internal status via base class helpers; in_progress changes nothing."
    map_status_doc: "Provider status → internal by STATUS_MAP; nil for an unknown one."
    provider_failure_doc: "Error response: action by ERROR_MAP (provider code first, then HTTP status), the action symbol is the failure code for the platform."
    parse_json_doc: "Response body as a hash; broken or non-object JSON yields an empty hash."
    compact_payload_doc: "Recursively drops nil values: an optional field without a value is not sent."
    to_provider_units_doc: "Amount from the platform major units into provider units by AMOUNT_MULTIPLIER (ISO 4217)."
    idempotency_key_doc: "Deterministic idempotency key from operation.id: a retry yields the same key and is deduplicated by the provider. No randomness."
    uuid_v5_doc: "UUID v5 per RFC 4122 §4.3: SHA-1 of namespace and name, version 5, RFC variant. Stdlib only."
    header_value_doc: "Header value, name compared case-insensitively; nil when absent."
    secure_equal_doc: "Constant-time comparison of equal-length strings (OpenSSL.fixed_length_secure_compare); different lengths give false, not an exception."
    callback_target_doc: "What the notification is about: the provider operation identifier, then the external one — it may be optional. Looking the operation up in storage happens outside the provider service."
    callback_lookup_doc: "Platform operation by identifiers from the notification: provider identifier first, then the external one — it may be optional."
    provider_id_unknown: "the success response has no field with role provider_operation_id — nowhere to read the provider operation identifier from"
    provider_id_external: "The provider operation identifier is %{field}; the platform stores it outside the provider service."

  # INTEGRATION.md: table cells and phrases assembled by the
  # Generators::Integration::* presenters. Section prose lives in the template.
  integration:
    see_report: "details in report.md"
    not_required: "no"
    none: "none"
    source_col: "Source"
    confidence_col: "Confidence"
    # 1. Authorization
    auth_none: "The specification declares no authorization: %{helper} returns an empty hash. Confirm with the provider that requests really carry no credentials — %{report}."
    auth_unknown: "Authorization scheme `%{scheme}` is not recognised by rules/auth.yml: %{helper} holds a TODO and an empty hash. Describe the scheme in rules/auth.yml or via the overlay — %{report}."
    auth_type: "Authorization type: `%{type}` — scheme `%{scheme}` from securitySchemes, rules/auth.yml entry \"%{entry}\"."
    auth_where_header: "Credentials go into the %{names} header of every request to the provider."
    auth_where_query: "Credentials go into the query string (%{names}) of every request — the provider chose so; remember that query strings end up in proxy logs."
    auth_stub: "The specification does not describe obtaining %{what}: the stub method %{stub} with a TODO and NotImplementedError is generated — implement it for the platform client."
    auth_stub_oauth2: "an OAuth2 token (client_credentials flow, tokenUrl: %{token_url})"
    auth_stub_hmac: "the request signature (HMAC)"
    cred_key_col: "Credentials key"
    cred_where_col: "Read in"
    cred_purpose_col: "Purpose"
    cred_auth: "credentials for requests to the provider"
    cred_signature: "secret of incoming notification signatures"
    secret_storage: "Secret values live only in the platform credentials store: this document and the service carry key names only; fixtures.json holds placeholder values such as test_api_key, needed to compute the notification signature."
    # 2. ENV
    env_name_col: "Variable"
    env_purpose_col: "Purpose"
    env_default_col: "Default"
    env_required_col: "Required"
    env_base_url: "base URL of the provider API (constant BASE_URL)"
    env_open_timeout: "connection timeout, seconds (constant OPEN_TIMEOUT)"
    env_read_timeout: "read timeout, seconds (constant READ_TIMEOUT)"
    env_default_sandbox: "`%{url}` — sandbox from the specification"
    env_default_first: "`%{url}` — first server of the specification, environment not derived: check that it is the sandbox"
    env_default_placeholder: "`%{url}` — the specification declares no servers, set it by hand"
    env_production: "Production: set `%{env}=%{url}` — the second server of the specification."
    env_no_production: "No production server is declared in the specification: get the live URL from the provider."
    env_secrets: "Secrets are not read from ENV: credentials keys — %{keys}."
    # 3. Methods
    method_col: "Method"
    endpoint_col: "Provider HTTP method and path"
    request_method_col: "request_method"
    idempotency_col: "Idempotency"
    result_col: "Result"
    method_no_http: "— (no call to the provider)"
    method_incoming: "%{endpoint} — incoming, called by the provider"
    method_missing: "not declared in the specification; the method fails with %{failure} — %{report}"
    request_method_none: "—"
    request_method_default: "%{value} by default"
    request_method_any: "gateway value, passed to super: %{values}"
    idem_check: "not applicable"
    idem_callback: "none: incoming request; a repeated notification applies the same status again"
    idem_get: "idempotent by HTTP semantics (RFC 9110, GET)"
    idem_header_none: "no idempotency header is declared in the specification: no key is sent — %{report}"
    idem_create: "header %{header}, key — UUID v5 of operation.id (namespace from rules/idempotency.yml); on a retry the provider answers: %{conflict}"
    idem_conflict_known: "%{status} with the success schema — the service picks up the existing operation"
    idem_conflict_unknown: "the retry response is not described in the specification — %{report}"
    idem_extra_header: "header %{header}"
    result_check: "%{success} or %{failure} with a condition code: %{codes}"
    result_check_plain: "%{success} or %{failure} of the base class"
    result_create: "%{success} — provider identifier stored, status applied; %{failure} with an action from ERROR_MAP"
    result_callback: "%{success} after %{approve} / %{reject}; %{failure} on a bad signature, unknown operation or event"
    result_status: "%{success} after the status transition; %{failure} with operation_not_found, status_unknown or an action from ERROR_MAP"
    result_extra_cancel: "%{success} or %{failure}; CANCELLABLE_STATUSES is checked before the request"
    result_extra_body: "response body (Hash) or %{failure} with an action from ERROR_MAP"
    extra_note: "Not mapped to the %{base_class} contract: separate public methods the platform calls on its own; see report.md."
    extra_role: "role %{role} (%{confidence})"
    extra_unmapped: "role not recognised (unmapped): method with a TODO"
    gateway_role: "role %{role}"
    gateway_also: "another condition on %{field}: %{pair}"
    # 4. Statuses
    status_col: "Provider status"
    event_col: "Notification event"
    internal_col: "Internal status"
    status_source_canonical: "canon of the case description (rules/statuses.yml)"
    status_source_registry: "synonym from rules/statuses.yml"
    status_source_overlay: "overlay (x-specgen-status-map)"
    status_source_heuristic: "heuristic"
    status_source_structural: "explicit"
    status_unmapped: "not mapped, see report.md"
    status_none: "The specification declares no operation statuses: STATUS_MAP is empty, `map_status` returns nil for any value — %{report}."
    events_none: "No webhooks are declared in the specification: EVENT_MAP is not generated, the status comes only from polling %{fetch}."
    # 5. Errors
    code_col: "Provider error code"
    http_col: "HTTP status"
    seen_col: "Found in"
    action_col: "Action"
    service_col: "What the service does"
    operation_col: "Operation"
    action_meaning_col: "What it means for the platform"
    error_http_any: "any — read from the response body"
    seen_enum: "enum"
    seen_example: "examples only"
    seen_both: "enum and examples"
    action_default_note: "default, %{confidence}"
    action_reject: "the operation is rejected, a retry would not help"
    action_retry: "retry immediately"
    action_retry_backoff: "retry with growing pauses; Retry-After when declared"
    action_alert: "alert on-call: credentials or permissions, a retry fails the same way"
    action_escalate: "a human decides: provider balance or limit, the platform cannot fix it"
    operation_rules_note: "Codes that mean something else for one operation than in the common table (ERROR_MAP_BY_OPERATION):"
    errors_none: "The specification declares neither error codes nor error responses: ERROR_MAP is empty, any unsuccessful response yields %{failure} with the default action %{default}."
    retry_policy: "Retry policy (RETRY_POLICY): the platform retries on actions %{actions}; by HTTP status these are %{statuses}. %{retry_after}"
    retry_after_yes: "The pause header %{header} is declared on responses %{statuses} — the platform must honour it before retrying."
    retry_after_no: "No retry pause header is declared in the specification."
    retry_mechanism: "The retry mechanism, queues and alerts are platform infrastructure; the service never retries on its own, it only hands over the policy as data."
    default_action: "A code absent from the tables gets the default action %{default} (DEFAULT_ERROR_ACTION)."
    dedup_heading: "Deduplication."
    dedup_row: "Response %{status} of operation %{operation} with the success schema is not an error but the success path of draft-ietf-httpapi-idempotency-key-header: %{method} picks up the existing operation (constant DEDUP_STATUS). ERROR_MAP does not include this case."
    dedup_none: "No deduplication success path was derived: no operation with the idempotency header declares a retry response with the success schema, so a conflict response is treated as an error — %{report}."
    dedup_no_idempotency: "Idempotency is not declared in the specification: the provider cannot tell a retry from a new request — %{report}."
    # 6. Gateway
    gateway_note: "Everything below is derived from the specification itself: address, credential keys, currencies, amount units and limits, field constraints, notification path and header. The service needs no separate config — this is a summary to check against. The values are computed by the same code as the %{check} preconditions of the service: amounts are in internal (major) units."
    gateway_env: "environment variable %{env}, address from the specification servers"
    currencies_unknown: "currency not derived from the specification"
    units_unknown: "amount units not derived, multiplier 1 — set x-specgen-amount-unit in the overlay"
    # 7. Signature
    sig_param_col: "Parameter"
    sig_value_col: "Value"
    sig_none_webhook: "No webhooks are declared in the specification: there is no signature, %{method} fails with %{failure}."
    sig_absent: "The specification does not describe notification signatures: the profile is not derived, the values below are defaults. The generated `verify_signature!` rejects every notification (%{failure}) until the header is set in the overlay by the fragment below — %{report}."
    sig_member_header: "signature header"
    sig_member_algorithm: "algorithm"
    sig_member_encoding: "encoding"
    sig_member_payload: "signed string"
    sig_member_secret_key: "secret"
    sig_member_tolerance: "time tolerance, seconds"
    sig_prefix_col: "value prefix"
    sig_prefix_source: "Standard Webhooks profile (rules/signatures.yml)"
    sig_member_source_default: "default — not derived: %{evidence}"
    sig_no_profile: "signature profile not described"
    sig_missing_header: "no signature header — %{failure}, the body is not parsed"
    sig_invalid: "signature mismatch — %{failure}"
    sig_compare: "constant-time comparison (`OpenSSL.fixed_length_secure_compare`); strings of different length are unequal, no exception"
    sig_replay: "a notification whose timestamp is older than %{tolerance} s is rejected (%{failure}) — replay protection"
    sig_prefix_rule: "the header value is a space-separated list of versions with the %{prefix} prefix; any matching version is accepted"
    sig_example: "How the provider computes the signature (and how the service recomputes it), without the secret value:"
    sig_overlay: "Overlay fragment that pins the signature profile (values are TODO for a human):"
    # 9. Assumptions
    assumption_line: "No. %{id}. %{text} Source: %{source}. Affects: %{affects}."
    platform_line: "The expressions the service uses to talk to the platform are the platform section of rules/contract.yml (source: %{source}), for example %{examples}; when the platform changes, the dictionary is edited, not the service."
    run_heading: "Assumptions of this run — what the code took from the best candidate or by default:"
    run_none: "This run has no assumptions: everything that reached the code was derived from the specification structure or the dictionaries with confidence at or above the threshold."
    run_field_doubt: "field `%{path}` got role %{role} with confidence below the threshold (%{confidence}): %{evidence}"
    run_field_unknown: "required field `%{path}` has no role: in the payload with value %{value} and a TODO (%{evidence})"
    run_when_present: "presence of %{field}"
    run_required_when: "conditional requirement of `%{field}` when %{condition} was read as %{origin} with confidence %{confidence}"
    run_condition: "condition %{kind} was read from prose: %{description}"
    run_path_param: "path parameter {%{name}} of operation %{key} has no role: the provider identifier is substituted"
    run_status_field: "the status field in the response of operation %{key} was not found by roles: body['status'] substituted"
    run_event_field: "the notification schema has neither an event field nor a status field: the internal status is not derived from notifications"
    run_provider_id: "the success response of the create operation has no field with role provider_operation_id: the provider identifier is not stored"
    run_units_unknown: "amount units not derived (%{evidence}): multiplier 1 and a TODO at AMOUNT_MULTIPLIER"
    run_units_doubt: "amount units derived with confidence below the threshold (%{confidence}): %{evidence}"
    run_signature_absent: "notification signatures are not described: verify_signature! rejects everything until the TODO is filled"
    run_signature_member: "signature parameter %{member} not derived (%{evidence}): %{value} taken"
    run_idempotency_none: "no idempotency header found: no key is sent"
    run_dedup_unknown: "the retry response status was not derived (%{evidence}): no deduplication branch generated"
    run_auth_none: "no authorization declared: requests go out without credentials"
    run_auth_unknown: "authorization scheme `%{scheme}` not recognised: auth_headers with a TODO"
    run_status_unmapped: "status `%{status}` not mapped: nil in STATUS_MAP"
    run_event_unmapped: "event `%{event}` not mapped: nil in EVENT_MAP"
    run_error_doubt: "error code `%{code}`: default action %{action} (%{confidence})"
    run_operation_unmapped: "operation %{key} is not mapped to the contract: a separate method with a TODO"
    run_operation_doubt: "operation %{key}: role %{role} with confidence below the threshold (%{confidence})"
    run_sandbox: "sandbox not derived: default BASE_URL — %{url}"

  fixtures:
    no_request_example: "the specification carries no request example for this operation: the body is assembled from the example, enum and default of the schema properties."
    no_response_example: "the specification carries no example for this response code: the body is assembled from the example, enum and default of the schema properties."
    no_event_example: "the specification carries no notification example for the event %{event}: the event and status enum values were substituted."
    path_param_synthesized: "the path parameter %{name} has no example in the specification: a stub was substituted, replace it with a real identifier."
    no_error_responses: "the specification declares no error response for this operation: there is no failing scenario to check, add one through an overlay."
    status_range: "the response code %{status} is a range, not a number: substitute a concrete HTTP code before feeding the fixture to WebMock."
    event_unmapped: "the event %{event} is not mapped to an internal status: nil in EVENT_MAP, check the expected status by hand."
    signature_absent: "the signature profile was not derived: the fixture carries no signature header and process_callback will reject it."
    body_undeclared: "the body of this element is declared in the specification but never described: there is no schema and no example — describe the schema or drop the fixture."
    secret_redacted: "a value that looks like a real secret was replaced with a stub: fixtures never carry real keys."
    auth_computed: "the authorization header value is computed by the service code: the fixture carries a stub, substitute your own when running."
    negative_signature: "negative fixture: the signature is wrong on purpose, process_callback must return the signature_invalid failure."
    negative_event: "negative fixture: the event is not declared in the enum, process_callback must return the unknown_event failure."

  report:
    # 1. Summary
    row_operations: "Operations"
    row_schemas: "Schemas and fields"
    row_roles: "Field roles"
    row_unresolved: "Fields without a role"
    row_statuses: "Statuses"
    row_events: "Webhook events"
    row_errors: "Error codes"
    row_conditions: "Interaction conditions"
    row_warnings: "Warnings"
    val_operations: "total %{total}: mapped onto the contract %{contract}, outside it %{extra}, without a role (unmapped) %{unmapped}"
    val_schemas: "schemas %{schemas}, fields %{fields}: scalar %{scalars}, containers %{containers}"
    val_roles: "%{known} of %{scalars} scalar: %{sources}"
    val_unresolved: "%{total}: required %{required}, optional %{optional}"
    val_pairs: "%{total}: mapped %{mapped}, unmapped %{unmapped}"
    val_errors: "provider codes %{total}: in enum %{enum}, examples only %{examples}; generic HTTP-code rules %{http}"
    val_conditions: "%{total}: from structure %{formal}, from description prose %{prose}"
    val_warnings: "%{total}: errors %{error}, warnings %{warning}, notes %{info}"
    source_overlay: "overlay %{count}"
    source_structural: "stated explicitly %{count}"
    source_registry: "from the dictionary %{count}"
    source_heuristic_high: "heuristic above the threshold %{count}"
    source_heuristic_low: "heuristic below the threshold %{count}"
    artifact_service: "service implementing the base class contract"
    artifact_integration: "integration guide"
    artifact_fixtures: "request, response and notification examples"
    artifact_report: "this report"
    artifact_self: "counted as it is written"
    # 2. Coverage
    dim_operations: "Operations"
    dim_request_fields: "Request body fields"
    dim_response_fields: "Response and notification body fields"
    dim_response_codes: "Response codes"
    dim_statuses: "Statuses"
    dim_events: "Webhook events"
    dim_conditions: "Interaction conditions"
    gaps_heading: "not covered: %{count}"
    gaps_more: "and %{count} more in this dimension"
    gap_operation_unmapped: "the operation role was not recognised: a method is generated, but what it does is up to a human — section 4"
    gap_field_other_operation: "the body of %{key} is not assembled from roles: the contract gives a single create method, other operations get an empty payload with a TODO"
    gap_field_no_accessor: "role %{role} was derived, but the platform has no expression for it (rules/contract.yml, platform.accessors)"
    gap_field_required_todo: "required field without a role: it went into the payload with a TODO and a default value, a human fills it in"
    gap_field_optional_skipped: "optional field without a role: left out of the payload (CLAUDE.md, \"what we generate for an incomplete spec\")"
    gap_response_role_unknown: "not read: no role was derived"
    gap_response_role_unused: "not read: role %{role} was derived, but the %{base} contract methods do not need it"
    gap_code_range: "the code is declared as a range rather than a number: there is nothing to build a branch from"
    gap_code_default: "no branch of its own: the response falls back to DEFAULT_ERROR_ACTION"
    coverage_empty: "nothing to cover"
