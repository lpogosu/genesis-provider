# locales/en/analyzers.yml — texts of the analysis stage: warnings, the
# evidence behind derived values and overlay skeletons.
#
# One file per pipeline stage, so two stages never edit the same file.
# Placeholders are %{name}; the key set must match locales/ru/analyzers.yml,
# which spec/unit/specgen/texts_spec.rb checks.
#
# Values inside the overlay fragments (`url`, `description: Production`) stay
# as they are in every locale: they are read by the spec itself and by the
# ASCII lexicon of EnvironmentDetector, not by a human.

analyzers:
  # Wording shared by several analyzers: a spec breaks the shape OpenAPI
  # prescribes in the same way in different places.
  common:
    must_be_object: "`%{key}` must be an object"
    must_be_list: "`%{key}` must be a list"

  info:
    name_from_option: "--provider %{given}"
    name_from_title: "info.title %{title} -> %{slug}"
    name_unknown_message: "provider name could not be derived: pass --provider to name the service class, its file and its ENV variables"
    name_unknown_evidence: "neither --provider nor info.title yielded a name"
    base_url_env_evidence: "convention: <PROVIDER>%{suffix} from provider name %{name}"
    base_url_env_unknown: "no provider name to build an ENV name from"
    servers_absent: "the spec declares no `servers`; the generated service has no base URL to default to"
    servers_malformed: "the spec has an empty or malformed `servers` list; the generated service has no base URL to default to"
    servers_overlay: |
      - target: "$"
        update:
          servers:
            - url: https://api.example.com
              description: Production
    server_url_missing: "server entry carries no usable `url` string and was skipped"
    environment_evidence: "server %{place} %{text} contains %{word} -> %{environment}"
    environment_place:
      description: "description"
      host: "host"
    environment_unknown_message: "neither the description nor the host says whether this server is the sandbox or production; requests may go to the wrong one"
    environment_unknown_evidence: "no environment word in description or host"
    environment_overlay: |
      - target: "%{path}"
        update:
          description: Production

  auth:
    type_evidence: "rules/auth.yml entry %{entry} matched %{facts}"
    credentials_evidence: "rules/auth.yml entry %{entry} reads provider.credentials %{keys}"
    token_url_missing: "the %{flow} flow declares no tokenUrl, so the generated service has nowhere to ask for a token"
    key_in_query: "the credential travels in the query string, where proxy logs and browser history keep it; the provider chose this, not the generator"
    param_name_missing: "security scheme %{name} names no parameter, so there is nothing to put the credential in"
    scheme_unknown_message: "security scheme %{name} matches no entry in rules/auth.yml, so the generated service cannot authenticate"
    scheme_unknown_evidence: "%{name} matches no dictionary entry"
    unknown_overlay: |
      - target: %{path}
        update:
          # restate the scheme in terms rules/auth.yml knows,
          # or add an entry to that dictionary
          type: http
          scheme: bearer
    security_shape: "`security` must be a list of requirement objects; it was ignored"
    scheme_shape: "security scheme %{name} must be an object; it was skipped"
    undeclared_message: "operations require security scheme %{names}, which components.securitySchemes does not declare"
    undeclared_evidence: "%{name} is required by operations but declared nowhere"
    multiple_schemes: "security schemes declared: %{total}; chose %{chosen}, required by %{operations}; ignored: %{ignored}"
    absent_message: "the spec declares no security at all, so generated requests carry no credentials; unusual for a payment API, check it against the contract"
    absent_evidence: "no components.securitySchemes, no operation declares security"

  operation:
    id_missing: "the operation declares no operationId; it is referred to as %{key} in this report and in the generated code"
    unmapped: "too little in the spec says what this operation is for, so no role was assigned (%{scores}); it needs a role in an overlay"
    ambiguous: "two roles fit this operation equally well, so neither was assigned (%{scores}); pick one in an overlay"
    off_contract: "recognised as %{role}, which Provider::BaseService has no method for; it is generated as a separate public method and not mapped to the contract"
    tags_shape: "`tags` must be a list of strings"
    status_unknown: "response key %{code} is not a status code, a range or `default`"
    scores: "%{scores} of %{cast} votes cast"
    match_evidence: "composite match: %{parts} = %{score} of %{cast} votes cast; %{runner_up}"
    runner_up: "next %{role} %{score}"
    no_runner_up: "nothing else scored"
    no_signal_evidence: "no signal matched any role"
    lost_evidence: "%{reason}: %{scores} of %{cast} votes cast (floor %{floor}, minimum %{minimum}, margin %{margin})"
    # Why no role was assigned; printed at the start of the evidence.
    reason:
      below_threshold: "below threshold"
      ambiguous: "ambiguous"

  parameter:
    role_pending: "parameter roles are matched by the field matchers, a later stage"
    shape: "parameter must be an object"
    name_missing: "parameter needs a `name` and a known `in`"

  # Exact dictionary lookup of a role by name (RoleLookup): the level-2
  # source analyzers use to find the amount, currency, status or error code
  # field before the matchers run.
  roles:
    synonym: "name `%{name}` matches a synonym of role %{role} in rules/roles.yml"
    error_code_structure: "field `%{name}` under parent `%{parent}`: the name token and the parent match the error_code hints in rules/roles.yml"

  # Provider status string -> internal status (StatusReader); the same words
  # for enums, examples and webhook events.
  status:
    canonical: "case canon: %{status} -> %{internal}"
    synonym: "rules/statuses.yml synonym: %{status} -> %{internal}"
    stripped: "event %{event} reads as status %{status}; "
    ambiguous: "status %{status} is ambiguous: %{reason}"
    unknown: "status %{status} is neither in the canon nor among the synonyms of rules/statuses.yml"
    overlay: "x-specgen-status-map: %{status} -> %{internal}"
    overlay_bad: "x-specgen-status-map: %{status} is given the unknown value %{value} (allowed: %{allowed})"
    ambiguous_message: "%{evidence}; pick the internal status (in_progress | approved | rejected) in an overlay"
    unknown_message: "%{evidence}; pick the internal status in an overlay or add a synonym to the dictionary"
    missing_from_enum: "status %{status} appears in an example but in no enum of a status field; the status map was extended with it, the spec should be fixed"
    field_missing_message: "no schema declares a status field (synonyms of role status in rules/roles.yml), so fetch_status and process_callback cannot translate a response into an internal status"
    overlay_fragment: |
      - target: "%{path}"
        update:
          x-specgen-status-map:
            %{status}: in_progress  # in_progress | approved | rejected

  # The deduplication success path (DedupReader): one phrase for the error
  # map and for the idempotency profile.
  dedup:
    evidence: "%{status} returns %{schema} — the same schema as %{success_status}; per the IETF Idempotency-Key draft a replay returns the earlier result, so this is deduplication, not an error"

  error:
    http_evidence: "rules/errors.yml: HTTP %{code} matched entry %{entry} -> %{action}"
    default_evidence: "rules/errors.yml: no rule for %{what}; default action %{action}"
    generic_suffix: "; the status is declared by %{operation}, the rule is extended to the other operations from their siblings"
    pattern_evidence: "rules/errors.yml: code %{code} matched pattern %{name} -> %{action}"
    overlay_evidence: "x-specgen-error-actions: %{code} -> %{action}"
    overlay_bad: "x-specgen-error-actions: %{code} is given the unknown value %{value} (allowed: %{allowed}); the extension was ignored"
    what_code: "code %{code}"
    what_status: "HTTP %{code}"
    action_unknown_message: "no rule in rules/errors.yml for %{what}; the default action %{action} was taken with confidence %{confidence} — set the action in an overlay or add a pattern to the dictionary"
    undeclared_message: "code %{code} appears in an example but is not declared in the enum of the error code field%{where}; the error map is built as the union of enum and examples, the spec should be fixed"
    undeclared_where: " (%{path})"
    unused_message: "code %{code} is declared in the enum but appears in no example; its handling rule comes from the dictionary"
    gap_message: "operation %{key} does not declare %{codes}, which its sibling operations (%{operations}) declare; generic rules were built for them"
    overlay_fragment: |
      - target: "%{path}"
        update:
          x-specgen-error-actions:
            %{code}: reject  # reject | retry | retry_backoff | alert | escalate

  webhook:
    missing: "the spec describes no inbound notifications (no operation with security: [] and no webhooks section); the service learns an operation's status by polling through fetch_status only"
    from_status_field: "no event field found, the event is read from the value of status field `%{name}`; "
    event_unmapped: "event %{event} was not translated into an internal status: %{evidence}; set the status in an overlay"
    event_undeclared: "event %{event} appears in example %{name} but not in the enum of field `%{field}`; the event list was extended with it, the spec should be fixed"
    no_events: "the webhook body (%{schema}) has neither an event field — a string enum whose values read as statuses — nor a status field with an enum; process_callback cannot determine the outcome of an operation"

  signature:
    header_evidence: "header parameter %{header} matches header_names of rules/signatures.yml"
    profile_evidence: "rules/signatures.yml profile %{name} matched by header %{header}"
    algorithm_confirmed: "; the description confirms it: %{words}"
    custom_evidence: "header %{header} is known to rules/signatures.yml but matches no profile"
    algorithm_hint: "the description names %{words} -> %{algorithm}"
    algorithm_unknown: "the description names no signature algorithm"
    encoding_unknown: "the spec does not say how the signature is encoded (hex | base64)"
    payload_unknown: "the spec does not say what is signed: the raw body or {id}.{timestamp}.{body}"
    tolerance_unknown: "the replay tolerance goes with the signed payload"
    tolerance_not_applicable: "not applicable: the signed payload carries no timestamp"
    secret_key_default: "secret key name by the convention of profile %{profile}: %{key}"
    secret_key_unknown: "rules/signatures.yml has no default profile to take the secret key name from"
    overlay_evidence: "x-specgen-signature: %{key} = %{value}"
    overlay_bad: "x-specgen-signature: %{key} is given the unknown value %{value} (allowed: %{allowed}); the extension was ignored"
    conflict_message: "the description of webhook %{key} names %{words} (%{hinted}), but rules/signatures.yml profile %{name} sets %{algorithm}; the profile was kept — check the spec or pin the algorithm in an overlay"
    incomplete_message: "the signature profile of webhook %{key} is incomplete: %{missing} not derived; the fragment below sets them"
    missing_message: "webhook %{key} declares no signature header (header_names of rules/signatures.yml); there is nothing to verify notifications with — set a signature profile in an overlay"
    overlay_fragment: |
      - target: "%{path}"
        update:
          x-specgen-signature:
            profile: custom
            header: %{header}
            algorithm: %{algorithm}  # hmac_sha256 | hmac_sha512 | hmac_sha1
            encoding: hex  # hex | base64
            payload: raw_body  # raw_body | id_timestamp_body
            secret_key: %{secret_key}

  idempotency:
    header_evidence: "header parameter %{header} matches an alias of rules/idempotency.yml; accepted by: %{operations}"
    optional_note: "; declared required: false, but per rules/idempotency.yml (send_when_optional) the key is always sent"
    strategy_evidence: "rules/idempotency.yml: default_strategy %{strategy} — the key is derived deterministically from operation.id, a replay yields the same key"
    dedup_unknown: "no operation with the header (%{operations}) declares a %{status} response with the success schema"
    dedup_unclear_message: "header %{header} is declared, but no operation describes a %{status} response with the success schema; on a replay the service cannot tell a duplicate from an error — ask the provider or describe the response in an overlay"
    dedup_overlay: |
      - target: "%{path}.responses"
        update:
          '%{status}':
            description: Duplicate idempotency key, previous result returned
            content:
              application/json:
                schema:
                  $ref: '%{ref}'
    missing_message: "no operation declares an idempotency header (aliases of rules/idempotency.yml: %{aliases}); a replay after a network failure would create a second payout — ask the provider or declare the header in an overlay"
    missing_overlay: |
      - target: "%{path}"
        update:
          parameters:
            - name: %{header}
              in: header
              required: false
              schema:
                type: string
                format: uuid

  # Other interaction conditions (IR::Condition): not the shape of a request
  # but its limits.
  condition:
    retry_after_evidence: "response %{status} declares header %{header} — a pause before retrying"
    rate_limited_evidence: "response %{status} is declared: the operation is rate limited (RFC 6585)"
    idempotency_optional_evidence: "header %{header} is declared with required: false; per rules/idempotency.yml the key is always sent"
    constraint_evidence: "%{keyword}: %{value} on field `%{name}` (role %{role} by a rules/roles.yml synonym)"
    restriction_evidence: "the description matched pattern %{pattern} (%{sentence}); statuses from the enum: %{statuses}"
    unclear_message: "the description of operation %{key} reads as a status restriction (%{sentence}) but names no status from the enum of the status field; the condition was not derived — check the spec"

  units:
    unit_name:
      minor: "minor units"
      major: "major units"
    currency_overlay: "x-specgen-currency: %{value} on the amount field"
    currency_listed: "%{keyword}: [%{value}] on field `%{name}`"
    currency_multiple: "enum of field `%{name}` lists several currencies: %{values}"
    currency_default: "default: %{value} on field `%{name}`; no enum, so this is one of the possible currencies"
    currency_example: "example: %{value} on field `%{name}`; neither enum nor default, so this is one of the possible currencies"
    currency_missing: "no field matches a synonym of role currency in rules/roles.yml"
    currency_silent: "field `%{name}` matches role currency but declares no enum, default or example"
    currency_missing_message: "amount currency could not be derived (%{evidence}); without a currency code the ISO 4217 exponent cannot be determined — set the currency in an overlay"
    currency_multiple_message: "field `%{name}` allows several currencies (%{values}); the exponent depends on the currency of each operation — pin the currency in an overlay or extend the generator for multi-currency"
    currency_code_message: "currency code %{code} is not in the ISO 4217 table (rules/currencies.yml); the default exponent %{exponent} was taken — check it and pin it in an overlay"
    currency_overlay_fragment: |
      - target: "%{path}"
        update:
          x-specgen-currency: RUB  # ISO 4217 code
    exponent_overlay: "x-specgen-exponent: %{value} on the amount field"
    exponent_iso: "ISO 4217: %{code} exponent %{exponent}"
    exponent_default: "default exponent %{exponent} from rules/currencies.yml: code %{code} is not in the ISO 4217 table"
    exponent_shared: "ISO 4217: every currency of the enum (%{codes}) has exponent %{exponent}"
    exponent_differs: "the currencies of the enum (%{codes}) have different ISO 4217 exponents, no single multiplier is possible"
    exponent_unknown: "without a currency code the ISO 4217 exponent cannot be determined"
    unit_overlay: "x-specgen-amount-unit: %{value} on the amount field"
    unit_overlay_bad: "x-specgen-amount-unit: unknown value %{value} (allowed: %{allowed}); the extension was ignored"
    unit_integer: "type: integer -> minor units"
    unit_fractional: "type: %{type}, fractional example %{example} -> major units"
    unit_unknown: "type: %{type} with no fractional example: units not derived"
    unit_confirmed: "; the description confirms it: %{words}"
    unit_minimum: "; minimum %{minimum} = %{major} %{code}"
    unknown_message: "amount units of field `%{name}` could not be derived (type: %{type}, no fractional example); without a multiplier the service cannot build a request — set the units in an overlay"
    missing_amount_message: "no amount field found in any schema: no name matches a synonym of role amount in rules/roles.yml; without a multiplier the service cannot build a request — add a synonym to the dictionary"
    inconsistent_description: "amount field `%{name}` was derived as %{unit}, but its description speaks of %{said}: %{sentence}; check and pin the units in an overlay"
    inconsistent_fraction: "amount field `%{name}` was derived as minor units, but %{keyword} = %{value} is fractional; minor units are always whole — check and pin the units in an overlay"
    overlay_fragment: |
      - target: "%{path}"
        update:
          x-specgen-amount-unit: %{unit}  # minor | major
          x-specgen-exponent: %{exponent}  # ISO 4217 minor unit exponent
