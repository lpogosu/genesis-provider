# locales/en/validators.yml — texts of the validation stage: written fixtures
# checked against the schemas of the specification they came from.
#
# Один файл на стадию конвейера, чтобы две стадии не правили один файл.
# Подстановки — %{имя}; набор ключей обязан совпадать с
# locales/ru/validators.yml, это проверяет spec/unit/specgen/texts_spec.rb.
#
# Ключевые слова схемы (`enum`, `pattern`, `maxLength`) не переводятся: это
# слова JSON Schema, читатель ищет их в спецификации как есть.

validators:
  subject_request: "request %{name}"
  subject_response: "response %{name}"
  subject_notification: "notification %{name}"
  mismatch: "field `%{field}` fails `%{keyword}`"
  mismatch_more: "(and %{count} more mismatches)"
  whole_body: "the body itself"
  schema_undeclared: "the specification declares no schema for this body — nothing to check against"
  body_undeclared: "the specification promised a body but never described it — nothing to check"
  validator_failed: "the schema could not be checked: %{error}"
  fixtures_unreadable: "the fixtures file is not readable as JSON: %{error}"

  # Прогон собранного класса на его же фикстурах. Заголовок находки — «прогон:
  # <метод> — <что проверяли>»; сообщение читает человек, который открыл
  # сгенерированный класс рядом с отчётом, поэтому в нём всегда есть и
  # ожидаемое, и полученное.
  run_subject: "run: %{method} — %{aspect}"
  run_subject_load: "run: loading the class %{name}"
  run_subject_stage: "run: the stage as a whole"
  aspect_request: "request to the provider"
  aspect_call: "client call %{verb} %{path}"
  aspect_auth: "authorization header %{header}"
  aspect_idempotency: "idempotency key %{header}"
  aspect_body: "request body"
  aspect_result: "operation identifier in the result"
  aspect_prechecks: "the operation from the request example"
  aspect_min_amount: "amount below the minimum (%{value})"
  aspect_response: "response %{status}"
  aspect_dedup: "response %{status}: deduplication as success"
  aspect_status: "status %{status}"
  aspect_event: "notification %{name}"
  aspect_signature: "notification signature %{name}"
  run_exception: "the call raised an exception: %{error}"
  run_no_class: "the file declares no class %{name}"
  run_no_method: "the class declares no method %{method}"
  run_no_create: "the specification declares no creation operation — nothing to call"
  run_no_status: "the specification declares no status operation — nothing to call"
  run_no_webhook: "the specification declares no webhooks — nothing to check a notification with"
  run_no_fixture: "fixtures.json has no fixture for this operation"
  run_no_body: "the operation has no request body — nothing to compare"
  run_no_header_fixture: "the request fixture carries no such header — nothing to compare against"
  run_auth_computed: "the class computes the header value itself (%{method}), and the generator left that method to a human: in the run it answers with a stub, while the fixture carries the resolved part of the expression"
  run_no_condition: "the specification sets no minimum amount — nothing to check"
  run_no_accessor: "the platform has no expression for the amount, the code carries a TODO there"
  run_no_id_path: "the success response schema has no field with the provider_operation_id role"
  run_no_raw_body: "the fixture carries no raw body bytes — nothing to sign"
  run_no_signature_profile: "the signature profile was not derived, the code carries a TODO there"
  run_signature_timestamp: "the signature profile checks the timestamp tolerance against the clock, while the fixture is signed with a fixed timestamp (SPECGEN_TIMESTAMP): the outcome would depend on the date of the run rather than on the code"
  run_minimum_zero: "the minimum amount is 0: no amount is below it, and no failure either"
  run_no_signature_in_callback: "the route does not put raw bytes into the callback argument — the public verifier checks the signature"
  run_no_outcome: "the method returned no platform result"
  run_no_calls: "the client received no calls"
  run_many_calls: "the client received %{count} calls, exactly one was expected"
  run_base_url: "the address does not start with BASE_URL %{expected}: %{actual}"
  run_call_mismatch: "expected %{expected}, got %{actual}"
  run_header_missing: "the header %{header} was not sent; sent: %{sent}"
  run_header_mismatch: "header %{header}: expected %{expected}, sent %{actual}"
  run_body_not_hash: "the request body is not a hash: %{actual}"
  run_body_missing: "the request body has no key `%{key}`"
  run_body_mismatch: "the value of `%{key}`: expected %{expected}, sent %{actual}"
  run_expected_success: "expected success, got the failure %{code} (%{key})"
  run_expected_failure: "expected the failure %{code}, got success"
  run_failure_code: "expected the failure code %{expected}, got %{actual}"
  run_failure_key: "expected the localization key %{expected}, got %{actual}"
  run_result_missing: "the result carries no operation identifier: %{actual}"
  run_result_mismatch: "the identifier in the result: expected %{expected}, got %{actual}"
  run_helper_wrong: "expected the call %{expected}, called: %{actual}"
  run_helper_extra: "this status does not change the operation, yet called: %{called}"
  run_signature_rejected: "the signature from the fixture was rejected: %{code} (%{key})"
  run_refused: "the method refused before the request: %{code} (%{key})"
