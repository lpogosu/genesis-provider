# locales/ru/validators.yml — тексты стадии проверки: сверка записанных
# фикстур со схемами той спецификации, из которой они выведены.
#
# Один файл на стадию конвейера, чтобы две стадии не правили один файл.
# Подстановки — %{имя}; набор ключей обязан совпадать с
# locales/en/validators.yml, это проверяет spec/unit/specgen/texts_spec.rb.
#
# Ключевые слова схемы (`enum`, `pattern`, `maxLength`) не переводятся: это
# слова JSON Schema, читатель ищет их в спецификации как есть.

validators:
  subject_request: "запрос %{name}"
  subject_response: "ответ %{name}"
  subject_notification: "уведомление %{name}"
  mismatch: "поле `%{field}` не проходит `%{keyword}`"
  mismatch_more: "(и ещё расхождений: %{count})"
  whole_body: "тело целиком"
  schema_undeclared: "схема тела в спецификации не объявлена — сверить не с чем"
  body_undeclared: "спецификация обещала тело, но не описала его — сверить нечего"
  validator_failed: "схему не удалось проверить: %{error}"
  fixtures_unreadable: "файл фикстур не читается как JSON: %{error}"

  # Прогон собранного класса на его же фикстурах. Заголовок находки — «прогон:
  # <метод> — <что проверяли>»; сообщение читает человек, который открыл
  # сгенерированный класс рядом с отчётом, поэтому в нём всегда есть и
  # ожидаемое, и полученное.
  run_subject: "прогон: %{method} — %{aspect}"
  run_subject_load: "прогон: загрузка класса %{name}"
  run_subject_stage: "прогон: стадия целиком"
  aspect_request: "запрос к провайдеру"
  aspect_call: "вызов клиента %{verb} %{path}"
  aspect_auth: "заголовок авторизации %{header}"
  aspect_idempotency: "ключ идемпотентности %{header}"
  aspect_body: "тело запроса"
  aspect_result: "идентификатор операции в результате"
  aspect_prechecks: "операция из примера запроса"
  aspect_min_amount: "сумма ниже минимума (%{value})"
  aspect_response: "ответ %{status}"
  aspect_dedup: "ответ %{status}: дедупликация как успех"
  aspect_status: "статус %{status}"
  aspect_event: "уведомление %{name}"
  aspect_signature: "подпись уведомления %{name}"
  run_exception: "вызов бросил исключение: %{error}"
  run_no_class: "класса %{name} в файле нет"
  run_no_method: "класс не объявляет метода %{method}"
  run_no_create: "спецификация не описывает операции создания — вызывать нечего"
  run_no_status: "спецификация не описывает операции опроса статуса — вызывать нечего"
  run_no_webhook: "спецификация не описывает вебхуков — уведомление проверить нечем"
  run_no_fixture: "в fixtures.json нет фикстуры для этой операции"
  run_no_body: "у операции нет тела запроса — сверять нечего"
  run_no_header_fixture: "в фикстуре запроса этого заголовка нет — сверять не с чем"
  run_auth_computed: "значение заголовка вычисляет сам класс (%{method}), и этот метод генератор оставил человеку: в прогоне он отвечает заглушкой, а в фикстуре стоит раскрытая часть выражения"
  run_no_condition: "спецификация не задаёт минимальной суммы — проверять нечего"
  run_no_accessor: "у платформы нет выражения для суммы, в коде на этом месте TODO"
  run_no_id_path: "в схеме успешного ответа нет поля с ролью provider_operation_id"
  run_no_raw_body: "в фикстуре нет сырых байтов тела — подпись считать не по чему"
  run_no_signature_profile: "профиль подписи не выведен, в коде на этом месте TODO"
  run_signature_timestamp: "профиль подписи проверяет допуск метки времени по часам, а фикстура подписана фиксированной меткой (SPECGEN_TIMESTAMP): итог такой проверки зависел бы от даты прогона, а не от кода"
  run_minimum_zero: "минимальная сумма — 0: ниже неё суммы не бывает, и отказа тоже"
  run_no_signature_in_callback: "маршрут не кладёт сырые байты в аргумент колбэка — подпись проверяет публичный верификатор"
  run_no_outcome: "метод не вернул результата платформы"
  run_no_calls: "клиент не получил ни одного вызова"
  run_many_calls: "клиент получил вызовов: %{count}, ожидался один"
  run_base_url: "адрес не начинается с BASE_URL %{expected}: %{actual}"
  run_call_mismatch: "ожидался %{expected}, получен %{actual}"
  run_header_missing: "заголовок %{header} не отправлен; отправлены: %{sent}"
  run_header_mismatch: "заголовок %{header}: ожидалось %{expected}, отправлено %{actual}"
  run_body_not_hash: "тело запроса не хеш: %{actual}"
  run_body_missing: "в теле запроса нет ключа `%{key}`"
  run_body_mismatch: "значение `%{key}`: ожидалось %{expected}, отправлено %{actual}"
  run_expected_success: "ожидался успех, получен отказ %{code} (%{key})"
  run_expected_failure: "ожидался отказ %{code}, получен успех"
  run_failure_code: "ожидался код отказа %{expected}, получен %{actual}"
  run_failure_key: "ожидался ключ локализации %{expected}, получен %{actual}"
  run_result_missing: "в результате нет идентификатора операции: %{actual}"
  run_result_mismatch: "идентификатор в результате: ожидался %{expected}, получен %{actual}"
  run_helper_wrong: "ожидался вызов %{expected}, вызвано: %{actual}"
  run_helper_extra: "этот статус не меняет операцию, но вызвано: %{called}"
  run_signature_rejected: "подпись из фикстуры отвергнута: %{code} (%{key})"
  run_refused: "метод отказал до запроса: %{code} (%{key})"
