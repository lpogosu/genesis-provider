# locales/ru/web.yml — тексты веб-интерфейса.
#
# Здесь только ошибки протокола HTTP-API: то, что пошло не так с самим
# запросом, а не со спецификацией. Ошибки разбора спецификации приходят
# из locales/*/spec_loader.yml и остальных стадий — веб-слой их не
# переписывает, он только заворачивает в тот же конверт.
#
# Формулировки для человека: это единственный текст, который увидит
# пользователь браузера, когда что-то не сошлось. Фраза обязана говорить,
# что делать, а не только что случилось.

web:
  errors:
    invalid_json: "тело запроса не разобралось как JSON: проверьте синтаксис и заголовок Content-Type"
    route_not_found: "такого маршрута нет; доступны /api/health, /api/specs, /api/analyze, /api/generate и /api/batch"
    body_too_large: "тело запроса больше допустимого размера; спецификация такого объёма в разбор не пойдёт"
    spec_required: "не сказано, что разбирать: передайте либо spec_id встроенной спецификации, либо filename вместе с content"
    internal_error: "внутренняя ошибка сервера; подробности записаны в журнал процесса"
