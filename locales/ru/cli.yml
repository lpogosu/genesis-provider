# locales/ru/cli.yml — тексты командной строки и экрана `integrate analyze`.
#
# Один файл на стадию конвейера, чтобы две стадии не правили один файл.
# Подстановки — %{имя}; набор ключей обязан совпадать с locales/en/cli.yml,
# это проверяет spec/unit/specgen/texts_spec.rb.

cli:
  error_prefix: "ошибка"
  out_of_memory: "спецификация не помещается в память после разворачивания `$ref`: развёрнутый документ во много раз больше исходного файла. Разберите её по частям (отдельные файлы на группы путей) или уберите повторные ссылки на крупные схемы"
  usage_prefix: "использование"
  spec_not_found: "файл спецификации не найден"
  not_implemented: "команда `%{command}` ещё не реализована (каркас, версия %{version})"
  unsupported_lang: "--lang %{lang} не поддерживается (доступно: %{supported})"
  unsupported_locale: "--locale %{locale} не поддерживается (доступно: %{supported})"
  need_spec_or_all: "нужен --spec или --all"
  overlay_with_all: "--overlay применяется к одной спецификации: укажите --spec"
  overlay_applied: "Overlay %{file}: применено %{actions}; переопределений %{conflicts}, целей не найдено %{misses}"
  batch_empty: "в каталоге нет спецификаций (.yaml, .yml, .json)"
  batch_heading: "Пакетный прогон: %{dir}"
  batch_failed: "не разобрана"
  batch_errors: "Не разобрано:"
  batch_total: "Итого: %{specs}, сгенерировано %{ok} из %{total}"
  batch_column:
    spec: "Спецификация"
    provider: "Провайдер"
    operations: "Операций"
    roles: "С ролью"
    coverage: "Покрытие"
    contract: "В контракте"
    warnings: "Замечаний"
    artifacts: "Файлов"
  version: "integrate %{version}"
  desc:
    generate: "Сгенерировать артефакты интеграции из OpenAPI-спецификации (команда по умолчанию)"
    generate_long: |
      Читает OpenAPI 3.x спецификацию платёжного провайдера и пишет четыре
      артефакта в каталог вывода: <provider>_service.rb, INTEGRATION.md,
      fixtures.json и report.md.

      Нужен либо --spec, либо --all.
    analyze: "Показать, что анализаторы распознали в спецификации, ничего не генерируя"
    analyze_long: |
      Запускает только стадию анализа и печатает промежуточное представление:
      провайдера и серверы, авторизацию, каждую операцию с ролью и уверенностью,
      каждую схему с полями и предупреждения. С --explain под каждым выведенным
      значением печатается обоснование, на котором оно держится.
    diff: "Показать значимые для интеграции отличия между двумя версиями спецификации"
    version: "Напечатать версию генератора"
  option:
    spec: "Путь к OpenAPI-спецификации (YAML или JSON)"
    provider: "Имя провайдера; без флага выводится из info.title"
    lang: "Целевой язык (поддерживается только ruby)"
    overlay: "Файл OpenAPI Overlay 1.0.0 с ручными переопределениями"
    output: "Каталог вывода"
    with_mock: "Сгенерировать из той же спецификации ещё и мок-сервер провайдера"
    fix: "Записать заготовку overlay со слотом TODO на каждую неоднозначность"
    strict: "Завершиться с кодом 1, если в отчёте есть предупреждения"
    all: "Прогнать все спецификации из каталога --specs и напечатать сводку"
    specs: "Каталог со спецификациями для --all (по умолчанию spec/fixtures/specs)"
    old: "Предыдущая версия спецификации"
    new: "Новая версия спецификации"
    explain: "Печатать обоснование под каждым выведенным значением"
    locale: "Язык сообщений и отчётов: ru или en (по умолчанию ru или SPECGEN_LOCALE)"

  # Преамбула команды генерации: что инструмент понял в спецификации, прежде
  # чем что-то записать. Форма взята из описания кейса, где ожидаемый вывод
  # начинается со списка найденных эндпоинтов, авторизации и подписи вебхука.
  parse:
    endpoints_more: "и ещё %{count}"
    webhook_signed: "Вебхук: %{path}, подпись %{header} (%{algorithm})"
    webhook_unsigned: "Вебхук: %{path}, подпись не объявлена"

summary:
  header: "Разбор спецификации... %{file}: OpenAPI %{version}, %{counts}"
  provider: "Провайдер: %{value}"
  provider_not_analysed: "Провайдер: не анализировался"
  base_url: "Базовый URL: переменная окружения %{env}"
  servers: "Серверы:"
  servers_none: "Серверы: не объявлены"
  auth: "Авторизация: %{scheme} -> %{type}, %{where}, ключи credentials: %{keys}"
  auth_none: "Авторизация: в спецификации не объявлена"
  auth_not_analysed: "Авторизация: не анализировалась"
  auth_unknown: "Авторизация: %{scheme} -> не распознана"
  units: "Единицы суммы: %{unit}, x%{multiplier} (%{evidence}); валюта %{currency}"
  units_unknown: "Единицы суммы: не выведены (%{evidence}); валюта %{currency}"
  units_none: "Единицы суммы: поле суммы не найдено"
  statuses: "Статусы: %{mapped} сопоставлено, %{unmapped} не выведено"
  statuses_none: "Статусы: не найдены"
  errors: "Ошибки: %{declared} в enum + %{undeclared} только в примерах%{dedup}"
  errors_dedup: "; дедупликация %{status} у %{operations}"
  errors_none: "Ошибки: правил нет"
  errors_generic: "общие"
  retry_after: "+Retry-After"
  webhook: "Вебхук: %{path} — %{events}, подпись %{signature}"
  webhook_signature: "%{header} (%{profile}: %{algorithm}, %{encoding}, %{payload})"
  webhook_unsigned: "не объявлена"
  webhook_none: "Вебхук: не описан (статус только опросом)"
  idempotency: "Идемпотентность: заголовок %{header} (%{need}), стратегия %{strategy}, %{dedup}"
  idempotency_dedup: "dedup on %{status}"
  idempotency_dedup_unknown: "дедупликация не выведена"
  idempotency_none: "Идемпотентность: заголовок не объявлен"
  conditions: "Условия взаимодействия: %{count}"
  conditions_none: "Условия взаимодействия: не найдены"
  operations: "Операции:"
  operations_none: "Операции: не найдены"
  request: "запрос:"
  responses: "ответы:"
  optional_body: "(необязательное тело)"
  not_in_contract: "вне контракта"
  unsecured: "без авторизации"
  schemas: "Схемы:"
  schemas_none: "Схемы: не найдены"
  field_roles: "Роли полей: %{known} из %{total} скалярных%{sources}; не выведено %{unknown}; контейнеров %{containers}"
  field_roles_source: "%{source} %{count}"
  field_required: "обязательное"
  field_optional: "необязательное"
  param_required: "обязательный"
  param_optional: "необязательный"
  required_when_equals: "обязательно при %{field} = %{value} (%{origin} %{confidence})"
  required_when_present: "обязательно при наличии %{field} (%{origin} %{confidence})"
  warnings: "Предупреждения: %{total} (%{counts})"
  overlay: "overlay:"
  unknown: "не выведено"

plural:
  operation: { one: "операция", few: "операции", many: "операций" }
  schema: { one: "схема", few: "схемы", many: "схем" }
  field: { one: "поле", few: "поля", many: "полей" }
  error: { one: "ошибка", few: "ошибки", many: "ошибок" }
  warning: { one: "предупреждение", few: "предупреждения", many: "предупреждений" }
  info: { one: "справка", few: "справки", many: "справок" }
  event: { one: "событие", few: "события", many: "событий" }
  action: { one: "действие", few: "действия", many: "действий" }
  spec: { one: "спецификация", few: "спецификации", many: "спецификаций" }

severity:
  error: "ОШИБКА"
  warning: "ВНИМАНИЕ"
  info: "СПРАВКА"

environment:
  sandbox: "песочница"
  production: "продакшен"
  unknown: "не определено"

# Источник выведенного значения (IR::Derived#source).
source:
  structural: "задано явно"
  registry: "по справочнику"
  heuristic: "эвристика"
  overlay: "из overlay"
  unknown: "не выведено"

# Откуда прочитано условие обязательности (IR::RequiredWhen#origin).
origin:
  dependent_required: "dependentRequired"
  if_then: "if/then"
  x_jsonschema_if: "x-jsonschema-if"
  discriminator: "discriminator"
  overlay: "overlay"
  description_hint: "намёк в описании"

# Где живёт параметр или учётные данные.
location:
  header: "заголовок"
  query: "query"
  cookie: "cookie"
  path: "путь"

# Где встречен код ошибки (IR::ErrorRule#seen_in).
seen_in:
  enum: "enum"
  example: "пример"
  response: "ответ"
