    not_required: "нет"
    none: "нет"
    source_col: "Источник"
    confidence_col: "Уверенность"
    # 1. Авторизация
    auth_none: "Спецификация не объявляет авторизации: %{helper} возвращает пустой хеш. Проверьте у провайдера, действительно ли запросы без учётных данных, — %{report}."
    auth_unknown: "Схема авторизации `%{scheme}` не распознана справочником rules/auth.yml: %{helper} содержит TODO и пустой хеш. Опишите схему в rules/auth.yml или через overlay — %{report}."
    auth_type: "Тип авторизации: `%{type}` — схема `%{scheme}` из securitySchemes, запись справочника rules/auth.yml «%{entry}»."
    auth_where_header: "Учётные данные уходят в заголовке %{names} каждого запроса к провайдеру."
    auth_where_query: "Учётные данные уходят в строке запроса (%{names}) каждого запроса — так решил провайдер; помните, что query попадает в логи прокси."
    auth_stub: "Получение %{what} спецификация не описывает: сгенерирован метод-заглушка %{stub} с TODO и NotImplementedError — реализуйте его под клиент платформы."
    auth_stub_oauth2: "токена OAuth2 (поток client_credentials, tokenUrl: %{token_url})"
    auth_stub_hmac: "подписи запроса (HMAC)"
    cred_key_col: "Ключ credentials"
    cred_where_col: "Где читается"
    cred_purpose_col: "Назначение"
    cred_auth: "учётные данные для запросов к провайдеру"
    cred_signature: "секрет подписи входящих уведомлений"
    secret_storage: "Значения секретов хранятся только в credentials платформы: в этом документе и в сервисе — одни имена ключей; в fixtures.json — только заглушки вида test_api_key, нужные, чтобы посчитать подпись уведомления."
    # 2. ENV
    env_name_col: "Переменная"
    env_purpose_col: "Назначение"
    env_default_col: "По умолчанию"
    env_required_col: "Обязательна"
    env_base_url: "базовый URL API провайдера (константа BASE_URL)"
    env_open_timeout: "таймаут соединения, секунды (константа OPEN_TIMEOUT)"
    env_read_timeout: "таймаут чтения ответа, секунды (константа READ_TIMEOUT)"
    env_default_sandbox: "`%{url}` — песочница из спецификации"
    env_default_first: "`%{url}` — первый сервер спецификации, среда не выведена: проверьте, что это песочница"
    env_default_placeholder: "`%{url}` — серверов в спецификации нет, задайте вручную"
    env_production: "Продакшен: задайте `%{env}=%{url}` — второй сервер спецификации."
    env_no_production: "Продакшен-сервер в спецификации не объявлен: URL боевой среды возьмите у провайдера."
    env_secrets: "Секреты через ENV не читаются: ключи credentials — %{keys}."
