# locales/ru/generators.yml — тексты стадии генераторов: строки CLI о
# записанных артефактах и комментарии, которые презентеры кладут в
# сгенерированный код (TODO, обоснования, пояснения к константам).
#
# Один файл на стадию конвейера. Подстановки — %{имя}; набор ключей обязан
# совпадать с locales/en/generators.yml, это проверяет
# spec/unit/specgen/texts_spec.rb. Комментарии, написанные прямо в
# templates/*.erb, сюда не входят: шаблон и есть локализованный контент.

generators:
  artifact: "Генерация %{what}... ok (%{lines}) -> %{path}"
  what:
    service: "сервиса"
    integration: "документации"
    fixtures: "фикстур"
    report: "отчёта"
  warnings: "Предупреждения: %{total} (%{counts}); подробности — ./integrate analyze --spec %{spec}"
  strict_failed: "--strict: есть предупреждения, код выхода 1 (файлы записаны)"
  write_failed: "не удалось записать файл: %{error}"
  template_failed: "шаблон не отрендерился: %{error}"

  service:
    # Тело запроса
    todo_role_unknown: "роль поля не определена. %{requirement} по спецификации."
    todo_no_accessor: "роль %{role} выведена, но выражения платформы для неё нет. %{requirement} по спецификации."
    todo_fill_platform: "где это лежит у платформы, знает только человек: заполните вручную или добавьте выражение в rules/contract.yml (раздел platform)"
    todo_shape: "тип: %{shape}"
    todo_description: "описание из спецификации: \"%{text}\""
    todo_evidence: "обоснование: %{evidence}"
    todo_fill: "заполните вручную или задайте x-specgen-role в overlay / добавьте синоним в rules/roles.yml"
    todo_array: "массив (элементы: %{item}) — по ролям не собирается, заполните вручную"
    required: "Обязательно"
    conditionally_required: "Условно обязательно"
    role_doubt: "роль %{role} выведена с уверенностью ниже порога (%{confidence}): %{evidence} — проверьте по report.md"
    required_when_equals: "обязательно при %{field} = %{value} (%{origin})"
    required_when_present: "обязательно при наличии %{field} (%{origin})"
    payload_schema_missing: "у операции создания нет схемы тела запроса — соберите payload вручную"
    # Реквизиты получателя
    requisites_doc: "Реквизиты получателя для тела запроса (поле %{field}). Форма хеша %{hash} задана платформой и зависит от способа выплаты, поэтому ветка по request_method (он же payment_method шлюза), а состав полей в ветке — из условной обязательности спецификации."
    requisites_returns: "реквизиты получателя; nil-значения убираются в build_payload"
    requisites_method_unknown: "способ выплаты платформы для значения %{value} неизвестен: в таблице requisites (rules/contract.yml) такого ключа нет. Взято значение спецификации — сверьте его с payment_method шлюза и опишите, где эти реквизиты лежат в %{hash}"
    requisites_else: "способ выплаты вне %{values}: спецификация его не объявляла, собрать реквизиты не из чего"
    # Таблицы
    error_map_codes: "По коду ошибки провайдера из тела ответа."
    error_map_http: "По HTTP-коду, когда тело не несёт кода ошибки."
    error_action_doubt: "действие по умолчанию (%{confidence}) — код не совпал ни с одним правилом rules/errors.yml, проверьте"
    status_unmapped: "статус не сопоставлен: %{evidence}; задайте x-specgen-status-map в overlay"
    event_unmapped: "событие не сопоставлено: %{evidence}; задайте x-specgen-status-map в overlay"
    currency_comment: "Валюта запроса: платформа её не сообщает, поле currency у операции есть не всегда — код взят из спецификации (%{evidence})."
    units_comment: "operation.amount — в мажорных единицах; провайдер ждёт %{unit} (%{evidence}, валюта %{currency})."
    units_unknown: "единицы суммы не выведены (%{evidence}); множитель 1 — задайте x-specgen-amount-unit и x-specgen-exponent в overlay"
    units_none: "поле суммы в спецификации не найдено"
    idempotency_comment: "Ключ идемпотентности отправляется всегда, даже если спецификация помечает заголовок необязательным (%{evidence})."
    namespace_comment: "Пространство имён UUID v5 (RFC 4122) для ключа идемпотентности: константа из rules/idempotency.yml, менять нельзя — иначе повторы перестанут дедуплицироваться."
    servers_none: "спецификация не объявляет серверов — укажите базовый URL песочницы"
    sandbox_unknown: "среда серверов не выведена, взят первый из списка — проверьте, что это песочница"
    # Предпроверки
    condition:
      min_amount: "minimum: %{value} в единицах провайдера = %{major} в мажорных (%{source})"
      max_amount: "maximum: %{value} в единицах провайдера = %{major} в мажорных (%{source})"
      field_max_length: "%{field}: maxLength %{value} (%{source})"
      field_pattern: "%{field}: pattern %{value} (%{source})"
      field_enum: "%{field}: допустимые значения %{value} (%{source})"
    condition_doubt: "условие прочитано из прозы с уверенностью ниже порога — проверьте по report.md"
    condition_in_requisites: "условие для поля %{field}: значение зависит от способа выплаты и собирается в %{method} — проверьте его там, где способ выплаты известен"
    condition_no_accessor: "условие для поля %{field}: у платформы нет выражения для его роли (rules/contract.yml, раздел platform)"
    # Создание
    create_missing: "спецификация не описывает операцию создания (create_payout / create_deposit) — метод отказывает; проверьте роли операций в report.md"
    create_other: "Вторая операция создания в спецификации: %{keys}; контракт даёт один метод, она осталась снаружи."
    dedup: "Повтор с тем же ключом идемпотентности: ответ с кодом конфликта несёт схему успешного ответа, по draft-ietf-httpapi-idempotency-key-header это прежний результат, а не ошибка — подхватываем существующую операцию."
    path_param_unknown: "параметр пути {%{name}} без роли — подставлен %{guess}; задайте x-specgen-role в overlay"
    # Опрос статуса
    status_missing: "спецификация не описывает операцию опроса статуса (fetch_status) — метод отказывает"
    status_field_unknown: "поле статуса в ответе не найдено по ролям — подставлено body['status']"
    # Уведомления
    webhook_missing: "спецификация не описывает вебхуков: статус только опросом (fetch_status); метод отказывает"
    callback_shape: "контракт не описывает аргумент %{param} — предполагается, что это само разобранное тело уведомления"
    target_unknown: "в схеме уведомления нет полей с ролями provider_operation_id / external_id — понять, какой операции касается уведомление, не по чему"
    event_field_unknown: "в схеме уведомления нет ни поля события, ни поля статуса — внутренний статус вывести не по чему"
    # Подпись
    signature_doc: "Проверяет подпись входящего уведомления до любой другой логики: сравнение константное по времени, отсутствующий заголовок — отказ."
    signature_returns: "результат отказа или nil, если подпись верна"
    signature_unpack_doc: "Подпись по аргументу process_callback: аргумент — уже разобранный JSON, сырые байты тела берутся из него по выражениям rules/contract.yml. Если маршрут вебхука их не передал, вызовите %{method} до разбора тела."
    signature_outside_doc: "Подпись здесь не проверяется: process_callback получает уже разобранный JSON, а HMAC считается по байтам тела. Вызовите %{method} на маршруте вебхука до разбора тела — иначе уведомление не проверено."
    signature_absent: "спецификация не описывает подпись уведомлений — заголовок неизвестен, метод всегда отказывает; задайте x-specgen-signature в overlay"
    signature_header_unknown: "заголовок подписи не выведен — метод всегда отказывает; задайте x-specgen-signature в overlay"
    signature_member_unknown: "%{member} подписи не выведен (%{evidence}); взято значение по умолчанию"
    signature_matches_doc: "Значение заголовка — список версий через пробел с префиксом; совпадение любой версии принимается."
    # Авторизация
    auth_doc: "Заголовки авторизации: схема %{scheme} (%{type}) по записи rules/auth.yml «%{entry}». Секрет читается из provider.credentials."
    auth_none: "Спецификация не объявляет авторизации: заголовков нет."
    auth_unknown: "Схема авторизации %{scheme} не распознана — заголовки не собраны."
    auth_todo: "схема авторизации не распознана; опишите её в rules/auth.yml или через overlay"
    auth_query_note: "Учётные данные уходят в строку запроса (auth_query), не в заголовки."
    auth_query_doc: "Параметры строки запроса с учётными данными; попадают в URL каждого запроса."
    oauth2_stub: "получение access_token по потоку client_credentials (tokenUrl: %{token_url}) с кешированием до expires_in — спецификация описывает только схему, реализуйте под клиент платформы"
    oauth2_stub_message: "access_token: поток client_credentials не реализован"
    hmac_stub: "подпись самого запроса (HMAC) — параметры возьмите из профиля rules/signatures.yml, спецификация их не описывает"
    hmac_stub_message: "request_signature: подпись запроса не реализована"
    # Операции вне контракта
    extra_doc: "Операция %{key} (роль %{role}, %{confidence}) не отображена на контракт BaseService: отдельный публичный метод."
    unmapped_doc: "роль операции не распознана (%{evidence}) — проверьте, нужна ли она интеграции"
    extra_payload_doc: "Тело запроса операции %{key} по ролям полей схемы %{schema}; nil-значения убираются."
    extra_payload: "тело запроса по схеме %{schema} (обязательные поля: %{required}) собирается вручную"
    cancel_restriction: "Отмена возможна только в статусах провайдера %{statuses} (%{source}), во внутренних терминах — CANCELLABLE_STATUSES."
    # Приватные методы
    build_payload_doc: "Тело запроса по ролям полей схемы %{schema}; nil-значения убираются."
    request_headers_doc: "Заголовки запроса на создание: авторизация, тип содержимого и ключ идемпотентности."
    request_headers_plain_doc: "Заголовки запроса на создание: авторизация и тип содержимого."
    accept_response_doc: "Успешный ответ провайдера на отмену или подтверждение: перевести статус, если он пришёл и знаком; незнакомый статус оставляет операцию in_progress. Результата у метода нет — статус меняют хелперы."
    accept_created_doc: "Успешный ответ на создание: перевести статус и вернуть платформе идентификатор операции у провайдера — она сохраняет его как provider_operation_key из result[:id]."
    apply_internal_status_doc: "Перевод цели уведомления или операции во внутренний статус хелперами базового класса; in_progress ничего не меняет."
    map_status_doc: "Статус провайдера → внутренний по STATUS_MAP; nil для незнакомого."
    provider_failure_doc: "Ответ с ошибкой: действие по ERROR_MAP (сначала код провайдера, потом HTTP-код) — это политика обработки, а платформе уходит её код отказа."
    parse_json_doc: "Тело ответа как хеш; битый или не-объектный JSON даёт пустой хеш."
    compact_payload_doc: "Рекурсивно убирает nil-значения: необязательное поле без значения не отправляется."
    to_provider_units_doc: "Сумма из мажорных единиц платформы в единицы провайдера по AMOUNT_MULTIPLIER (ISO 4217)."
    idempotency_key_doc: "Детерминированный ключ идемпотентности от %{id}: повтор даёт тот же ключ и дедуплицируется провайдером. Никакой случайности."
    uuid_v5_doc: "UUID v5 по RFC 4122 §4.3: SHA-1 от пространства имён и имени, версия 5, вариант RFC. Только stdlib."
    header_value_doc: "Значение заголовка без учёта регистра имени; nil, если заголовка нет."
    secure_equal_doc: "Константное по времени сравнение строк одинаковой длины (OpenSSL.fixed_length_secure_compare); разная длина — false, а не исключение."
    callback_target_doc: "Кого касается уведомление: идентификатор операции у провайдера, потом внешний — он может быть необязательным. Поиск операции в хранилище происходит вне сервиса провайдера."
    callback_lookup_doc: "Операция платформы по идентификаторам из уведомления: сначала идентификатор провайдера, потом внешний — он может быть необязательным."
    provider_id_unknown: "в успешном ответе нет поля с ролью provider_operation_id — вернуть платформе нечего, и она не сохранит provider_operation_key; укажите поле через x-specgen-role в overlay"
    platform_failure_code_doc: "Код отказа для платформы: по HTTP-коду ответа провайдера, иначе по действию из ERROR_MAP."

  # INTEGRATION.md: ячейки таблиц и фразы, которые собирают презентеры
