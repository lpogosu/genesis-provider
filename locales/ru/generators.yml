    method_col: "Метод"
    endpoint_col: "HTTP-метод и путь провайдера"
    request_method_col: "request_method"
    idempotency_col: "Идемпотентность"
    result_col: "Результат"
    method_no_http: "— (без обращения к провайдеру)"
    method_incoming: "%{endpoint} — входящий, вызывает провайдер"
    method_missing: "в спецификации не объявлено; метод отказывает %{failure} — %{report}"
    request_method_none: "—"
