# locales/ru/analyzers.yml — тексты стадии анализа: предупреждения,
# обоснования выведенных значений и заготовки overlay.
#
# Один файл на стадию конвейера, чтобы две стадии не правили один файл.
# Подстановки — %{имя}; набор ключей обязан совпадать с
# locales/en/analyzers.yml, это проверяет spec/unit/specgen/texts_spec.rb.
#
# Значения внутри YAML-фрагментов overlay (`url`, `description: Production`)
# остаются английскими: их читает не человек, а сама спецификация и лексикон
# EnvironmentDetector, который знает только ASCII-слова.

analyzers:
  # Формулировки, общие для нескольких анализаторов: спецификация нарушает
  # форму, заданную OpenAPI, в одном и том же месте по-разному.
  common:
    must_be_object: "`%{key}` должен быть объектом"
    must_be_list: "`%{key}` должен быть списком"

  info:
    name_from_option: "--provider %{given}"
    name_from_title: "из info.title %{title} -> %{slug}"
    name_unknown_message: "имя провайдера не выведено: передайте --provider, чтобы задать имя класса сервиса, его файла и переменных окружения"
    name_unknown_evidence: "ни --provider, ни info.title не дали имени"
    base_url_env_evidence: "соглашение: <PROVIDER>%{suffix} из имени провайдера %{name}"
    base_url_env_unknown: "нет имени провайдера, из которого построить имя переменной окружения"
    servers_absent: "спецификация не объявляет `servers`; сгенерированному сервису неоткуда взять базовый URL по умолчанию"
    servers_malformed: "список `servers` в спецификации пуст или искажён; сгенерированному сервису неоткуда взять базовый URL по умолчанию"
    servers_overlay: |
      - target: "$"
        update:
          servers:
            - url: https://api.example.com
              description: Production
    server_url_missing: "в элементе `servers` нет пригодной строки `url`, элемент пропущен"
    environment_evidence: "%{place} сервера %{text} содержит %{word} -> %{environment}"
    environment_place:
      description: "описание"
      host: "хост"
    environment_unknown_message: "ни описание, ни хост не говорят, песочница это или продакшен; запросы могут уйти не туда"
    environment_unknown_evidence: "ни в описании, ни в хосте нет слова, называющего окружение"
    environment_overlay: |
      - target: "%{path}"
        update:
          description: Production

  auth:
    type_evidence: "запись rules/auth.yml %{entry} совпала по %{facts}"
    credentials_evidence: "запись rules/auth.yml %{entry} читает provider.credentials %{keys}"
    token_url_missing: "поток %{flow} не объявляет tokenUrl, поэтому сгенерированному сервису негде запросить токен"
    key_in_query: "учётные данные едут в query-строке, где их сохраняют логи прокси и история браузера; так решил провайдер, а не генератор"
    param_name_missing: "схема авторизации %{name} не называет параметр, поэтому учётные данные некуда положить"
    scheme_unknown_message: "схема авторизации %{name} не совпала ни с одной записью rules/auth.yml, поэтому сгенерированный сервис не сможет авторизоваться"
    scheme_unknown_evidence: "%{name} не совпала ни с одной записью справочника"
    unknown_overlay: |
      - target: %{path}
        update:
          # перепишите схему в терминах, известных rules/auth.yml,
          # или добавьте запись в этот справочник
          type: http
          scheme: bearer
    security_shape: "`security` должен быть списком объектов требований; значение проигнорировано"
    scheme_shape: "схема авторизации %{name} должна быть объектом; она пропущена"
    undeclared_message: "операции требуют схему авторизации %{names}, которую components.securitySchemes не объявляет"
    undeclared_evidence: "%{name} требуется операциям, но нигде не объявлена"
    multiple_schemes: "схем авторизации в спецификации: %{total}; выбрана %{chosen}, её требуют %{operations}; не используются: %{ignored}"
    absent_message: "спецификация вообще не объявляет авторизацию, поэтому сгенерированные запросы идут без учётных данных; для платёжного API это необычно, сверьтесь с контрактом"
    absent_evidence: "нет components.securitySchemes, ни одна операция не объявляет security"

  operation:
    id_missing: "операция не объявляет operationId; в этом отчёте и в сгенерированном коде она названа %{key}"
    unmapped: "в спецификации слишком мало признаков того, для чего эта операция, поэтому роль не присвоена (%{scores}); задайте роль в overlay"
    ambiguous: "две роли подходят этой операции почти одинаково; взята первая, но выбор стоит подтвердить (%{scores}); переопределить — в overlay"
    below_threshold: "признаков роли мало, поэтому взят лучший кандидат с низкой уверенностью (%{scores}); проверьте его или задайте роль в overlay"
    off_contract: "распознана как %{role}, но в Provider::BaseService нет метода для такой роли; она генерируется отдельным публичным методом и остаётся вне контракта"
    tags_shape: "`tags` должен быть списком строк"
    status_unknown: "ключ ответа %{code} — не HTTP-код, не диапазон и не `default`"
    scores: "%{scores} из %{cast} поданных голосов"
    match_evidence: "композитное сопоставление: %{parts} = %{score} из %{cast} поданных голосов; %{runner_up}"
    runner_up: "следующая %{role} %{score}"
    no_runner_up: "больше ничего не набрало голосов"
    no_signal_evidence: "ни один сигнал не совпал ни с одной ролью"
    lost_evidence: "%{reason}: %{scores} из %{cast} поданных голосов (floor %{floor}, minimum %{minimum}, margin %{margin})"
    # Почему роль не присвоена; печатается в начале обоснования.
    reason:
      below_threshold: "ниже порога"
      ambiguous: "неоднозначно"

  parameter:
    role_pending: "роли параметров сопоставляют матчеры полей, это более поздняя стадия"
    shape: "параметр должен быть объектом"
    name_missing: "у параметра должны быть `name` и известный `in`"

  # Поиск роли по имени (RoleLookup): словарь, а где он молчит — тот же
  # композит, что проставляет роли полей в IR. Этой строкой вывод честно
  # говорит, что опирается на насчитанную роль, а не на словарную.
  roles:
    tempered: "; поле `%{name}` опознано как %{role} матчерами (эвристика %{confidence}), выше этой уверенности вывод не поднимается"

  # Строка статуса -> внутренний статус (StatusReader); одни и те же слова
  # для enum, примеров и событий вебхука.
  status:
    canonical: "канон кейса: %{status} -> %{internal}"
    synonym: "синоним rules/statuses.yml: %{status} -> %{internal}"
    stripped: "событие %{event} читается как статус %{status}; "
    ambiguous: "статус %{status} неоднозначен: %{reason}"
    unknown: "статус %{status} не найден ни в каноне, ни среди синонимов rules/statuses.yml"
    tail: "составное имя %{status}: как статус читается его хвост %{tail} -> %{internal}; ведущие слова отброшены, поэтому уверенность понижена"
    partial: "статус %{status} целиком не найден ни в каноне, ни среди синонимов rules/statuses.yml; как статус читается только хвост %{tail} (%{internal}), но ведущее слово `%{word}` меняет смысл (modifiers rules/statuses.yml) — снимать его нельзя"
    overlay: "x-specgen-status-map: %{status} -> %{internal}"
    overlay_bad: "x-specgen-status-map: для %{status} задано неизвестное значение %{value} (допустимо: %{allowed})"
    ambiguous_message: "%{evidence}; выберите внутренний статус (in_progress | approved | rejected) в overlay"
    unknown_message: "%{evidence}; выберите внутренний статус в overlay или добавьте синоним в справочник"
    partial_message: "%{evidence}; выберите внутренний статус в overlay — молча приравнять его к хвосту нельзя: частично проведённый платёж ушёл бы в платформу как выплаченный"
    missing_from_enum: "статус %{status} встречается в примере, но его нет ни в одном enum поля статуса; карта статусов дополнена им, спецификацию стоит поправить"
    field_missing_message: "ни одна схема не объявляет поле статуса: ни одно имя не совпало с синонимами роли status в rules/roles.yml, и ни одному полю матчеры не дали эту роль, поэтому fetch_status и process_callback не смогут перевести ответ во внутренний статус"
    overlay_fragment: |
      - target: "%{path}"
        update:
          x-specgen-status-map:
            %{status}: in_progress  # in_progress | approved | rejected

  # Успешный путь дедупликации (DedupReader): одна фраза для карты ошибок и
  # для профиля идемпотентности.
  dedup:
    evidence: "%{status} возвращает %{schema} — ту же схему, что %{success_status}; по черновику IETF Idempotency-Key повтор возвращает прежний результат, поэтому это дедупликация, а не ошибка"

  error:
    http_evidence: "rules/errors.yml: HTTP %{code} совпал с записью %{entry} -> %{action}"
    default_evidence: "rules/errors.yml: для %{what} нет правила; действие по умолчанию %{action}"
    generic_suffix: "; код объявлен у %{operation}, у остальных операций правило достроено по соседям"
    pattern_evidence: "rules/errors.yml: код %{code} совпал с шаблоном %{name} -> %{action}"
    overlay_evidence: "x-specgen-error-actions: %{code} -> %{action}"
    overlay_bad: "x-specgen-error-actions: для %{code} задано неизвестное значение %{value} (допустимо: %{allowed}); расширение проигнорировано"
    what_code: "кода %{code}"
    what_status: "HTTP %{code}"
    action_unknown_message: "для %{what} нет правила в rules/errors.yml; взято действие по умолчанию %{action} с уверенностью %{confidence} — задайте действие в overlay или добавьте шаблон в справочник"
    undeclared_message: "код %{code} встречается в примере, но не объявлен в enum поля кода ошибки%{where}; карта ошибок строится как объединение enum и примеров, спецификацию стоит поправить"
    undeclared_where: " (%{path})"
    unused_message: "код %{code} объявлен в enum, но не встречается ни в одном примере; правило обработки построено по справочнику"
    gap_message: "операция %{key} не объявляет %{codes}, объявленные у соседних операций (%{operations}); для них достроены общие правила"
    overlay_fragment: |
      - target: "%{path}"
        update:
          x-specgen-error-actions:
            %{code}: reject  # reject | retry | retry_backoff | alert | escalate

  webhook:
    missing: "спецификация не описывает входящих уведомлений (нет операции с security: [] и нет секции webhooks); статус операции сервис узнает только опросом через fetch_status"
    from_status_field: "поле события не найдено, событие читается по значению поля статуса `%{name}`; "
    event_unmapped: "событие %{event} не переведено во внутренний статус: %{evidence}; задайте статус в overlay"
    event_undeclared: "событие %{event} встречается в примере %{name}, но его нет в enum поля `%{field}`; список событий дополнен им, спецификацию стоит поправить"
    no_events: "в теле вебхука (%{schema}) нет ни поля события — строкового enum, значения которого читаются как статусы, — ни поля статуса с enum; process_callback не сможет определить исход операции"

  signature:
    header_evidence: "параметр-заголовок %{header} совпал с header_names rules/signatures.yml"
    profile_evidence: "профиль rules/signatures.yml %{name} совпал по заголовку %{header}"
    algorithm_confirmed: "; описание подтверждает: %{words}"
    custom_evidence: "заголовок %{header} известен rules/signatures.yml, но не совпал ни с одним профилем"
    algorithm_hint: "описание называет %{words} -> %{algorithm}"
    algorithm_unknown: "описание не называет алгоритм подписи"
    encoding_unknown: "спецификация не говорит, как кодируется подпись (hex | base64)"
    payload_unknown: "спецификация не говорит, что подписывается: сырое тело или {id}.{timestamp}.{body}"
    tolerance_unknown: "допуск на повтор задаётся вместе с подписываемым телом"
    tolerance_not_applicable: "не применимо: в подписываемом теле нет метки времени"
    secret_key_default: "имя ключа секрета по соглашению профиля %{profile}: %{key}"
    secret_key_unknown: "в rules/signatures.yml нет профиля по умолчанию, у которого взять имя ключа секрета"
    overlay_evidence: "x-specgen-signature: %{key} = %{value}"
    overlay_bad: "x-specgen-signature: для %{key} задано неизвестное значение %{value} (допустимо: %{allowed}); расширение проигнорировано"
    conflict_message: "описание вебхука %{key} называет %{words} (%{hinted}), а профиль rules/signatures.yml %{name} задаёт %{algorithm}; профиль оставлен — проверьте спецификацию или закрепите алгоритм в overlay"
    incomplete_message: "профиль подписи вебхука %{key} неполон: не выведены %{missing}; фрагмент ниже задаёт их"
    missing_message: "вебхук %{key} не объявляет заголовок подписи (header_names rules/signatures.yml); подлинность уведомлений проверить нечем — задайте профиль подписи в overlay"
    overlay_fragment: |
      - target: "%{path}"
        update:
          x-specgen-signature:
            profile: custom
            header: %{header}
            algorithm: %{algorithm}  # hmac_sha256 | hmac_sha512 | hmac_sha1
            encoding: hex  # hex | base64
            payload: raw_body  # raw_body | id_timestamp_body
            secret_key: %{secret_key}

  idempotency:
    header_evidence: "параметр-заголовок %{header} совпал с алиасом rules/idempotency.yml; принимают: %{operations}"
    optional_note: "; объявлен required: false, но по rules/idempotency.yml (send_when_optional) ключ отправляется всегда"
    strategy_evidence: "rules/idempotency.yml: default_strategy %{strategy} — ключ детерминирован от operation.id, повтор даёт тот же ключ"
    dedup_unknown: "ни одна операция с заголовком (%{operations}) не объявляет ответ %{status} со схемой успешного ответа"
    dedup_unclear_message: "заголовок %{header} объявлен, но ни одна операция не описывает ответ %{status} со схемой успешного ответа; при повторе сервис не отличит дубль от ошибки — уточните у провайдера или опишите ответ в overlay"
    dedup_overlay: |
      - target: "%{path}.responses"
        update:
          '%{status}':
            description: Duplicate idempotency key, previous result returned
            content:
              application/json:
                schema:
                  $ref: '%{ref}'
    missing_message: "ни одна операция не объявляет заголовок идемпотентности (алиасы rules/idempotency.yml: %{aliases}); повтор запроса после сетевого сбоя создаст вторую выплату — уточните у провайдера или объявите заголовок в overlay"
    missing_overlay: |
      - target: "%{path}"
        update:
          parameters:
            - name: %{header}
              in: header
              required: false
              schema:
                type: string
                format: uuid

  # Другие условия взаимодействия (IR::Condition): не форма запроса, а его
  # границы.
  condition:
    retry_after_evidence: "ответ %{status} объявляет заголовок %{header} — пауза до повтора"
    rate_limited_evidence: "ответ %{status} объявлен: операция ограничена по частоте (RFC 6585)"
    idempotency_optional_evidence: "заголовок %{header} объявлен с required: false; по rules/idempotency.yml ключ отправляется всегда"
    constraint_evidence: "%{keyword}: %{value} у поля `%{name}` (роль %{role} по синониму rules/roles.yml)"
    restriction_evidence: "описание совпало с шаблоном %{pattern} (%{sentence}); статусы из enum: %{statuses}"
    unclear_message: "описание операции %{key} читается как ограничение по статусу (%{sentence}), но не называет ни одного статуса из enum поля статуса; условие не выведено — проверьте спецификацию"

  units:
    unit_name:
      minor: "минорные единицы"
      major: "мажорные единицы"
    currency_overlay: "x-specgen-currency: %{value} на поле суммы"
    currency_listed: "%{keyword}: [%{value}] у поля `%{name}`"
    currency_multiple: "enum поля `%{name}` перечисляет несколько валют: %{values}"
    currency_default: "default: %{value} у поля `%{name}`; enum не задан, поэтому это одна из возможных валют"
    currency_example: "example: %{value} у поля `%{name}`; ни enum, ни default не заданы, поэтому это одна из возможных валют"
    currency_missing: "ни одно поле не совпало с синонимами роли currency в rules/roles.yml"
    currency_silent: "поле `%{name}` совпало с ролью currency, но не задаёт ни enum, ни default, ни example"
    currency_missing_message: "валюта суммы не выведена (%{evidence}); без кода валюты экспоненту ISO 4217 определить нельзя — задайте валюту в overlay"
    currency_multiple_message: "поле `%{name}` допускает несколько валют (%{values}); экспонента зависит от валюты конкретной операции — закрепите валюту в overlay или доработайте генератор под мультивалютность"
    currency_code_message: "кода валюты %{code} нет в таблице ISO 4217 (rules/currencies.yml); взята экспонента по умолчанию %{exponent} — проверьте и закрепите её в overlay"
    currency_overlay_fragment: |
      - target: "%{path}"
        update:
          x-specgen-currency: RUB  # код ISO 4217
    exponent_overlay: "x-specgen-exponent: %{value} на поле суммы"
    exponent_iso: "ISO 4217: экспонента %{code} %{exponent}"
    exponent_default: "экспонента по умолчанию %{exponent} из rules/currencies.yml: кода %{code} нет в таблице ISO 4217"
    exponent_shared: "ISO 4217: у всех валют enum (%{codes}) экспонента %{exponent}"
    exponent_differs: "валюты enum (%{codes}) имеют разные экспоненты по ISO 4217, единый множитель невозможен"
    exponent_unknown: "без кода валюты экспоненту ISO 4217 определить нельзя"
    unit_overlay: "x-specgen-amount-unit: %{value} на поле суммы"
    unit_overlay_bad: "x-specgen-amount-unit: неизвестное значение %{value} (допустимо: %{allowed}); расширение проигнорировано"
    unit_integer: "type: integer -> минорные единицы"
    unit_fractional: "type: %{type}, дробный example %{example} -> мажорные единицы"
    unit_unknown: "type: %{type} без дробного example: единицы не выведены"
    unit_confirmed: "; описание подтверждает: %{words}"
    unit_minimum: "; minimum %{minimum} = %{major} %{code}"
    unknown_message: "единицы суммы у поля `%{name}` не выведены (type: %{type}, дробного example нет); без множителя сервис не соберёт запрос — задайте единицы в overlay"
    missing_amount_message: "поле суммы не найдено ни в одной схеме: ни одно имя не совпало с синонимами роли amount в rules/roles.yml, и ни одному полю матчеры не дали эту роль; без множителя сервис не соберёт запрос — добавьте синоним в справочник или задайте роль в overlay"
    inconsistent_description: "поле суммы `%{name}` выведено как %{unit}, а описание говорит о %{said}: %{sentence}; проверьте и закрепите единицы в overlay"
    inconsistent_fraction: "поле суммы `%{name}` выведено как минорные единицы, но %{keyword} = %{value} дробное; минорные единицы всегда целые — проверьте и закрепите единицы в overlay"
    overlay_fragment: |
      - target: "%{path}"
        update:
          x-specgen-amount-unit: %{unit}  # minor | major
          x-specgen-exponent: %{exponent}  # экспонента минорной единицы ISO 4217
