# locales/ru/analyzers.yml — тексты стадии анализа: предупреждения,
# обоснования выведенных значений и заготовки overlay.
#
# Один файл на стадию конвейера, чтобы две стадии не правили один файл.
# Подстановки — %{имя}; набор ключей обязан совпадать с
# locales/en/analyzers.yml, это проверяет spec/unit/specgen/texts_spec.rb.
#
# Значения внутри YAML-фрагментов overlay (`url`, `description: Production`)
# остаются английскими: их читает не человек, а сама спецификация и лексикон
# EnvironmentDetector, который знает только ASCII-слова.

analyzers:
  # Формулировки, общие для нескольких анализаторов: спецификация нарушает
  # форму, заданную OpenAPI, в одном и том же месте по-разному.
  common:
    must_be_object: "`%{key}` должен быть объектом"
    must_be_list: "`%{key}` должен быть списком"

  info:
    name_from_option: "--provider %{given}"
    name_from_title: "из info.title %{title} -> %{slug}"
    name_unknown_message: "имя провайдера не выведено: передайте --provider, чтобы задать имя класса сервиса, его файла и переменных окружения"
    name_unknown_evidence: "ни --provider, ни info.title не дали имени"
    base_url_env_evidence: "соглашение: <PROVIDER>%{suffix} из имени провайдера %{name}"
    base_url_env_unknown: "нет имени провайдера, из которого построить имя переменной окружения"
    servers_absent: "спецификация не объявляет `servers`; сгенерированному сервису неоткуда взять базовый URL по умолчанию"
    servers_malformed: "список `servers` в спецификации пуст или искажён; сгенерированному сервису неоткуда взять базовый URL по умолчанию"
    servers_overlay: |
      - target: "$"
        update:
          servers:
            - url: https://api.example.com
              description: Production
    server_url_missing: "в элементе `servers` нет пригодной строки `url`, элемент пропущен"
    environment_evidence: "%{place} сервера %{text} содержит %{word} -> %{environment}"
    environment_place:
      description: "описание"
      host: "хост"
    environment_unknown_message: "ни описание, ни хост не говорят, песочница это или продакшен; запросы могут уйти не туда"
    environment_unknown_evidence: "ни в описании, ни в хосте нет слова, называющего окружение"
    environment_overlay: |
      - target: "%{path}"
        update:
          description: Production

  auth:
    type_evidence: "запись rules/auth.yml %{entry} совпала по %{facts}"
    credentials_evidence: "запись rules/auth.yml %{entry} читает provider.credentials %{keys}"
    token_url_missing: "поток %{flow} не объявляет tokenUrl, поэтому сгенерированному сервису негде запросить токен"
    key_in_query: "учётные данные едут в query-строке, где их сохраняют логи прокси и история браузера; так решил провайдер, а не генератор"
    param_name_missing: "схема авторизации %{name} не называет параметр, поэтому учётные данные некуда положить"
    scheme_unknown_message: "схема авторизации %{name} не совпала ни с одной записью rules/auth.yml, поэтому сгенерированный сервис не сможет авторизоваться"
    scheme_unknown_evidence: "%{name} не совпала ни с одной записью справочника"
    unknown_overlay: |
      - target: %{path}
        update:
          # перепишите схему в терминах, известных rules/auth.yml,
          # или добавьте запись в этот справочник
          type: http
          scheme: bearer
    security_shape: "`security` должен быть списком объектов требований; значение проигнорировано"
    scheme_shape: "схема авторизации %{name} должна быть объектом; она пропущена"
    undeclared_message: "операции требуют схему авторизации %{names}, которую components.securitySchemes не объявляет"
    undeclared_evidence: "%{name} требуется операциям, но нигде не объявлена"
    multiple_schemes: "схем авторизации в спецификации: %{total}; выбрана %{chosen}, её требуют %{operations}; не используются: %{ignored}"
    absent_message: "спецификация вообще не объявляет авторизацию, поэтому сгенерированные запросы идут без учётных данных; для платёжного API это необычно, сверьтесь с контрактом"
    absent_evidence: "нет components.securitySchemes, ни одна операция не объявляет security"

  operation:
    id_missing: "операция не объявляет operationId; в этом отчёте и в сгенерированном коде она названа %{key}"
    unmapped: "в спецификации слишком мало признаков того, для чего эта операция, поэтому роль не присвоена (%{scores}); задайте роль в overlay"
    ambiguous: "две роли подходят этой операции одинаково хорошо, поэтому ни одна не присвоена (%{scores}); выберите одну в overlay"
    off_contract: "распознана как %{role}, но в Provider::BaseService нет метода для такой роли; она генерируется отдельным публичным методом и остаётся вне контракта"
    tags_shape: "`tags` должен быть списком строк"
    status_unknown: "ключ ответа %{code} — не HTTP-код, не диапазон и не `default`"
    scores: "%{scores} из %{cast} поданных голосов"
    match_evidence: "композитное сопоставление: %{parts} = %{score} из %{cast} поданных голосов; %{runner_up}"
    runner_up: "следующая %{role} %{score}"
    no_runner_up: "больше ничего не набрало голосов"
    no_signal_evidence: "ни один сигнал не совпал ни с одной ролью"
    lost_evidence: "%{reason}: %{scores} из %{cast} поданных голосов (floor %{floor}, minimum %{minimum}, margin %{margin})"
    # Почему роль не присвоена; печатается в начале обоснования.
    reason:
      below_threshold: "ниже порога"
      ambiguous: "неоднозначно"

  parameter:
    role_pending: "роли параметров сопоставляют матчеры полей, это более поздняя стадия"
    shape: "параметр должен быть объектом"
    name_missing: "у параметра должны быть `name` и известный `in`"

  # Точный словарный поиск роли по имени (RoleLookup): уровень 2 доверия,
  # которым анализаторы находят поле суммы, валюты, статуса или кода ошибки
  # до матчеров.
  roles:
    synonym: "имя `%{name}` совпало с синонимом роли %{role} в rules/roles.yml"
    error_code_structure: "поле `%{name}` под родителем `%{parent}`: токен имени и родитель совпали с подсказками роли error_code в rules/roles.yml"

  units:
    unit_name:
      minor: "минорные единицы"
      major: "мажорные единицы"
    currency_overlay: "x-specgen-currency: %{value} на поле суммы"
    currency_listed: "%{keyword}: [%{value}] у поля `%{name}`"
    currency_multiple: "enum поля `%{name}` перечисляет несколько валют: %{values}"
    currency_default: "default: %{value} у поля `%{name}`; enum не задан, поэтому это одна из возможных валют"
    currency_example: "example: %{value} у поля `%{name}`; ни enum, ни default не заданы, поэтому это одна из возможных валют"
    currency_missing: "ни одно поле не совпало с синонимами роли currency в rules/roles.yml"
    currency_silent: "поле `%{name}` совпало с ролью currency, но не задаёт ни enum, ни default, ни example"
    currency_missing_message: "валюта суммы не выведена (%{evidence}); без кода валюты экспоненту ISO 4217 определить нельзя — задайте валюту в overlay"
    currency_multiple_message: "поле `%{name}` допускает несколько валют (%{values}); экспонента зависит от валюты конкретной операции — закрепите валюту в overlay или доработайте генератор под мультивалютность"
    currency_code_message: "кода валюты %{code} нет в таблице ISO 4217 (rules/currencies.yml); взята экспонента по умолчанию %{exponent} — проверьте и закрепите её в overlay"
    currency_overlay_fragment: |
      - target: "%{path}"
        update:
          x-specgen-currency: RUB  # код ISO 4217
    exponent_overlay: "x-specgen-exponent: %{value} на поле суммы"
    exponent_iso: "ISO 4217: экспонента %{code} %{exponent}"
    exponent_default: "экспонента по умолчанию %{exponent} из rules/currencies.yml: кода %{code} нет в таблице ISO 4217"
    exponent_shared: "ISO 4217: у всех валют enum (%{codes}) экспонента %{exponent}"
    exponent_differs: "валюты enum (%{codes}) имеют разные экспоненты по ISO 4217, единый множитель невозможен"
    exponent_unknown: "без кода валюты экспоненту ISO 4217 определить нельзя"
    unit_overlay: "x-specgen-amount-unit: %{value} на поле суммы"
    unit_overlay_bad: "x-specgen-amount-unit: неизвестное значение %{value} (допустимо: %{allowed}); расширение проигнорировано"
    unit_integer: "type: integer -> минорные единицы"
    unit_fractional: "type: %{type}, дробный example %{example} -> мажорные единицы"
    unit_unknown: "type: %{type} без дробного example: единицы не выведены"
    unit_confirmed: "; описание подтверждает: %{words}"
    unit_minimum: "; minimum %{minimum} = %{major} %{code}"
    unknown_message: "единицы суммы у поля `%{name}` не выведены (type: %{type}, дробного example нет); без множителя сервис не соберёт запрос — задайте единицы в overlay"
    missing_amount_message: "поле суммы не найдено ни в одной схеме: ни одно имя не совпало с синонимами роли amount в rules/roles.yml; без множителя сервис не соберёт запрос — добавьте синоним в справочник"
    inconsistent_description: "поле суммы `%{name}` выведено как %{unit}, а описание говорит о %{said}: %{sentence}; проверьте и закрепите единицы в overlay"
    inconsistent_fraction: "поле суммы `%{name}` выведено как минорные единицы, но %{keyword} = %{value} дробное; минорные единицы всегда целые — проверьте и закрепите единицы в overlay"
    overlay_fragment: |
      - target: "%{path}"
        update:
          x-specgen-amount-unit: %{unit}  # minor | major
          x-specgen-exponent: %{exponent}  # экспонента минорной единицы ISO 4217
