# Пример переопределений для spec/fixtures/specs/novapay.yaml.
#
# Спецификация NovaPay говорит об условной обязательности только прозой:
# «Обязательно при type=sbp» в описании поля. Инструмент читает эту прозу
# эвристикой с уверенностью 0.50 и просит подтвердить решение. Действие ниже
# говорит то же самое формально, и после него условие читается как факт
# (1.00), а два предупреждения `conditional_required_hint` из раздела 3
# отчёта исчезают.
#
#   ./integrate --spec spec/fixtures/specs/novapay.yaml \
#     --overlay spec/fixtures/overlays/novapay.yaml
#
# Почему if/then/else, а не dependentRequired. Отчёт печатает по фрагменту на
# каждое условие, и оба адресуют одну схему `Recipient` — склеенные подряд,
# они переопределяют друг друга, и выживает последнее. Оба условия
# выражаются одним действием: `if` называет значение, `then` и `else` —
# реквизиты для него.
#
# `dependentRequired` здесь не подходит принципиально, хотя выглядит короче.
# Он выражает зависимость от НАЛИЧИЯ поля, а не от его ЗНАЧЕНИЯ: запись
# `dependentRequired: { type: [bank_code, card_number] }` читается как «если
# указан type, обязательны и БИК, и номер карты», что для NovaPay неверно —
# нужен ровно один из двух. Кроме того, значение теряется, а вместе с ним
# теряется ветка по способу выплаты в сгенерированном сервисе: не зная, что
# `bank_code` нужен именно при `sbp`, генератор не может разложить реквизиты
# по веткам. Предупреждений стало бы меньше, а кода — хуже.
#
# Ключевые слова `x-jsonschema-*` — из официального реестра расширений
# OpenAPI: в OpenAPI 3.0 сами `if`/`then`/`else` запрещены, и это
# согласованный способ выразить их до перехода на 3.1.
overlay: 1.0.0
info:
  title: NovaPay disambiguation
  version: 1.0.0
actions:
  - target: "$.components.schemas.Recipient"
    description: Условная обязательность реквизитов, заявленная в описании полей
    update:
      x-jsonschema-if:
        properties:
          type:
            const: sbp
      x-jsonschema-then:
        required: [bank_code]
      x-jsonschema-else:
        required: [card_number]
